<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222">
<script type="module">
// A sheet of gs.outdoors.Sea for scripts/sea.cjs: a sandy coast (the shore runs along x and wanders a little, the land
// rises to -z, the bed falls away to +z), a boat riding the swell, a row for each camera and a column for each moment,
// so the swell, the breakers, the swash, the wet sand, the colour by depth and the horizon can be judged (and tuned) by
// eye. It notes what a frame of sea.update() cost and how far the heights sea.height() answers are from the drawn points.
//   ?views=beach,surf,top,open,boat,far   &cols=4   &every=1.5 (seconds between columns)   &cell=420x300   &wind=7   &dir=-1.35
//   &time=15 (hour)   &rain   &gpu (WebGPU)   &warm=6 (seconds before the first column)
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';
const Q = new URLSearchParams(location.search), GPU = Q.has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
try {
  await loadParts();
  if (GPU && !await prepareGPU()) throw new Error('WebGPU did not start in this browser');
  const T = gs.THREE, frame = () => new Promise(r => requestAnimationFrame(r)), M = gs.models;
  const VIEWS = {
    beach: [[0, 1.7, -14], [0, .3, 25]],        // standing on the sand, looking out to sea
    surf: [[-14, 1.1, 1], [8, 0, -1]],          // low at the waterline, along the shore: the swash running up and back
    top: [[2, 20, 3], [2, 0, 3.01]],            // straight down onto the surf and the wet sand
    open: [[0, 2.5, 66], [0, 0, 400]],          // out past the surf, to the horizon
    boat: [[12, 2.6, 46], [20, .2, 58]],        // a boat riding the swell
    far: [[-30, 28, -60], [10, 0, 120]],        // from a headland: the coast and the sea to the horizon
  };
  const views = (Q.get('views') || Object.keys(VIEWS).join(',')).split(','), cols = +(Q.get('cols') || 4), every = +(Q.get('every') || 1.5), [cw, ch] = (Q.get('cell') || '420x300').split('x').map(Number);
  window.__hd.force = 2; window.__hd.upscale = false; window.__hd.hold = false;   // (a sheet: nothing waits, hidden, for its shader)
  const cell = document.createElement('canvas'); cell.width = cw; cell.height = ch; const cx = cell.getContext('2d');
  const sheet = document.createElement('canvas'); sheet.width = cw * cols; sheet.height = ch * views.length; const sx = sheet.getContext('2d'); document.body.append(sheet);
  const v = new gs.hd.HDView({ bg: '#a8c0d8', fog: 0, env: .6, amb: .5 });
  const sun = gs.hd.sun('#fff2e0', 2.2, 40, [.4, .7, .6]); v.scene.add(sun, sun.target); v.sun = sun;
  const sky = new gs.sky.Sky(v, { time: +(Q.get('time') || 15), env: true, clouds: .35 }); v.air({ haze: .0005 });
  // the coast: a beach about 1 in 22, a dune behind it, the bed falling away faster further out
  const shoreZ = x => 5 * Math.sin(x * .021) + 2.5 * Math.sin(x * .057 + 1);
  const prof = z => z < 0 ? Math.min(2.4, -z * .045) + (z < -50 ? Math.min(3, (-50 - z) * .05) : 0) : -z * .045 - .00035 * Math.max(0, z - 50) ** 1.6;
  const bed = (x, z) => prof(z - shoreZ(x)) + .08 * Math.sin(x * .3) * Math.sin(z * .23);
  const land = new gs.outdoors.Land({ kind: bed, size: 320, segments: 200, low: -60, high: 10, material: M.material('sand', { repeat: [80, 80] }) }); v.scene.add(land.object);
  const sea = new gs.outdoors.Sea({ wind: +(Q.get('wind') || 7), dir: +(Q.get('dir') ?? -1.35), bed, view: v });
  v.scene.add(sea.mesh);
  let gpuSteps = 0; { const g = sea.gpuStep.bind(sea); sea.gpuStep = G => { if (G) gpuSteps++; return g(G); }; }
  const boat = M.vehicle('boat', { style: 'rowboat', seed: 3 }); v.scene.add(boat);
  const weather = Q.has('rain') ? new gs.sky.Weather(v, { kind: 'rain', level: true, water: sea, area: 26, max: 900 }) : null;
  if (weather) weather.wet = 1;
  const centre = new T.Vector3(0, 0, 10), info = [], dt = 1 / 30, warm = +(Q.get('warm') ?? 6);
  let cost = 0, n = 0, t = 0, worst = 0;
  const step = secs => {
    for (let i = 0; i < Math.round(secs / dt); i++) {
      const c0 = performance.now(); sea.update(dt, centre); const c = performance.now() - c0; if (t > 1) { cost += c; n++; worst = Math.max(worst, c); }
      // the boat floats where height() says, leaning with normal()
      const bx = 20, bz = 58, y = sea.height(bx, bz), nn = sea.normal(bx, bz); boat.position.set(bx, y - .12, bz); boat.rotation.set(Math.atan2(nn.z, nn.y) * .8, .7, -Math.atan2(nn.x, nn.y) * .8);
      sky.update(dt); weather?.update(dt); v.t = (v.t || 0) + dt; t += dt;
    }
  };
  step(warm);
  for (let c = 0; c < cols; c++) {
    if (c) step(every);
    for (let r = 0; r < views.length; r++) {
      const V = VIEWS[views[r]]; if (!V) throw new Error('no view ' + views[r] + ': ' + Object.keys(VIEWS).join(', '));
      v.cam.fov = 50; v.cam.aspect = cw / ch; v.cam.near = .1; v.cam.far = 6000; v.cam.updateProjectionMatrix(); v.cam.position.set(...V[0]); v.cam.lookAt(...V[1]); v.cam.updateMatrixWorld();
      v.cut?.(); sun.follow(V[1][0], 0, V[1][2]);
      for (let k = 0; k < (c || r ? 2 : 8); k++) { v.render(cx, cw, ch); await frame(); }
      sx.drawImage(cell, c * cw, r * ch);
      sx.font = '11px sans-serif'; sx.fillStyle = '#000'; sx.fillText(`${views[r]}  t ${t.toFixed(1)}s`, c * cw + 4, r * ch + 12);
    }
  }
  // the drawn points against height(): every point of the patch, and the far ring's first row
  const g = sea.mesh.geometry.attributes.position.array, p = sea.mesh.position; let off = 0, offAt = null, k0 = 0;
  for (let k = 0; k < g.length; k += 3) { const x = g[k] + p.x, z = g[k + 2] + p.z, d = Math.abs(sea.height(x, z) - g[k + 1]); if (bed(x, z) > sea.height(x, z) + .3) continue; if (d > off) { off = d; offAt = [x.toFixed(1), z.toFixed(1)]; } k0++; }
  info.push(`sea.update ${(cost / n).toFixed(3)} ms a frame, worst ${worst.toFixed(2)}; height() against the drawn points: at most ${off.toFixed(4)} m off (${k0} points${offAt ? ', worst at ' + offAt : ''})`);
  info.push(`swell: ${sea.list.map(w => `${w.length.toFixed(0)} m x ${w.height.toFixed(2)}`).join(', ')}; shore waves every ${sea.sea.period.toFixed(1)} s, ${sea.sea.H0.toFixed(2)} m, feel the bottom at ${sea.sea.feel.toFixed(1)} m; wet sand at the boat's beach ${sea.wetAt(2, -1).toFixed(2)}`);
  { const W = sea.sea.wet, C = W?.mesh.geometry.attributes.color.array; let k = 0; if (C) for (let i = 3; i < C.length; i += 4) if (C[i] > .05) k++; info.push(`wet sheet: in ${W?.mesh.parent?.type || 'nothing'}, ${k} of ${C ? C.length / 4 : 0} points dark`); }
  if (GPU) info.push(`fine waves made on the graphics chip ${gpuSteps} times`);
  window.result = { sheet: sheet.toDataURL(), info, backend: window.__hd.info.backend };
} catch (e) { window.result = { error: String(e && e.stack || e) }; }
</script>
