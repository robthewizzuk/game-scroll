<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<script type="module">
// A night street through a lens (v.lens), to judge by eye: node scripts/detail-test.cjs --page lens-show [--webgpu] --shots dir.
// A person-sized post 3.2 m off under a lamp, a wet road and a row of lamps and lit windows going away, drawn
// without a lens, then through a 50 mm lens at f/1.4 focused on the post (the far lamps open into discs), the same
// with six blades, and focused on the far lamps (the post goes soft). Checked: focused on the post the far lamps
// blur, focused far they are as sharp as with no lens, and the post goes soft.
//   ?gpu  ?w=360&h=480  ?frames=16
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';
const Q = new URLSearchParams(location.search), GPU = Q.has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
await loadParts();
if (GPU && !await prepareGPU()) { window.result = { error: 'WebGPU did not start in this browser' }; throw new Error(window.result.error); }
const T = gs.THREE, HD = window.__hd, W = +(Q.get('w') || 360), H = +(Q.get('h') || 480), FR = +(Q.get('frames') || 16);
HD.force = 2; HD.upscale = false; HD.grain = 0; HD.still = false; HD.hold = false; HD.spread = false;
const frame = () => new Promise(r => requestAnimationFrame(r));
const checks = [], info = {}, out = {};
const check = (name, ok, note) => checks.push({ name, ok: !!ok, note });
try {
  const v = new gs.hd.HDView({ bg: '#070a14', fog: 0, env: .08, amb: .06 }), c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  v.bloom = .4; v.cam.near = .1; v.cam.far = 400; v.cam.fov = 2 * Math.atan(12 / 50) * 180 / Math.PI; v.cam.updateProjectionMatrix();
  const moon = gs.hd.sun('#8aa0d0', .25, 30, [.3, .6, -.4]); v.scene.add(moon, moon.target); v.sun = moon;
  const mk = (geo, mat, px, py, pz) => { const m = new T.Mesh(geo, mat); m.position.set(px, py, pz); m.castShadow = m.receiveShadow = true; v.scene.add(m); return m; };
  mk(new T.PlaneGeometry(14, 160).rotateX(-Math.PI / 2), gs.hd.pbr('#1c1d21', { rough: .25, wet: .9 }), 0, 0, -70);
  mk(new T.PlaneGeometry(4, 160).rotateX(-Math.PI / 2), gs.hd.pbr('#4a4744', { rough: .8 }), -9, .12, -70);
  mk(new T.PlaneGeometry(4, 160).rotateX(-Math.PI / 2), gs.hd.pbr('#4a4744', { rough: .8 }), 9, .12, -70);
  const wallM = gs.hd.pbr('#3a2e2a', { rough: .9 }), lit = new T.MeshStandardMaterial({ color: '#000', emissive: '#ffbf70', emissiveIntensity: 6 }), cool = new T.MeshStandardMaterial({ color: '#000', emissive: '#9fc8ff', emissiveIntensity: 5 });
  const R = gs.math.rng(7);
  for (const side of [-1, 1]) {
    mk(new T.BoxGeometry(2, 18, 160), wallM, side * 12, 9, -70);
    for (let z = -6; z > -150; z -= 4.5) for (let y = 2.5; y < 16; y += 3.4) if (R() < .45) mk(new T.PlaneGeometry(1.3, 1.7), R() < .75 ? lit : cool, side * 10.98, y, z).rotation.y = -side * Math.PI / 2;
  }
  // street lamps down both sides: a glowing head each, the nearest few with real lights
  const head = new T.MeshStandardMaterial({ color: '#000', emissive: '#ffd59a', emissiveIntensity: 60 }), poleM = gs.hd.pbr('#202326', { rough: .5, metal: .7 });
  const spots = [];
  for (const side of [-1, 1]) for (let z = side < 0 ? -4 : -10; z > -150; z -= 12) {
    mk(new T.CylinderGeometry(.06, .09, 6, 8), poleM, side * 6.5, 3, z);
    mk(new T.SphereGeometry(.16, 14, 10), head, side * 5.8, 5.9, z);
    spots.push({ x: side * 5.8, y: 5.75, z, col: '#ffcf8a', i: 30, reach: 16 });
  }
  v.lampLights?.(16);
  // the subject: a striped post, person height, 2.4 m off
  const cv = document.createElement('canvas'); cv.width = 8; cv.height = 64; { const g = cv.getContext('2d'); for (let i = 0; i < 64; i++) { g.fillStyle = (i >> 2) % 2 ? '#e8dcc6' : '#b03020'; g.fillRect(0, i, 8, 1); } }
  const tex = new T.CanvasTexture(cv); tex.colorSpace = T.SRGBColorSpace; tex.magFilter = T.NearestFilter;
  const post = mk(new T.CylinderGeometry(.1, .1, 1.75, 20), new T.MeshStandardMaterial({ map: tex, roughness: .55 }), -.42, .875, -3.2);
  const fill = new T.PointLight('#ffd7a8', 6, 6, 2); fill.position.set(.6, 2.2, -1.8); v.scene.add(fill);
  const look = () => { v.cam.position.set(0, 1.5, 0); v.cam.lookAt(0, 1.6, -30); v.cam.updateMatrixWorld(); };
  look();
  const grab = () => x.getImageData(0, 0, W, H).data.slice();
  const pic = px => { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d'), im = g.createImageData(W, H); im.data.set(px); g.putImageData(im, 0, 0); return cv.toDataURL(); };
  const draw = async (n = 1) => { for (let i = 0; i < n; i++) { v.placeLamps?.(spots, v.cam.position.x, v.cam.position.y, v.cam.position.z, 0); v.render(x, W, H); await frame(); } x.getImageData(0, 0, 1, 1); };
  async function shoot(name, lens) { v.lens = lens; look(); v.cut(); await draw(FR); const px = grab(); out[name] = pic(px); return px; }
  const lum = (px, i) => .2126 * px[i] + .7152 * px[i + 1] + .0722 * px[i + 2];
  // the far lamps and windows (the top third) against the picture with no lens, and how sharp the post's stripes are (the steepest step down it)
  const top = (a, b) => { let d = 0; for (let i = 0; i < W * Math.floor(H / 3) * 4; i += 4) d += Math.abs(lum(a, i) - lum(b, i)); return d / (W * Math.floor(H / 3)); };
  // (where the post is on screen: after a frame, once the view has set the camera's shape)
  let pX, pY; const at = () => { const ps = new T.Vector3(-.42, 1.3, -3.2).project(v.cam); pX = Math.round((ps.x * .5 + .5) * W); pY = Math.round((-ps.y * .5 + .5) * H); };
  const edge = px => { let m = 0; for (let y = pY - 60; y < pY + 60; y++) m = Math.max(m, Math.abs(lum(px, (y * W + pX) * 4) - lum(px, ((y + 1) * W + pX) * 4))); return m; };
  const lens = { focal: 50, fstop: 1.4, focus: post, pull: 0 };
  const plain = await shoot('plain', null);
  const near = await shoot('f1.4-on-post', { ...lens });
  await shoot('f1.4-six-blades', { ...lens, blades: 6, turn: 15 });
  const far = await shoot('f1.4-on-far-lamps', { ...lens, focus: 40 });
  await shoot('f8-on-post', { ...lens, fstop: 8 });
  at();
  info.background = { onPost: +top(near, plain).toFixed(1), onFar: +top(far, plain).toFixed(1) };
  info.postEdge = { onPost: +edge(near).toFixed(1), onFar: +edge(far).toFixed(1), at: [pX, pY] };
  check('focused on the post, the far lights blur; focused far, they come back sharp', info.background.onFar < info.background.onPost * .5, JSON.stringify(info.background));
  check('focused far, the post goes soft', info.postEdge.onFar < info.postEdge.onPost * .6, JSON.stringify(info.postEdge));
  window.result = { checks, info, out };
} catch (e) { window.result = { error: (e && e.stack) || String(e) }; }
</script>
