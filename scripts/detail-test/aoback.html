<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<script type="module">
// Ambient occlusion on the light that bounces only (HD.aoBack; hd3d-gpu.js aoInShading, GpuChain.aoScene) for
// scripts/detail-test.cjs --page aoback --webgpu: a sunlit corner with crates against a wall and a shaded one behind a
// screen, drawn with the occlusion on the whole picture (as before) and in each thing's own shading. Checks that sunlit
// places it used to darken are lighter and none darker, that shaded corners keep it, that just after a cut a frame
// takes none and the next ones have it back, that a still picture stops changing, that a moving camera reads last
// frame's occlusion in the right places, and that no shader text is written for the scene's things when the chain is
// built anew (a quality step; a second view's: scripts/shader-hold.cjs).
//   ?gpu  ?tier=2  ?w=240&h=320
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';
const Q = new URLSearchParams(location.search), GPU = Q.has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
await loadParts();
const G = GPU ? await prepareGPU() : null;
if (GPU && !G) { window.result = { error: 'WebGPU did not start in this browser' }; throw new Error(window.result.error); }
const T = gs.THREE, HD = window.__hd, W = +(Q.get('w') || 240), H = +(Q.get('h') || 320);
HD.force = +(Q.get('tier') ?? 2); HD.upscale = false; HD.grain = 0; HD.still = false; HD.hold = false; HD.spread = false;
const frame = () => new Promise(r => requestAnimationFrame(r));
const checks = [], info = {}, out = {};
const check = (name, ok, note) => checks.push({ name, ok: !!ok, note });
// shader text written for the scene's own things (not the chain's full-screen passes), as shader-hold counts it
const written = []; let scene = null, phase = '';
if (G) {
  const N = G.r._nodes, nf = N.getForRender.bind(N), kept = N.nodeBuilderCache;
  N.getForRender = (ro, ...a) => {
    const key = N.getForRenderCacheKey(ro), had = kept.has(key), own = ro.scene === scene, name = ro.material?.name || ro.material?.type || '?';
    const note = () => { if (own && !had && kept.has(key)) written.push(name + (ro.camera?.isOrthographicCamera ? ' (shadow map)' : '') + (phase ? ' ' + phase : '')); };
    const o = nf(ro, ...a); if (o?.then) o.then(note, () => {}); else note(); return o;
  };
}
try {
  if (!GPU) { check('WebGL lays the occlusion on the whole picture, as before (nothing to compare)', true); throw 0; }
  const v = new gs.hd.HDView({ bg: '#9ab4d0', fog: 0, amb: .5 }), c = document.createElement('canvas'); c.width = W; c.height = H; scene = v.scene;
  const x = c.getContext('2d', { willReadFrequently: true });
  const sun = gs.hd.sun('#fff2d8', 3.2, 12, [.35, 1, .9]); v.scene.add(sun, sun.target); v.sun = sun; sun.follow(0, 0, 0);
  const box = (w, h, d, col, px, py, pz, name) => { const m = new T.Mesh(gs.hd.rbox(w, h, d), gs.hd.pbr(col, { rough: .8 })); m.material.name = name; m.position.set(px, py, pz); m.castShadow = m.receiveShadow = true; v.scene.add(m); return m; };
  box(14, .2, 14, '#c8bfae', 0, -.1, 0, 'floor'); box(14, 3, .3, '#ddd4c4', 0, 1.5, -2, 'wall'); box(.3, 3, 6, '#ddd4c4', -3.2, 1.5, 1, 'side wall');
  // sunlit crates against the wall, and a dark one; a screen that shades the corner on the right
  box(.8, .8, .8, '#b84a3a', -1.6, .4, -1.4, 'crate'); box(.8, .8, .8, '#dcdcd4', -.5, .4, -1.3, 'crate'); box(.8, .8, .8, '#2a2a30', .6, .4, -1.4, 'crate');
  box(.15, 2.6, 3, '#6a6458', 2.1, 1.3, .3, 'screen'); box(.7, .7, .7, '#8a8a80', 2.9, .35, -1.4, 'crate');
  const P0 = { p: [.2, 1.8, 4.6], at: [.2, .5, -1.4] }, P1 = { p: [-1.4, 1.5, 4.2], at: [-.4, .6, -1.4] };
  const pose = (a, b, t) => { const L = (p, q) => p + (q - p) * t; v.cam.position.set(L(a.p[0], b.p[0]), L(a.p[1], b.p[1]), L(a.p[2], b.p[2])); v.cam.lookAt(L(a.at[0], b.at[0]), L(a.at[1], b.at[1]), L(a.at[2], b.at[2])); v.cam.updateMatrixWorld(); };
  const draw = async () => { v.t = 0; v.render(x, W, H); x.getImageData(0, 0, 1, 1); await frame(); };
  const grab = () => x.getImageData(0, 0, W, H).data.slice();
  const lum = (d, i) => .2126 * d[i] + .7152 * d[i + 1] + .0722 * d[i + 2];
  const apart = (a, b) => { let sum = 0, big = 0; const n = a.length / 4; for (let i = 0; i < a.length; i += 4) { const d = Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2])); sum += d; if (d > 24) big++; } return { mean: +(sum / n).toFixed(2), big: +(100 * big / n).toFixed(2) }; };
  const pic = px => { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d'), im = g.createImageData(W, H); im.data.set(px); g.putImageData(im, 0, 0); return cv.toDataURL(); };
  const settle = async n => { for (let i = 0; i < n; i++) await draw(); };

  // where the sun falls: drawn with the sun and without, the occlusion as before both times
  HD.aoBack = false; pose(P0, P0, 0); v.cut(); await settle(20);
  const old = grab(); sun.intensity = 0; await settle(12); const dark = grab(); sun.intensity = 3.2; await settle(12);
  HD.aoBack = true; v.cut(); await settle(20); const now = grab();
  out.before = pic(old); out.after = pic(now);
  const dpx = new Uint8ClampedArray(old.length);
  let lit = 0, litChanged = 0, litDarker = 0, litLighter = 0, shade = 0, shadeOff = 0, shadeSum = 0;
  for (let i = 0; i < old.length; i += 4) {
    const d = lum(now, i) - lum(old, i), sunlit = lum(old, i) - lum(dark, i) > 20;
    dpx[i] = dpx[i + 1] = dpx[i + 2] = Math.max(0, Math.min(255, 128 + d * 8)); dpx[i + 3] = 255;
    if (sunlit) { lit++; if (Math.abs(d) > 2) { litChanged++; if (d > 0) litLighter++; else litDarker++; } }
    else { shade++; shadeSum += Math.abs(d); if (Math.abs(d) > 24) shadeOff++; }
  }
  out.change = pic(dpx);
  info.sunlit = { pixels: lit, changed: litChanged, lighter: litLighter, darker: litDarker };
  info.shaded = { pixels: shade, mean: +(shadeSum / Math.max(1, shade)).toFixed(2), offBy24: shadeOff };
  check('sunlit places the occlusion darkened are lighter now', litChanged > W * H * .002 && litLighter >= litChanged * .9, `${litLighter} of ${litChanged} changed sunlit pixels lighter, ${litDarker} darker`);
  check('shaded corners keep their occlusion', shade > 0 && shadeSum / shade < 3 && shadeOff <= shade * .002, `mean change ${info.shaded.mean}/255 in shade, ${shadeOff} pixels off by more than 24`);

  // held still: the picture stops changing (the still-frame check needs it); a cut takes none for a frame, then it is back
  await draw(); const a1 = grab(); await draw(); const a2 = grab();
  check('held still, the picture stops changing', apart(a1, a2).mean < .05, JSON.stringify(apart(a1, a2)));
  v.cut(); await draw(); const cut0 = grab(); await settle(3); const cut3 = grab();
  info.afterCut = { first: apart(cut0, now), third: apart(cut3, now) };
  check('the frame after a cut takes none from before it, and the frames after have it back', apart(cut0, now).mean > apart(cut3, now).mean && apart(cut3, now).mean < .3, JSON.stringify(info.afterCut));

  // a moving camera: each frame reads last frame's occlusion where the point was then; against the same place held still
  const N = 30;
  for (let i = 1; i <= N; i++) { pose(P0, P1, i / N); await draw(); }
  const moving = grab(); await settle(12); const held = grab();
  info.moving = apart(moving, held); out.moving = pic(moving);
  check('while the camera moves, the occlusion stays in its places', info.moving.mean < 1.5 && info.moving.big < .5, JSON.stringify(info.moving));

  // no shader text for the scene's things when the chain is built anew (spread on, the tier stepped; a second view: shader-hold.cjs)
  written.length = 0;
  phase = '(spread on)'; HD.spread = true; await settle(8); phase = '(tier stepped)'; HD.force = HD.force === 2 ? 3 : 2; await settle(8); phase = '(back)'; HD.spread = false; HD.force = +(Q.get('tier') ?? 2); await settle(8); phase = '';
  info.written = written.slice(0, 12);
  // (the old way gave the scene pass a context of its own, and every one of the scene's materials was built again for each new
  // chain. One thing here, the side wall, is drawn in a picture of another layout after each new chain on main as well, and
  // built again there: a matter for the shader stutter work, not this one)
  const mats = new Set(written.map(w => w.replace(/ \(.*$/, '')));
  check('the scene\'s materials are not built again when the chain is built anew (spread switched, the tier stepped)', mats.size <= 1, written.length ? written.join(', ') : 'none');
  info.backend = HD.info.backend;
} catch (e) { if (e !== 0) window.result = { error: String(e && e.stack || e) }; }
window.result ||= { checks, info, out };
</script>
