<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<script type="module">
// Real surface detail (gs.models.relief: src/kit/relief.js, relief-build.js) for scripts/detail-test.cjs
// --page relief: a tiled roof, a brick house and a tree trunk drawn flat (as before: a normal map, and the
// parallax shader on WebGPU), then with their reliefs, to compare the pictures near and far, count what
// each drew, measure how much each flickers under a slowly moving camera, and check the game's meshes
// are left as they were.
//   ?gpu  WebGPU    ?tier=2    ?w=360&h=480    ?cams=roof,wall,far
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';

import { begin, end } from '../../src/kit/slices.js';
const Q = new URLSearchParams(location.search), GPU = Q.has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
await loadParts();
if (GPU && !await prepareGPU()) { window.result = { error: 'WebGPU did not start in this browser' }; throw new Error(window.result.error); }
const T = gs.THREE, HD = window.__hd, W = +(Q.get('w') || 360), H = +(Q.get('h') || 480);

HD.force = +(Q.get('tier') ?? 2); HD.upscale = false; HD.grain = 0;

    for (let j = 0; j < rows; j++) for (let i = -1; i <= per; i++) {

      const g = col.createLinearGradient(x, 0, x + tw, 0); g.addColorStop(0, `hsl(${hue},${sat}%,${l * .5}%)`); g.addColorStop(.42, `hsl(${hue},${sat}%,${l * 1.18}%)`); g.addColorStop(1, `hsl(${hue},${sat}%,${l * .45}%)`);
      col.fillStyle = g; col.fillRect(x, y, tw, th);

    }

      const y = j * th, lap = h.createLinearGradient(0, y, 0, y + th), sh = col.createLinearGradient(0, y, 0, y + 10);
      lap.addColorStop(0, 'rgba(0,0,0,.5)'); lap.addColorStop(1, 'rgba(0,0,0,0)'); h.fillStyle = lap; h.fillRect(0, y, S, th);

// a gable roof: two slopes that meet at the ridge, each with its own points, UVs in metres

}
function scene() {

  const sun = gs.hd.sun('#fff2d8', 3, 30, [-.5, .8, .45]); v.scene.add(sun, sun.target); v.sun = sun; sun.follow(0, 0, 0);
  const ground = new T.Mesh(new T.PlaneGeometry(80, 80).rotateX(-Math.PI / 2), gs.hd.pbr('#6f8a52', { rough: .9 })); ground.receiveShadow = true; v.scene.add(ground);
  const roofMesh = new T.Mesh(roof(8, 6, 2.2, .38), gs.hd.pbr('#ffffff', { tex: tiles(), rough: .78, depth: .024 })); roofMesh.position.set(-6, 2.6, 0); roofMesh.castShadow = roofMesh.receiveShadow = true; v.scene.add(roofMesh);
  const walls = new T.Mesh(new T.BoxGeometry(7.4, 2.6, 5.4), gs.hd.pbr('#e6dcc6', { rough: .9 })); walls.position.set(-6, 1.3, 0); walls.castShadow = walls.receiveShadow = true; v.scene.add(walls);
  const house = gs.models.building({ style: 'brick', w: 6, d: 5, floors: 1, roof: 'flat', seed: 3 }); house.position.set(5, 0, 0); v.scene.add(house);
  const wall = house.children.find(m => m.name === 'wall');
  const trunk = new T.Mesh(new T.CylinderGeometry(.4, .5, 3.2, 28, 1, true), gs.models.material('bark', { repeat: [3, 3] })); trunk.position.set(0, 1.6, 4); trunk.castShadow = trunk.receiveShadow = true; v.scene.add(trunk);

const out = {}, info = {}, pix = {}, checks = [];
const CAMS = { roof: [[-9.5, 3.6, 5.2], [-4, 3.4, 0]], wall: [[1.2, 1.5, 3.3], [6.5, 1.5, 2.3]], trunk: [[.9, 1.7, 5.6], [0, 1.6, 4]], far: [[4, 14, 46], [0, 2, 0]] };
const check = (name, ok, note = '') => checks.push({ name, ok: !!ok, note: String(note) });
const draw = async (S, frames = 1) => { for (let i = 0; i < frames; i++) { S.v.t = 0; S.v.render(S.x, W, H); if (i < frames - 1) await nextFrame(); } };

// how much the picture flickers: the camera slides a few centimetres over 16 frames; what changes from frame
// to frame beyond the slide itself (the middle value of the frames, after the view has settled where it
// starts, so a shader that arrives part-way, a one-off change, is not counted as flicker)
async function flicker(S, at, to) {
  const frames = [], each = [];
  S.v.cam.position.set(...at); S.v.cam.lookAt(...to); S.v.cam.updateMatrixWorld();
  for (let i = 0; i < 12; i++) { await draw(S, 2); await new Promise(r => setTimeout(r, 150)); }
  for (let i = 0; i < 16; i++) { S.v.cam.position.set(at[0] + i * .012, at[1], at[2]); S.v.cam.lookAt(...to); S.v.cam.updateMatrixWorld(); await draw(S, 2); frames.push(S.x.getImageData(0, 0, W, H).data); }
  for (let f = 2; f < frames.length; f++) { const a = frames[f - 2], b = frames[f - 1], c = frames[f]; let s = 0; for (let i = 0; i < a.length; i += 4) s += Math.abs(b[i + 1] - (a[i + 1] + c[i + 1]) / 2); each.push(s / (a.length / 4)); }

}
try {
  let R = null;

    const t0 = performance.now(), S = scene(); let build = 0;
    S.v.cam.position.set(...CAMS.roof[0]); S.v.cam.lookAt(...CAMS.roof[1]);
    if (mode === 'relief') {
      R = S;
      const before = [S.roofMesh, S.wall, S.trunk].map(m => m.geometry);
      gs.models.relief(S.roofMesh); gs.models.relief(S.wall, { depth: .012 }); gs.models.relief(S.trunk, { depth: .03 });
      check('a mesh says its relief is being built', S.roofMesh.userData.relief === 'building');
      const n = await gs.models.relief.ready(S.v.scene); build = performance.now() - t0;
      check('the three reliefs arrived', n === 3, n + ' of 3 after ' + Math.round(build) + ' ms' + [S.roofMesh, S.wall, S.trunk].map(m => ' ' + (reliefOf(m)?.error || '')).join(''));
      for (let i = 0; i < 400 && twins(S).length < 3; i++) { await draw(S); await new Promise(r => setTimeout(r, 30)); }
      check('the view draws them through cluster detail', twins(S).length === 3, twins(S).length + ' of 3');
      check('the game\'s meshes keep their own geometry', [S.roofMesh, S.wall, S.trunk].every((m, i) => m.geometry === before[i]));
      info.reliefs = Object.fromEntries([['roof', S.roofMesh], ['wall', S.wall], ['trunk', S.trunk]].map(([k, m]) => { const r = reliefOf(m); return [k, r?.info ? { from: (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3, tris: r.info.tris, split: r.info.split, full: r.info.full, depth: +r.info.depth.toFixed(4), fine: +r.info.fine.toFixed(4), levels: r.clusters.levels, coarse: r.clusters.coarseTris } : null]; }));
      if (Q.has('errors')) info.errors = Object.fromEntries([['roof', S.roofMesh], ['wall', S.wall], ['trunk', S.trunk]].map(([k, m]) => { const c = reliefOf(m).clusters, e = Array.from(c.gError).sort((a, b) => a - b); return [k, { byLevel: Array.from(c.tris), groups: e.length, errors: [0, .25, .5, .75, .9, .97, 1].map(q => +e[Math.min(e.length - 1, Math.floor(q * e.length))].toFixed(4)) }]; }));
    }
    for (const [name, [at, to]] of Object.entries(CAMS)) {
      if (Q.get('cams') && !Q.get('cams').split(',').includes(name)) continue;
      S.v.cam.position.set(...at); S.v.cam.lookAt(...to); S.v.cam.updateMatrixWorld();
      await draw(S, 6);
      out[mode + '-' + name] = S.c.toDataURL(); pix[mode + '-' + name] = S.x.getImageData(0, 0, W, H).data;
      info[mode + '-' + name] = { backend: HD.info.backend, tris: HD.info.tris, calls: HD.info.calls, detail: { ...HD.info.detail }, build: Math.round(build) };
      if (mode === 'relief') info[mode + '-' + name].each = Object.fromEntries([['roof', S.roofMesh], ['wall', S.wall], ['trunk', S.trunk]].map(([k, m]) => [k, Math.max(0, ...(S.v.details.map.get(m)?.twin?._views.get(S.v.cam) || []).map(r => r.tris))]));
    }

  }

    info['relief-' + name].diff = { mean: +(sum / (a.length / 4)).toFixed(3), off: +(off / (a.length / 4) * 100).toFixed(3) };
  }

    check('far away the picture is as it was', d.mean < 2.5 && d.off < 1.5, `mean ${d.mean} of 255, ${d.off}% of pixels off`);
    check('far away the reliefs cost a fraction of their triangles', info['relief-far'].detail.tris < full * .12, `${info['relief-far'].detail.tris} of ${full}`);
  }
  if (pix['flat-roof']) check('close up the relief is real geometry', info['relief-roof'].detail.tris > 3000 && info['relief-roof'].diff.mean > .5, `${info['relief-roof'].detail.tris} triangles, mean ${info['relief-roof'].diff.mean} from flat`);
  // the game's meshes are as they were; taking a relief off puts the mesh back
  const S = R, v = S.v;
  v.cam.position.set(...CAMS.roof[0]); v.cam.lookAt(...CAMS.roof[1]); v.cam.updateMatrixWorld();
  const ray = new T.Raycaster(new T.Vector3(-6, 12, 1.5), new T.Vector3(0, -1, 0)), hits = ray.intersectObjects(v.scene.children, true);
  check('a ray hits the game\'s own roof (two triangles a slope), never the relief', hits.length > 0 && hits[0].object === S.roofMesh && hits.every(h => !h.object.isDetailMesh), hits.map(h => h.object.isDetailMesh ? 'twin' : h.object.name || h.object.type).join(' '));

  check('relief(mesh, false) draws it as it was', !v.details.map.has(S.trunk) && tw && !tw.parent && (S.trunk.layers.mask & 1) && S.trunk.userData.relief === undefined);

  HD.detail = true;
  for (let i = 0; i < 400 && twins(S).length < 2; i++) { await draw(S); await new Promise(r => setTimeout(r, 30)); }   // (on WebGPU a new twin waits for its shader)

  {

    const late = new T.Mesh(new T.CylinderGeometry(.4, .5, 3.2, 28, 1, true), gs.models.material('bark', { repeat: [3, 3], seed: 9 }));

    await waits; const n = await gs.models.relief.ready(late), tris = reliefOf(late)?.info?.tris;

  }

</script>
