# Deploys the shared heart counts backend (workers/hearts: a Cloudflare Worker + D1 database).
#
# One-time setup:
#   1. The CLOUDFLARE_API_TOKEN repository secret (already used by games-r2.yml) also needs
#      "Workers Scripts: Edit" and "D1: Edit" on this account, plus "Workers Routes: Edit" and
#      "Zone: Read" on the game-scroll.com zone (for the api.game-scroll.com custom domain).
#      Edit the token in the Cloudflare dashboard (My Profile -> API Tokens).
#
# The first run creates the D1 database "game-scroll-hearts"; later runs reuse it.
name: Hearts backend (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ['workers/hearts/**', '.github/workflows/hearts-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hearts-worker
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 4d04f07305a8d0b2efd5221d16d92e35
  DB_NAME: game-scroll-hearts

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/hearts
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/hearts/package-lock.json

      - name: Install
        run: npm ci

      - name: Test locally
        run: npx wrangler d1 migrations apply "$DB_NAME" --local && npm test

      - name: Check the built-in Apple App Attest root matches apple.com
        run: |
          curl -fsS https://www.apple.com/certificateauthority/Apple_App_Attestation_Root_CA.pem -o apple.pem
          want=$(openssl x509 -in apple.pem -noout -fingerprint -sha256 | cut -d= -f2)
          node -e "import('./src/appattest.js').then(m=>process.stdout.write(m.APPLE_ROOT_PEM))" > ours.pem
          have=$(openssl x509 -in ours.pem -noout -fingerprint -sha256 | cut -d= -f2)
          echo "apple.com: $want"; echo "built in:  $have"
          [ "$want" = "$have" ] || { echo "::error::The Apple root in src/appattest.js doesn't match apple.com"; exit 1; }

      - name: Check the token is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (see the top of this file)."; exit 1
          fi

      - name: Find or create the database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          id=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s).find(x=>x.name===process.env.DB_NAME);process.stdout.write(d?d.uuid:'')})")
          if [ -z "$id" ]; then
            npx wrangler d1 create "$DB_NAME"
            id=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s).find(x=>x.name===process.env.DB_NAME);process.stdout.write(d?d.uuid:'')})")
          fi
          [ -n "$id" ] || { echo "::error::Could not find or create the D1 database. Does the token have D1: Edit?"; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml

      - name: Rows read by query, last 24 hours
        # D1 bills by rows read. This lists the queries that read most (from before this deploy), so a costly
        # one shows in the run's summary. Information only: it needs "Account Analytics: Read" on the token.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 insights "$DB_NAME" --time-period 1d --sort-by reads --limit 12 --json > insights.json
          node -e '
            const q = JSON.parse(require("fs").readFileSync("insights.json", "utf8")), n = x => Math.round(Number(x) || 0).toLocaleString("en-GB");
            const total = q.reduce((a, r) => a + (r.totalRowsRead || 0), 0);
            console.log(`### D1 rows read, last 24 hours: ${n(total)} in the top ${q.length} queries\n\n| Rows read | Runs | Per run | Query |\n| --: | --: | --: | --- |`);
            for (const r of q) console.log(`| ${n(r.totalRowsRead)} | ${n(r.numberOfTimesRun)} | ${n(r.avgRowsRead)} | \`${String(r.query).replace(/\s+/g, " ").replace(/[|`]/g, "").slice(0, 240)}\` |`);
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create the pass-signing secret (first run only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # The Worker must exist before it can hold a secret, so a brand-new Worker gets it after deploy.
          if npx wrangler secret list --format json 2>/dev/null | grep -q '"SESSION_SECRET"'; then echo "SESSION_SECRET already set"; exit 0; fi
          if npx wrangler secret list --format json >/dev/null 2>&1; then
            openssl rand -base64 48 | npx wrangler secret put SESSION_SECRET
          else echo "NEW_WORKER=1" >> "$GITHUB_ENV"; fi

      - name: Update the database tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply "$DB_NAME" --remote

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deploy
          if [ "${NEW_WORKER:-}" = "1" ]; then openssl rand -base64 48 | npx wrangler secret put SESSION_SECRET; fi
          echo "API deployed to https://api.game-scroll.com" | tee -a "$GITHUB_STEP_SUMMARY"
