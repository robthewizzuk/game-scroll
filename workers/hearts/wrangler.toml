# Game Scroll hearts: a Cloudflare Worker + D1 database that keeps one shared heart count per game.
# Deployed by .github/workflows/hearts-worker.yml (which fills in database_id), or by hand with
#   npx wrangler d1 migrations apply game-scroll-hearts --remote && npx wrangler deploy
name = "game-scroll-hearts"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Only reachable at api.game-scroll.com, where the zone's WAF rate limit applies (the workers.dev
# address would skip it).
workers_dev = false
preview_urls = false

# Served at api.game-scroll.com (Rob's domain on this Cloudflare account). Cloudflare makes the DNS record.
# play.game-scroll.com/<game id> serves the page that shared game links open.
routes = [
  { pattern = "api.game-scroll.com", custom_domain = true },
  { pattern = "play.game-scroll.com", custom_domain = true },
]

[vars]
# "on" = hearts need a pass from App Attest / Play Integrity. Leave "off" until the app is in the
# App Store and Play Store, or today's sideloaded test builds can't add hearts.
ENFORCE = "off"
# Apple Team ID + bundle id, e.g. "ABCDE12345.com.gamescroll.app" (needs the paid Apple account).
APPLE_APP_ID = ""
# "on" accepts App Attest from development builds (Xcode installs). Off for the store.
APPLE_ALLOW_DEV = "off"
# "on" accepts Play Integrity from a genuine phone even if the app wasn't installed from Play.
ANDROID_ALLOW_SIDELOAD = "off"
# Secrets (set with wrangler secret put, never in this file):
#   SESSION_SECRET         signs challenges and passes; the deploy workflow creates it once
#   GOOGLE_SERVICE_ACCOUNT JSON key for the Play Integrity decode API
# "Play in your browser" on shared-link pages (the test website for now; empty hides the button).
WEB_PLAY_URL = "https://robthewizzuk.github.io/game-scroll/"
# The live catalogue, used to accept hearts only for games that exist.
MANIFEST_URL = "https://assets.game-scroll.com/manifest.json"
# The repository, so each build on the crash and stutter report links to the commit it was built from (empty = no links).
REPO_URL = "https://github.com/robthewizzuk/game-scroll"

[[d1_databases]]
binding = "DB"
database_name = "game-scroll-hearts"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Rate limits (per Cloudflare location; the dashboard WAF rule is the global backstop).
# Hearts without a pass: per address.
[[ratelimits]]
name = "LIMIT"
namespace_id = "7301"
simple = { limit = 10, period = 60 }

# Hearts with a pass: per verified device.
[[ratelimits]]
name = "LIMIT_VERIFIED"
namespace_id = "7302"
simple = { limit = 60, period = 60 }

# Play stats batches: per address and per device (the app sends about one a minute).
[[ratelimits]]
name = "LIMIT_STATS"
namespace_id = "7304"
simple = { limit = 6, period = 60 }

# One game's page on the crash and stutter report, when it isn't already cached: per address.
[[ratelimits]]
name = "LIMIT_PAGES"
namespace_id = "7305"
simple = { limit = 30, period = 60 }

# Challenges and passes: per address (each pass costs an Apple/Google check).
[[ratelimits]]
name = "LIMIT_SESSION"
namespace_id = "7303"
simple = { limit = 10, period = 60 }
