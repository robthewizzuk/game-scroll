<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222">
<script type="module">
// A film of gs.outdoors.Water being disturbed, for scripts/water.cjs: a row for each thing that happens to
// the water, a picture every so often along it, so its rings, wakes, foam, spray, shore and the look from
// under it can be judged (and tuned) by eye. It also notes what a frame of water.update() cost.
//   ?acts=pebble,rock,boat (default: all)   &cols=8   &cell=300x210   &gpu (WebGPU)   &cells=128 (ripple grid)
//   &reach=24   &waves=.6   &view=top|near (&up=16: how high the top view is)   &from=0&to=1 (the share of each act filmed)   &time=14 (hour)
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';
const Q = new URLSearchParams(location.search), GPU = Q.has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
try {
  await loadParts();
  if (GPU && !await prepareGPU()) throw new Error('WebGPU did not start in this browser');
  const T = gs.THREE, frame = () => new Promise(r => requestAnimationFrame(r)), { Water, Land } = gs.outdoors;
  const waves = +(Q.get('waves') ?? .6), cells = +(Q.get('cells') || 128), reach = +(Q.get('reach') || 24);
  // an island's beach for the shore acts: the bed climbs out of the water towards -x
  const beach = (x, z) => -1.6 + Math.max(0, -x - 2) * .16 + Math.sin(z * .22) * .25 + Math.sin(x * .5 + z * .13) * .06;
  const mk = (mat, geo, x, y, z) => { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; return m; };
  // each act: how long, the camera (eye, aim; may be functions of time), the bed, and what happens when (w: the water, S: its scene things)
  const ACTS = {
    pebble: { secs: 4, eye: [0, 1.7, 5], aim: [0, 0, -1.5], at: { .3: w => w.ring(0, -1.5, { size: .25 }), 1.6: w => w.ring(1.5, -3, { size: .4, strength: 1.4 }) } },          // small things dropped in
    rock: { secs: 4.5, eye: [0, 1.9, 6], aim: [0, 0, -1], at: { .3: w => w.splash(0, -1.5, { size: 1.2, speed: 7 }) } },                                                          // a rock thrown in
    drop: { secs: 5, eye: [0, 1.9, 6], aim: [0, .6, -1], make: (w, S) => { S.ball = mk(gs.hd.pbr('#c8502a', { rough: .5 }), new T.SphereGeometry(.45, 20, 14), 0, 5, -1.5); S.vy = 0; w.watch(S.ball, { radius: .45 }); return [S.ball]; },
      tick: (w, S, t, dt) => { const b = S.ball.position, top = w.height(b.x, b.z); S.vy += (b.y < top ? (top - b.y) * 30 - S.vy * 3 : -9.8) * dt; b.y += S.vy * dt; } },   // a ball falls in and bobs: watched, so the water does the rest
    boat: { secs: 9, eye: (t, S) => [S.boat.x - 9, 3.2, S.boat.z + 9], aim: (t, S) => [S.boat.x, 0, S.boat.z], centre: (t, S) => S.boat,
      make: (w, S) => { S.boat = new gs.craft.Boat(w, { at: { x: -6, y: 0, z: 0 }, heading: 1.2, top: 9, power: 6, length: 4, width: 1.6 }); S.hull = mk(gs.hd.pbr('#7a4a2a', { rough: .6 }), new T.BoxGeometry(1.6, .7, 4), 0, 0, 0); w.watch(S.boat, { radius: 1.1 }); return [S.hull]; },
      tick: (w, S, t, dt) => { S.boat.update(dt, { throttle: t < 7 ? 1 : 0, steer: t > 2.5 && t < 6 ? .55 : 0 }); S.hull.position.set(S.boat.x, S.boat.y + .2, S.boat.z); S.hull.quaternion.set(S.boat.quat.x, S.boat.quat.y, S.boat.quat.z, S.boat.quat.w); } },   // a boat sets off, turns and stops
    swim: { secs: 7, eye: [0, 2.4, 7], aim: [0, 0, -1], make: (w, S) => { S.head = mk(gs.hd.pbr('#e0ac69', { rough: .6 }), new T.SphereGeometry(.16, 14, 10), -4, .05, -1); w.watch(S.head, { radius: .35 }); return [S.head]; },
      tick: (w, S, t, dt) => { S.head.position.x += 1.1 * dt; S.head.position.y = w.height(S.head.position.x, -1) + .05; } },                                                  // a swimmer crosses slowly
    rain: { secs: 4, eye: [0, 1.6, 5], aim: [0, 0, -3], tick: (w, S, t) => { w.rain = Math.min(1, t / 2); } },                                                                    // rain coming on
    shore: { secs: 6, bed: beach, eye: [-9, 1.7, 9], aim: [-9, -.2, -6], at: { 3: w => w.splash(-7.5, -1, { size: .8, speed: 5 }) } },                                           // along a beach: paler shallows, foam lapping
    wade: { secs: 6, bed: beach, eye: [-7, 2.6, 7], aim: [-9.5, 0, 0], make: (w, S) => { S.man = mk(gs.hd.pbr('#3a5a8a', { rough: .7 }), new T.CapsuleGeometry(.25, 1.2, 4, 10), -13, 0, 0); w.watch(S.man, { radius: .3, bottom: -.85, top: .85 }); return [S.man]; },
      tick: (w, S, t, dt) => { const p = S.man.position; p.x += 1.3 * dt; p.y = Math.max(beach(p.x, p.z), -1.2) + .85; } },                                                      // someone walks down the beach into the water
    under: { secs: 6, bed: (x, z) => -4 + Math.sin(x * .3) * .4 + Math.sin(z * .23) * .4, eye: t => [0, 1.6 - t * .75, 6], aim: t => [0, .6 - t * .75, -2],
      make: (w, S) => [mk(gs.hd.pbr('#8a7a5a', { rough: .9 }), new T.BoxGeometry(1.4, 3, 1.4), -2, -2.8, -3), mk(gs.hd.pbr('#a23', { rough: .6 }), new T.SphereGeometry(.7, 20, 14), 2.5, -3.3, -6), mk(gs.hd.pbr('#8a7a5a', { rough: .9 }), new T.BoxGeometry(1.2, 6, 1.2), 5, -1, -14)],
      at: { 2.5: w => w.splash(1, -2, { size: 1, speed: 6 }) } },                                                                                                                 // the camera sinks under the surface
  };
  const acts = (Q.get('acts') || Object.keys(ACTS).join(',')).split(','), cols = +(Q.get('cols') || 8), [cw, ch] = (Q.get('cell') || '300x210').split('x').map(Number);
  const from = +(Q.get('from') || 0), to = +(Q.get('to') || 1);
  const VIEW = Q.get('view') || '';
  window.__hd.force = 2; window.__hd.upscale = false; window.__hd.hold = false;   // (a film: nothing waits, hidden, for its shader)
  const cell = document.createElement('canvas'); cell.width = cw; cell.height = ch; const cx = cell.getContext('2d');
  const sheet = document.createElement('canvas'); sheet.width = cw * cols; sheet.height = ch * acts.length; const sx = sheet.getContext('2d'); document.body.append(sheet);
  const info = [], arr = (v, t, S) => typeof v === 'function' ? v(t, S) : v;
  const v = new gs.hd.HDView({ bg: '#9ab4d0', fog: 0, env: .6, amb: .5 });
  const sun = gs.hd.sun('#fff2d8', 2.2, 30, [.5, .8, -.6]); v.scene.add(sun, sun.target); v.sun = sun;
  const sky = new gs.sky.Sky(v, { time: +(Q.get('time') || 14), physical: Q.has('physical'), env: true, clouds: .25 }); v.air({ haze: +(Q.get('haze') || .0006) });
  for (let r = 0; r < acts.length; r++) {
    const A = ACTS[acts[r]]; if (!A) throw new Error('no act ' + acts[r] + ': ' + Object.keys(ACTS).join(', '));
    const world = new T.Group(); v.scene.add(world); const S = {};
    const w = new Water({ level: 0, waves, ripples: cells, reach, bed: A.bed || null, size: 200, segments: 80 }); world.add(w.mesh); w.underwater(v);
    if (A.bed) { const land = new Land({ kind: A.bed, size: 120, segments: 120, material: gs.hd.pbr('#c9b98a', { rough: .95 }) }); world.add(land.object); }
    for (const m of A.make?.(w, S) || []) world.add(m);
    const dt = 1 / 60, N = Math.round(A.secs / dt), events = Object.entries(A.at || {}).map(([t, fn]) => [Math.round(t / dt), fn]);
    const shots = Array.from({ length: cols }, (_, i) => Math.round((from + (to - from) * (i + .5) / cols) * N));
    let cost = 0, worst = 0, splashes = 0, most = 0;
    for (let i = 0; i <= N; i++) {
      const t = i * dt;
      for (const [at, fn] of events) if (at === i) fn(w, S);
      A.tick?.(w, S, t, dt);
      let eye = arr(A.eye, t, S), aim = arr(A.aim, t, S); const centre = A.centre ? arr(A.centre, t, S) : { x: eye[0], z: eye[2] };
      if (VIEW === 'top') eye = [aim[0], +(Q.get('up') || 16), aim[2] + .01]; else if (VIEW === 'near') eye = [aim[0] + (eye[0] - aim[0]) * .5, aim[1] + (eye[1] - aim[1]) * .6, aim[2] + (eye[2] - aim[2]) * .5];
      v.cam.fov = 50; v.cam.aspect = cw / ch; v.cam.near = .1; v.cam.far = 400; v.cam.updateProjectionMatrix(); v.cam.position.set(...eye); v.cam.lookAt(...aim); v.cam.updateMatrixWorld();
      sky.update(dt);
      const c0 = performance.now(); w.update(dt, centre); const c = performance.now() - c0; if (i > 5) { cost += c; worst = Math.max(worst, c); }
      splashes += w.splashes.length; if (i % 6 === 0) { const H = w.rip.H; for (let q = 0; q < H.length; q += 3) if (Math.abs(H[q]) > most) most = Math.abs(H[q]); }
      const k = shots.indexOf(i);
      if (k >= 0) {
        v.cut?.(); sun.follow(eye[0], 0, eye[2]);
        for (let n = 0; n < (k ? 2 : 6); n++) { v.t = t; v.render(cx, cw, ch); await frame(); }
        sx.drawImage(cell, k * cw, r * ch);
        sx.font = '11px sans-serif'; sx.fillStyle = '#000'; sx.fillText(`${acts[r]} ${t.toFixed(2)}s${w.under ? '  under' : ''}`, k * cw + 4, r * ch + 12);
      }
    }
    info.push(`${acts[r]}: ${splashes} splashes, ripples up to ${(most * 100).toFixed(1)} cm, ${w.rip.N} cells of ${(w.rip.cell * 100).toFixed(0)} cm; water.update ${(cost / N).toFixed(3)} ms a frame, worst ${worst.toFixed(2)}`);
    w.rain = 0; w.under = 0; w.update(dt, { x: 0, y: 5, z: 0 }); v.cam.position.set(0, 5, 0); w.update(dt, { x: 0, y: 5, z: 0 });   // (up for air before the next act)
    w.dispose(); v.scene.remove(world);
  }
  window.result = { sheet: sheet.toDataURL(), info, backend: window.__hd.info.backend };
} catch (e) { window.result = { error: String(e && e.stack || e) }; }
</script>
