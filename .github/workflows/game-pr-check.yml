# Checks pull requests. "check" runs the fast tests (game build, licences, types, how every game uses
# gs (TypeScript), the starter templates, kits, Tiny Brains, feed ranking, website build). "plan" works out,
# once, what the pull request changed: which games to play (the changed games, plus, when shared code changes
# (kits, gamescroll.js, the app, three.js and other packages, the test scripts, this file), the 3 games from
# each style that use the most engine parts), dealt out to up to three "play" jobs by how long each takes to
# play, and which of the slower checks below have anything to check. "play" plays the games in a headless
# browser (smoke, streamed, fold, and sweep for Console games and changed Next Gen games), plus the speed
# budget and Tiny Brains check for changed games. "code-flags" flags game code that touches the network,
# storage or native features (scripts/game-lint.mjs), and lists changed files outside src/games/ that need
# a careful read, gives kit hints (advice) on changed games, and checks that changed games are not near-copies
# of games already here (scripts/unique.mjs). More jobs run only when their parts change: a mutation check of
# the server and licence guards, frame generation quality ("framegen"), a lost graphics chip and shaders made
# ahead ("gpu-recovery"), the upscalers ("sgsr", three WebGPU parts and the WebGL one side by side), the app
# and sound checks ("app") and the engine test scenes ("app-scenes"), and a shared game link check. The maths
# probe across JavaScript engines (a warning, never red) runs after merging instead (maths-probe.yml). Runs
# with read-only permissions and no secrets, so it is safe for pull requests from forks. See CONTRIBUTING.md
# and docs/testing.md ("The PR check").
#
# Speed: GitHub gives this repository about 20 machines at once, shared by every open pull request. A job
# with nothing to do is skipped by "plan"'s answer before it gets a machine, and the slow browser checks are
# split so no one job takes much over 8 minutes. The browser setup is in .github/actions/browser.
name: Game PR check

on:
  pull_request:
    paths: ['src/**', 'scripts/**', 'package.json', 'package-lock.json', '.nvmrc', '.github/**', 'workers/**', 'public/**', 'site/**', 'index.html', 'vite.config.js', '.env*']

permissions:
  contents: read

concurrency:
  group: game-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build every game as a streamed file
        run: npm run games

      # (the web app as the store apps carry it; the Android builds skip pull requests that change only
      # games, kits or test scripts, so this is what shows such a change still builds for them)
      - name: The store apps' web build
        run: npm run build

      - name: Open-source list in Settings is up to date
        run: npm run licences

      - name: Types for gs cover every part
        run: npm run types-check

      # (the phone and driver steering list, src/steer-list.js: a rule a phone would not understand does nothing there, silently)
      - name: The phone and driver steering list is one the app understands
        run: node scripts/steer.mjs

      # TypeScript reads every line of every game against src/gamescroll.d.ts (about a second): a kit,
      # method, option or definition field that doesn't exist. The self-test first makes sure it still sees them.
      - name: Games use gs the way its types describe
        run: npm run game-types -- --self-test && npm run game-types

      - name: Starter templates make games that pass the lint and the types, and build as streamed files
        run: |
          ids=""
          for s in phone pocket color advance console nextgen ar board; do node scripts/new-game.mjs "zz-template-$s" --style "$s" --creator CI > /dev/null; ids="$ids zz-template-$s"; done
          node scripts/game-lint.mjs $ids && node scripts/game-types.mjs $ids && node scripts/build-games.mjs "$RUNNER_TEMP/zz-templates" > /dev/null
          for id in $ids; do rm "src/games/$id.js"; done

      # Game Scroll wants 1,000 games that all play differently. The self-test makes a reskin of three games
      # (every name, number and word changed) and checks it is still seen as a copy; "code-flags" below runs
      # the check itself on the games a pull request adds or changes.
      - name: The uniqueness check still tells a reskin from a new game
        run: npm run unique -- --self-test

      - name: Kit tests (physics, AI, maths)
        run: npm run kit-test

      - name: Tiny Brains cruelty test (weak players still win, guard rails hold)
        run: npm run brains

      - name: For you ranking and feed brain (made-up players)
        run: npm run recommend

      - name: Website builds (game-scroll.com)
        run: npm run site


  # What the pull request changed, worked out once: which games to play and how to split them across the
  # play jobs, and which of the slower checks have anything to check (each answer below says which files
  # count). The jobs whose answer is no are skipped without taking a machine.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      ar: ${{ steps.plan.outputs.ar }}
      guards: ${{ steps.parts.outputs.guards }}
      framegen: ${{ steps.parts.outputs.framegen }}
      sgsr-webgpu: ${{ steps.parts.outputs.sgsr-webgpu }}
      sgsr-webgl: ${{ steps.parts.outputs.sgsr-webgl }}
      app: ${{ steps.parts.outputs.app }}
      app-scenes: ${{ steps.parts.outputs.app-scenes }}
      share-link: ${{ steps.parts.outputs.share-link }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Which slower checks have something to check
        id: parts
        env:
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/$BASE...HEAD")
          # (every part also runs when the packages, this file or the shared browser setup change)
          all='|package(-lock)?\.json|\.github/(workflows/game-pr-check\.yml|actions/)'
          part() { if echo "$files" | grep -qE "^($2$all)"; then echo "$1=true" >> "$GITHUB_OUTPUT"; echo "yes  $1"; else echo "no   $1"; fi; }
          # the Worker and the licence list: the guards' mutation check
          part guards 'workers/hearts/|src/licences\.js|scripts/(licence-check|mutants)\.mjs'
          # frame generation, the 3D kit's WebGPU path, SGSR 2, frame pacing, shaders made ahead and their checks
          part framegen 'src/kit/(framegen|hd3d|hd3d-gpu|hd3d-gpu-trace|trace-guard|sgsr2|speed|particles-gpu|power|gpu|toon3d)\.js|src/detail-(tour|scenes)\.js|src/kit/models/(materials|recipes|recipe-paint|ops)\.js|src/kit/pipes\.js|scripts/(framegen-test|upscale-compare|close-up|look-compare|gpu-loss|shader-replay)'
          # the upscalers on WebGPU
          part sgsr-webgpu 'src/kit/(framegen|hd3d|hd3d-gpu|sgsr2|speed|particles-gpu|power|gpu|toon3d)\.js|src/kit/models/(materials|recipes|recipe-paint|ops)\.js|scripts/upscale-compare'
          # the upscaler on WebGL (the WebGPU-only files, hd3d-gpu.js, framegen.js, particles-gpu.js and power.js, never reach it)
          part sgsr-webgl 'src/kit/(hd3d|sgsr2|speed|gpu|toon3d)\.js|src/kit/models/(materials|recipes|recipe-paint|ops)\.js|scripts/upscale-compare'
          # the app shell, the sound and the 2D looks
          part app 'src/(main|saves|soundtrack|sfx|gamescroll|game-modules|util|tour|detail-tour|detail-scenes|qa|perf|playstats|hearts|polyfill|update)\.js|src/kit/(sound|voice-fx|acoustics|instruments|compose|foley|awake|rhythm|lazy|cleanup|tick|progress|fontlib|font-files|pixel|gfx|materials2d|sketch|icons|icon-data)\.js|scripts/(app-test\.cjs|sound-test)|index\.html|vite\.config\.js'
          # the app shell, the tour and the engine test scenes
          part app-scenes 'src/(main|saves|gamescroll|game-modules|util|tour|detail-tour|detail-scenes|qa|perf|playstats|hearts|polyfill)\.js|src/kit/(awake|lazy|cleanup|tick|progress|crowd)\.js|scripts/app-test\.cjs|index\.html|vite\.config\.js'
          # the feed, the link code and the games catalogue
          part share-link 'src/(main|share|remote)\.js|scripts/(share-link|build-games)\.mjs|index\.html|vite\.config\.js'

      - name: Pick the games
        id: plan
        env:
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/$BASE...HEAD")
          changed=$(echo "$files" | grep -E '^src/games/[a-z0-9-]+\.js$' | while read -r f; do [ -f "$f" ] && basename "$f" .js; done | tr '\n' ' ')
          # Shared code runs inside every game, so a change there also plays a sample: from each style, the
          # 3 games that use the most engine parts (scripts/pick-games.mjs), plus the changed games.
          shared=$(echo "$files" | grep -E '^(src/|public/|index\.html|vite\.config\.js|package(-lock)?\.json|\.nvmrc|\.env|scripts/(smoke|fold|sweep|stream-smoke|build-games|pick-games|ar-floor)\.|\.github/workflows/game-pr-check\.yml)' | grep -vE '^src/(games/|licences\.js)' || true)
          # The AR kit, its phone bridge or its test scene changed: also play the pretend-room scenes (scripts/ar-floor.cjs).
          if echo "$files" | grep -qE '^(src/kit/(ar3d|ar-floor|ar-room|native-ar)\.js|src/games/ar-lab\.js|scripts/(ar-floor\.cjs|lib/fake-native-ar\.js))$'; then echo "ar=true" >> "$GITHUB_OUTPUT"; fi
          # Sweep (fast-forwarded long play at odd sizes): Console games, and Next Gen and Board games the PR changes
          # (Next Gen draws in software here, so sweeping all of them would take too long).
          sweepable() { grep -qE "era: *'console'" "src/games/$1.js" || { grep -qE "era: *'(nextgen|board)'" "src/games/$1.js" && case " $changed " in *" $1 "*) true;; *) false;; esac; }; }
          if [ -n "$shared" ]; then
            echo "Shared code changed, so the engine-heavy games are played too:"; echo "$shared" | sed 's/^/  /'
            all=$(echo $(node scripts/pick-games.mjs 3 --why) $changed | tr ' ' '\n' | awk 'NF && !seen[$0]++' | tr '\n' ' ')
            SHARDS=3
          else
            all=$changed; SHARDS=1
          fi
          # A PR with many games gets more jobs (about 45 games each, up to 6), so no job runs into its
          # time limit: the playtester and the speed budget take about 20 seconds a changed game.
          more=$(( ($(echo $all | wc -w) + 44) / 45 )); [ "$more" -gt 6 ] && more=6
          [ "$more" -gt "$SHARDS" ] && SHARDS=$more
          if [ -z "$(echo $all)" ]; then echo "No games to play."; echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"; exit 0; fi
          # Deal the games out by how long each takes to play (scripts/pick-games.mjs --deal: Long Shadow and the swept
          # Console games count for most, and the quick ones fill in round them), so the jobs end at about the same time.
          dealt=$(node scripts/pick-games.mjs --deal $SHARDS $all --why)
          json='{"include":['; sep=''; k=0
          while read -r ids; do
            k=$((k+1)); [ -z "$(echo $ids)" ] && continue
            sweep=$(for id in $ids; do sweepable "$id" && echo -n "$id "; done || true)
            mine=$(for id in $ids; do case " $changed " in *" $id "*) echo -n "$id ";; esac; done || true)
            json="$json$sep{\"part\":$k,\"ids\":\"${ids% }\",\"sweep\":\"${sweep% }\",\"changed\":\"${mine% }\"}"; sep=','
          done <<< "$dealt"
          json="$json]}"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "$json"

  play:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: play (${{ matrix.part }})
    env:
      IDS: ${{ matrix.ids }}
      SWEEP: ${{ matrix.sweep }}
      CHANGED: ${{ matrix.changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Node, packages and the test browser
        uses: ./.github/actions/browser

      - name: Build the app with games inside
        id: build
        run: npm run build:bundled

      - name: Smoke test
        run: node scripts/smoke.cjs $IDS

      - name: Streamed test (runs the games the way the store apps do)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/stream-smoke.mjs $IDS

      - name: Fold test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/fold.cjs $IDS

      - name: AR in pretend rooms (floor finding and the room joining in; when the AR kit changed)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.part == 1 && needs.plan.outputs.ar == 'true' }}
        run: node scripts/ar-floor.cjs

      - name: Sweep test (Console games, and changed Next Gen games)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.sweep != '' }}
        run: node scripts/sweep.cjs $SWEEP

      - name: Tiny Brains in changed games don't get harder for a losing player
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.changed != '' }}
        run: node scripts/brain-check.mjs --games $CHANGED

      - name: AI playtester tries to win changed games (warnings; fails on errors or a goal reached with no input)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.changed != '' }}
        run: node scripts/playtest.cjs $CHANGED

      - name: Speed budget for changed games (frame time and memory on a slowed CPU)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.changed != '' }}
        run: node scripts/budget.cjs $CHANGED

  # Flags risky code for review. Fails (red) when a changed game reaches the network, storage,
  # Capacitor or other windows, or hides code; the flagged lines show on the Files tab.
  code-flags:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Flag risky code in changed games
        env:
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/$BASE...HEAD" -- 'src/games/*.js' | tr '\n' ' ')
          if [ -z "$files" ]; then echo "No game files changed."; exit 0; fi
          node scripts/game-lint.mjs $files

      # Fails (red) when a changed game is a near-copy of another (new names on the same code); warns when it
      # plays and reads like one already here, with the three nearest games in the log.
      - name: Changed games play differently from the games already here
        env:
          BASE: ${{ github.base_ref }}
        run: node scripts/unique.mjs --since "origin/$BASE...HEAD"

      - name: List changed files outside src/games/
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # Game PRs should only add or change files in src/games/ (and maybe docs). Anything else
          # runs inside the app or in CI, so a maintainer must read it line by line.
          other=$(git diff --name-only "origin/$BASE...HEAD" | grep -vE '^(src/games/[a-z0-9-]+\.js|docs/.*\.(md|png|jpg|webp))$' || true)
          if [ -z "$other" ]; then echo "Only game files changed."; exit 0; fi
          { echo "### Changed outside src/games/ (review every line)"; echo; echo "$other" | sed 's/^/- `/; s/$/`/'; } >> "$GITHUB_STEP_SUMMARY"
          for f in $other; do echo "::warning file=$f::This pull request changes $f, which is outside src/games/. Shared code and CI files run for every game, so review it line by line."; done



  # Mutation check: puts each server and licence guard's defect back, one at a time, and makes sure a
  # test then fails (scripts/mutants.mjs). Runs when the Worker, the licence list or the check change.
  guards:
    needs: plan
    if: needs.plan.outputs.guards == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/hearts/package-lock.json

      - name: Install
        run: npm ci && (cd workers/hearts && npm ci && npx wrangler d1 migrations apply game-scroll-hearts --local)

      - name: Every guard is reached by a test
        run: node scripts/mutants.mjs

  # Frame generation quality: made frames scored against the scene really drawn at that moment, in 19
  # suites (blend, ahead, two frames between, hard cases, upscaled...), each scene no worse than
  # scripts/framegen-test/baseline.json; recipe materials up close; and see-through things over the ground.
  # WebGPU in software (SwiftShader), so no GPU needed. Runs when frame generation, the 3D kit's WebGPU path,
  # SGSR 2, the frame pacing or the checks change. A lost graphics chip and shaders made ahead, on the same
  # changes, are "gpu-recovery" below and the upscalers "sgsr", each on machines of their own.
  framegen:
    needs: plan
    if: needs.plan.outputs.framegen == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Node, packages and the test browser
        uses: ./.github/actions/browser

      - name: Made frames no worse than the baseline
        run: node scripts/framegen-test.cjs --check

      # (gs.models.material's close-up look on WebGPU: never hidden while its shader comes in, steady far off, sharp up close)
      - name: Recipe materials up close
        if: ${{ !cancelled() }}
        run: node scripts/close-up.cjs

      # (dust, smoke and glows are drawn over the scene: the ground round each puff is shaded as it is without it,
      # with no square where the puff's corners are; the scene checks itself, scripts/look-compare/index.html dustScene)
      - name: See-through things leave the ground behind them alone
        if: ${{ !cancelled() }}
        run: PICK=dust node scripts/look-compare.cjs save "$RUNNER_TEMP/look" --webgpu

  # A lost graphics chip and shaders made ahead, on the same changes as framegen (split from it so neither
  # job takes much over 7 minutes).
  gpu-recovery:
    needs: plan
    if: needs.plan.outputs.framegen == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Node, packages and the test browser
        uses: ./.github/actions/browser

      - name: Build the app with games inside
        run: npm run build:bundled

      # (the graphics chip lost mid-round, as a driver reset or a crashed GPU process does: the round pauses, a new WebGPU
      # device is made, the round is drawn again on it under a cover and carries on, and the loss is reported; then the
      # same while the card waits in the feed; and lost while reflections are ray traced, which switches the tracing off and
      # carries on with reflections from the screen, on WebGPU. scripts/gpu-loss.cjs)
      - name: A lost graphics chip comes back
        run: node scripts/gpu-loss.cjs gravity-grip bumper-bowl && node scripts/gpu-loss.cjs gravity-grip --when feed && node scripts/gpu-loss.cjs --when traced

      # (the pipelines a round made in play, noted and made ahead the next time the game comes up: src/kit/pipes.js. Two
      # launches of the browser on one profile; the second must make ahead what the first noted. scripts/shader-replay.cjs)
      - name: Shaders a round made are made ahead next time
        if: ${{ !cancelled() }}
        run: node scripts/shader-replay.cjs paint-run bunker-breakout --runs 2

  # The upscalers against the same scene drawn at twice the size (scripts/upscale-compare.cjs): SGSR 2 no
  # worse than a plain stretch, and our changes to it no worse than Qualcomm's shader as it was; on WebGPU
  # also the sharper textures under it. The WebGPU run is split in three by scene (about 5 to 7 minutes each
  # on GitHub's machines, 20 in one; "=name" is that scene alone); "sgsr (webgl)" is the WebGL fallback's
  # own shader (sgsr2.js), which runs only when a file that reaches WebGL changes.
  sgsr:
    needs: plan
    if: needs.plan.outputs.sgsr-webgpu == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: 'webgpu 1', scenes: 'still,camera-moves,box-moves' }
          - { part: 'webgpu 2', scenes: '=anti-aliasing,=anti-aliasing-still,textured-still' }
          - { part: 'webgpu 3', scenes: '=anti-aliasing-box,textured-camera' }
    name: sgsr (${{ matrix.part }})
    steps:
      - uses: actions/checkout@v7

      - name: Node, packages and the test browser
        uses: ./.github/actions/browser

      - name: SGSR 2 no worse than a plain stretch, and our changes to it no worse than without
        run: node scripts/upscale-compare.cjs --webgpu --scenes '${{ matrix.scenes }}'

  sgsr-webgl:
    needs: plan
    if: needs.plan.outputs.sgsr-webgl == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: sgsr (webgl)
    steps:
      - uses: actions/checkout@v7

      - name: Node, packages and the test browser
        uses: ./.github/actions/browser

      - name: SGSR 2 no worse than a plain stretch, and our changes to it no worse than without
        run: node scripts/upscale-compare.cjs --warm 80 --modes plain,sgsr2,sgsr2-plain

  # The app around a game (screen kept on in a round, finer touch, even pixels and the LCD look, the
  # one-line soundtrack, the phone-only save, the font library, 2D looks, the phone test tour, loading,
  # getting a round ready, old WebViews, reports) and the sound itself (every ready-made sound is heard and
  # none is too loud, the limiter holds, instrument sets are level, the music clock keeps the beat through
  # a frozen frame), in a headless browser. Runs when the app shell, the sound or the checks change. The
  # engine test scenes, the slowest part of the app test, are "app-scenes" below, on a machine of their own.
  app:
    needs: plan
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Node, packages and the test browser
        uses: ./.github/actions/browser

      - name: Build the app with games inside
        id: build
        run: npm run build:bundled

      - name: The app around a game (awake, touch, pixels, soundtrack, phone save, tour, loading...)
        run: node scripts/app-test.cjs -scenes

      - name: Sound (ready-made sounds, limiter, instruments, music clock, shaped speech)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/sound-test.cjs

  # The engine test scenes (src/detail-tour.js) flown by the phone test tour, each detail system off and on:
  # 18 scenes drawn small in software, one alone on a bigger screen with frames held over half a second, ray
  # tracing alone (scripts/app-test.cjs scenes). About 6 minutes, so a machine of its own. Runs when the app
  # shell, the tour or the scenes change (not for the sound and 2D look files that only "app" needs).
  app-scenes:
    needs: plan
    if: needs.plan.outputs.app-scenes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Node, packages and the test browser
        uses: ./.github/actions/browser

      - name: Build the app with games inside
        run: npm run build:bundled

      - name: The engine test scenes
        run: node scripts/app-test.cjs scenes

  # Shared game links: opens the streamed web app from a link to one game (?g=<id>) on quick, slow and
  # stale connections; that game must be the first card and the one Play starts, and a link to a game
  # that has been taken down must still land in the feed. Runs when the feed, the link code, the
  # game catalogue code or the check change.
  share-link:
    needs: plan
    if: needs.plan.outputs.share-link == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Node, packages and the test browser
        uses: ./.github/actions/browser

      - name: A shared link opens that game
        run: node scripts/share-link.mjs
