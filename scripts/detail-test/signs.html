<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<script type="module">
// Signs that light with their own picture (gs.hd.sign(..., { picture: true }), a lamp spot's picture: lamps.js,
// lamps-gpu.js, the decals' atlas in decals-gpu.js) for scripts/detail-test.cjs --page signs [--webgpu]: a screen half
// red and half blue in a dark room over a shiny floor, against the same screen lit in one colour. Checks that the floor
// and walls take each half's colour on its own side, that a white picture lights as the plain sign did, that a shiny
// floor shows the picture and a rough one blurs it, that painting the screen again changes its light with no shader
// made, and on WebGL that the light takes the picture's average colour.
//   ?gpu  ?w=240&h=320
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';
const Q = new URLSearchParams(location.search), GPU = Q.has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
await loadParts();
const G = GPU ? await prepareGPU() : null;
if (GPU && !G) { window.result = { error: 'WebGPU did not start in this browser' }; throw new Error(window.result.error); }
const T = gs.THREE, HD = window.__hd, W = +(Q.get('w') || 240), H = +(Q.get('h') || 320);
HD.force = 2; HD.upscale = false; HD.grain = 0; HD.still = false; HD.hold = false; HD.spread = false;
const frame = () => new Promise(r => requestAnimationFrame(r));
const checks = [], info = {}, out = {};
const check = (name, ok, note) => checks.push({ name, ok: !!ok, note });
try {
  const v = new gs.hd.HDView({ bg: '#06070a', fog: 0, amb: .02, sky: '#203040', ground: '#100c08' }), c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  const box = (w, h, d, col, px, py, pz, rough) => { const m = new T.Mesh(gs.hd.rbox(w, h, d), gs.hd.pbr(col, { rough })); m.position.set(px, py, pz); m.receiveShadow = true; v.scene.add(m); return m; };
  const floor = box(8, .2, 8, '#b8b8b8', 0, -.1, 0, .12);
  box(.2, 3, 6, '#c8c8c8', -1.8, 1.5, 0, .9); box(.2, 3, 6, '#c8c8c8', 1.8, 1.5, 0, .9); box(4, 3, .2, '#303030', 0, 1.5, -1.8, .9);
  const halves = (g, w, h) => { g.fillStyle = '#ff2010'; g.fillRect(0, 0, w / 2, h); g.fillStyle = '#1040ff'; g.fillRect(w / 2, 0, w / 2, h); };
  const white = (g, w, h) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); };
  const tv = gs.hd.sign(1.6, .9, halves, { picture: true, i: 1.2, reach: 6, glow: 2 }); tv.position.set(0, 1.1, -1.6); v.scene.add(tv);
  const plain = gs.hd.sign(1.6, .9, white, { colour: '#ffffff', i: 1.2, reach: 6, glow: 2 }); plain.position.copy(tv.position); plain.visible = false; v.scene.add(plain);
  v.lampLights(30);
  v.cam.position.set(0, 1.5, 3.2); v.cam.lookAt(0, .5, -.6); v.cam.updateMatrixWorld();
  let lit = tv;
  const draw = async () => { v.placeLamps(lit.spots(), 0, 1, 0, 0); v.t = 0; v.render(x, W, H); x.getImageData(0, 0, 1, 1); await frame(); };
  const settle = async n => { for (let i = 0; i < n; i++) await draw(); };
  const grab = () => x.getImageData(0, 0, W, H).data.slice();
  const pic = px => { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d'), im = g.createImageData(W, H); im.data.set(px); g.putImageData(im, 0, 0); return cv.toDataURL(); };
  const P = new T.Vector3(), sp = (wx, wy, wz) => { P.set(wx, wy, wz).project(v.cam); return [Math.round((P.x + 1) / 2 * W), Math.round((1 - P.y) / 2 * H)]; };
  // the mean colour of a few pixels round a point in the world
  const at = (d, wx, wy, wz, r = 3) => { const [cx, cy] = sp(wx, wy, wz); let R = 0, Gg = 0, B = 0, n = 0; for (let y = cy - r; y <= cy + r; y++) for (let xx = cx - r; xx <= cx + r; xx++) { if (xx < 0 || y < 0 || xx >= W || y >= H) continue; const i = (y * W + xx) * 4; R += d[i]; Gg += d[i + 1]; B += d[i + 2]; n++; } return [R / n, Gg / n, B / n].map(q => +q.toFixed(1)); };
  const redness = q => q[0] / Math.max(1, q[2]);

  await settle(12);
  const two = grab(); out.picture = pic(two);
  // the side walls and the floor in front of each half
  const L = at(two, -1.68, .9, -.8), R = at(two, 1.68, .9, -.8), fl = at(two, -.7, 0, -.6), fr = at(two, .7, 0, -.6);
  info.halves = { leftWall: L, rightWall: R, floorLeft: fl, floorRight: fr };
  if (GPU) {
    // (red over blue on the red half's side, blue over red on the other: the floor less, under the shine of the room)
    const rb = q => q[0] - q[2];
    check('each half of the picture lights its own side', rb(L) > 15 && rb(R) < -15 && rb(fl) > 5 && rb(fr) < -5, JSON.stringify(info.halves));

    // the shiny floor shows the picture: in the reflection under the screen (where the screen mirrored in the floor is), red
    // under the red half and blue under the blue
    const rl = at(two, -.4, -1.1, -1.6, 2), rr = at(two, .4, -1.1, -1.6, 2);
    info.mirror = { left: rl, right: rr };
    floor.material.roughness = .75; floor.material.needsUpdate = true; await settle(10);
    const rough = grab(); out.rough = pic(rough);
    const ql = at(rough, -.4, -1.1, -1.6, 2), qr = at(rough, .4, -1.1, -1.6, 2);
    info.roughFloor = { left: ql, right: qr };
    const split = (a, b) => rb(a) - rb(b);
    check('a shiny floor shows the picture, a rough one blurs it', split(rl, rr) > 10 && Math.abs(split(ql, qr)) < split(rl, rr) * .5, JSON.stringify({ shiny: +split(rl, rr).toFixed(1), rough: +split(ql, qr).toFixed(1), ...info.mirror }));
    floor.material.roughness = .12; floor.material.needsUpdate = true; await settle(8);

    // a white picture lights as the plain sign does
    tv.paint(white); await settle(8); const whitePic = grab();
    tv.visible = false; plain.visible = true; lit = plain; await settle(8); const plainSign = grab(); out.plain = pic(plainSign);
    let s = 0; for (let i = 0; i < whitePic.length; i += 4) s += (Math.abs(whitePic[i] - plainSign[i]) + Math.abs(whitePic[i + 1] - plainSign[i + 1]) + Math.abs(whitePic[i + 2] - plainSign[i + 2])) / 3;
    info.white = +(s / (W * H)).toFixed(2);
    check('a white picture lights as the plain sign did', info.white < 1.2, `mean difference ${info.white}/255`);
    tv.visible = true; plain.visible = false; lit = tv;

    // painted again (green), its light follows, and no shader is made for it
    tv.paint(halves); await settle(6);
    const dev = G.r.backend.device, made = [], cs = dev.createShaderModule.bind(dev);
    dev.createShaderModule = d => { made.push(d.label || '?'); return cs(d); };
    try { tv.paint((g, w, h) => { g.fillStyle = '#10ff30'; g.fillRect(0, 0, w, h); }); await settle(6); } finally { dev.createShaderModule = cs; }
    const green = grab(); out.green = pic(green);
    const gL = at(green, -1.68, .9, -.8);
    info.repainted = { leftWall: gL, shaders: made.length };
    check('painted again, its light follows with no shader made', gL[1] - Math.max(gL[0], gL[2]) > 20 && made.length === 0, JSON.stringify(info.repainted));
    tv.paint(halves); await settle(6);
  } else {
    // WebGL: a lamp at its middle in the picture's average colour (red and blue: purple, both walls alike)
    check('on WebGL the light takes the picture\'s average colour', Math.abs(redness(L) - redness(R)) < .35 * redness(L) && L[0] > 5 && L[2] > 5, JSON.stringify(info.halves));
  }
  // a picture to look at (no check): a screen playing stripes that move, in the dark room
  tv.paint((g, w, h) => { for (let i = 0; i < 6; i++) { g.fillStyle = ['#ff3010', '#ffb020', '#20e060', '#2080ff', '#a040ff', '#ff40a0'][i]; g.fillRect(i * w / 6, 0, w / 6, h); } });
  await settle(6); out.show = c.toDataURL();
  info.backend = HD.info.backend;
} catch (e) { window.result = { error: String(e && e.stack || e) }; }
window.result ||= { checks, info, out };
</script>
