# Node, the packages and a headless browser for the PR check's browser jobs, in one step each job shares.
# Playwright isn't in package.json (the app doesn't need it), so it is installed here at the version below,
# with its browsers kept in the Actions cache between runs. The runner image already has what Chromium needs,
# so with the browser cached nothing more is installed; a first run (or WebKit) installs the system packages.
# The version is pinned (it used to be the newest on npm): a new release missed the cache in every job at once
# (each then downloaded the browser and installed system packages, and all but one failed to save it), and a
# new browser can move the picture checks' numbers (framegen-test's baseline, upscale-compare). Move it on in a
# pull request of its own.
name: Node and a test browser
description: setup-node with the npm cache, npm ci, and Playwright with cached browsers
inputs:
  browsers:
    description: which Playwright browsers (space separated)
    default: chromium
  install:
    description: run npm ci (false when the job installs its own way)
    default: 'true'
  playwright:
    description: the Playwright version (and so the browser build) the checks run on
    default: '1.65.1'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install
      if: inputs.install == 'true'
      shell: bash
      run: npm ci --no-audit --no-fund

    - name: Which Playwright
      id: pw
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        PW: ${{ inputs.playwright }}
      run: |
        echo "version=$PW" >> "$GITHUB_OUTPUT"
        echo "names=$(echo $BROWSERS | tr ' ' '-')" >> "$GITHUB_OUTPUT"

    - name: Cache the browsers
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ steps.pw.outputs.names }}-${{ runner.os }}-${{ steps.pw.outputs.version }}

    - name: Install Playwright
      shell: bash
      env:
        PW: ${{ steps.pw.outputs.version }}
        BROWSERS: ${{ inputs.browsers }}
        HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        npm i --no-save --no-audit --no-fund "playwright@$PW"
        if [ "$HIT" != "true" ]; then npx playwright install --with-deps $BROWSERS
        elif [ "$BROWSERS" != "chromium" ]; then npx playwright install-deps $BROWSERS
        fi
