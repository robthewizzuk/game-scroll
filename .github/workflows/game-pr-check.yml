# Checks pull requests. "check" runs the fast tests (game build, licences, types, how every game uses
# gs (TypeScript), the starter templates, kits, Tiny Brains, feed ranking, website build). "plan" works out which games to play: the changed games, plus, when
# shared code changes (kits, gamescroll.js, the app, three.js and other packages, the test scripts,
# this file), the 3 games from each style that use the most engine parts, split across 2 parallel
# "play" jobs. Those play the games in a headless browser (smoke, streamed, fold, and sweep for
# Console games and changed Next Gen games), plus the speed budget
# and Tiny Brains check for changed games. "code-flags" flags game code that touches the network,
# storage or native features (scripts/game-lint.mjs), and lists changed files outside src/games/ that
# need a careful read, gives kit hints (advice) on changed games, and checks that changed games are not
# near-copies of games already here (scripts/unique.mjs). Five more jobs: a mutation check of
# the server and licence guards, a maths probe across JavaScript engines, a frame generation quality
# check, the app and sound checks, and a shared game link check (each only when those parts change). Runs with read-only
# permissions and no secrets, so it is safe for pull requests from forks. See CONTRIBUTING.md.
name: Game PR check

on:
  pull_request:
    paths: ['src/**', 'scripts/**', 'package.json', 'package-lock.json', '.nvmrc', '.github/**', 'workers/**', 'public/**', 'site/**', 'index.html', 'vite.config.js', '.env*']

permissions:
  contents: read

concurrency:
  group: game-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build every game as a streamed file
        run: npm run games

      - name: Open-source list in Settings is up to date
        run: npm run licences

      - name: Types for gs cover every part
        run: npm run types-check

      # TypeScript reads every line of every game against src/gamescroll.d.ts (about a second): a kit,
      # method, option or definition field that doesn't exist. The self-test first makes sure it still sees them.
      - name: Games use gs the way its types describe
        run: npm run game-types -- --self-test && npm run game-types

      - name: Starter templates make games that pass the lint and the types
        run: |
          ids=""
          for s in phone pocket color advance console nextgen ar board; do node scripts/new-game.mjs "zz-template-$s" --style "$s" --creator CI > /dev/null; ids="$ids zz-template-$s"; done
          node scripts/game-lint.mjs $ids && node scripts/game-types.mjs $ids
          for id in $ids; do rm "src/games/$id.js"; done

      # Game Scroll wants 1,000 games that all play differently. The self-test makes a reskin of three games
      # (every name, number and word changed) and checks it is still seen as a copy; "code-flags" below runs
      # the check itself on the games a pull request adds or changes.
      - name: The uniqueness check still tells a reskin from a new game
        run: npm run unique -- --self-test

      - name: Kit tests (physics, AI, maths)
        run: npm run kit-test

      - name: Tiny Brains cruelty test (weak players still win, guard rails hold)
        run: npm run brains

      - name: For you ranking and feed brain (made-up players)
        run: npm run recommend

      - name: Website builds (game-scroll.com)
        run: npm run site

  # Which games to play, and how to split them across the play jobs.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      ar: ${{ steps.plan.outputs.ar }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Pick the games
        id: plan
        env:
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/$BASE...HEAD")
          changed=$(echo "$files" | grep -E '^src/games/[a-z0-9-]+\.js$' | while read -r f; do [ -f "$f" ] && basename "$f" .js; done | tr '\n' ' ')
          # Shared code runs inside every game, so a change there also plays a sample: from each style, the
          # 3 games that use the most engine parts (scripts/pick-games.mjs), plus the changed games.
          shared=$(echo "$files" | grep -E '^(src/|public/|index\.html|vite\.config\.js|package(-lock)?\.json|\.nvmrc|\.env|scripts/(smoke|fold|sweep|stream-smoke|build-games|pick-games|ar-floor)\.|\.github/workflows/game-pr-check\.yml)' | grep -vE '^src/(games/|licences\.js)' || true)
          # The AR kit, its phone bridge or its test scene changed: also play the pretend-room scenes (scripts/ar-floor.cjs).
          if echo "$files" | grep -qE '^(src/kit/(ar3d|ar-floor|ar-room|native-ar)\.js|src/games/ar-lab\.js|scripts/(ar-floor\.cjs|lib/fake-native-ar\.js))$'; then echo "ar=true" >> "$GITHUB_OUTPUT"; fi
          # Sweep (fast-forwarded long play at odd sizes): Console games, and Next Gen and Board games the PR changes
          # (Next Gen draws in software here, so sweeping all of them would take too long).
          sweepable() { grep -qE "era: *'console'" "src/games/$1.js" || { grep -qE "era: *'(nextgen|board)'" "src/games/$1.js" && case " $changed " in *" $1 "*) true;; *) false;; esac; }; }
          if [ -n "$shared" ]; then
            echo "Shared code changed, so the engine-heavy games are played too:"; echo "$shared" | sed 's/^/  /'
            all=$(echo $(node scripts/pick-games.mjs 3 --why) $changed | tr ' ' '\n' | awk 'NF && !seen[$0]++' | tr '\n' ' ')
            SHARDS=2
          else
            all=$changed; SHARDS=1
          fi
          # A PR with many games gets more jobs (about 45 games each, up to 6), so no job runs into its
          # time limit: the playtester and the speed budget take about 20 seconds a changed game.
          more=$(( ($(echo $all | wc -w) + 44) / 45 )); [ "$more" -gt 6 ] && more=6
          [ "$more" -gt "$SHARDS" ] && SHARDS=$more
          if [ -z "$(echo $all)" ]; then echo "No games to play."; echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"; exit 0; fi
          # Deal the games out like cards, so each job gets a fair share of the slow 3D ones.
          json='{"include":['; sep=''
          for k in $(seq 0 $((SHARDS-1))); do
            ids=$(echo $all | tr ' ' '\n' | awk -v n=$SHARDS -v k=$k 'NR%n==k' | tr '\n' ' ')
            [ -z "$(echo $ids)" ] && continue
            sweep=$(for id in $ids; do sweepable "$id" && echo -n "$id "; done || true)
            mine=$(for id in $ids; do case " $changed " in *" $id "*) echo -n "$id ";; esac; done || true)
            json="$json$sep{\"part\":$((k+1)),\"ids\":\"${ids% }\",\"sweep\":\"${sweep% }\",\"changed\":\"${mine% }\"}"; sep=','
          done
          json="$json]}"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "$json"

  play:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: play (${{ matrix.part }})
    env:
      IDS: ${{ matrix.ids }}
      SWEEP: ${{ matrix.sweep }}
      CHANGED: ${{ matrix.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Which Playwright
        id: pw
        run: echo "version=$(npm view playwright version)" >> "$GITHUB_OUTPUT"

      - name: Cache the browser
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright
        env:
          PW: ${{ steps.pw.outputs.version }}
        run: |
          npm i --no-save "playwright@$PW"
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi

      - name: Build the app with games inside
        id: build
        run: npm run build:bundled

      - name: Smoke test
        run: node scripts/smoke.cjs $IDS

      - name: Streamed test (runs the games the way the store apps do)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/stream-smoke.mjs $IDS

      - name: Fold test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/fold.cjs $IDS

      - name: AR in pretend rooms (floor finding and the room joining in; when the AR kit changed)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.part == 1 && needs.plan.outputs.ar == 'true' }}
        run: node scripts/ar-floor.cjs

      - name: Sweep test (Console games, and changed Next Gen games)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.sweep != '' }}
        run: node scripts/sweep.cjs $SWEEP

      - name: Tiny Brains in changed games don't get harder for a losing player
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.changed != '' }}
        run: node scripts/brain-check.mjs --games $CHANGED

      - name: AI playtester tries to win changed games (warnings; fails on errors or a goal reached with no input)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.changed != '' }}
        run: node scripts/playtest.cjs $CHANGED

      - name: Speed budget for changed games (frame time and memory on a slowed CPU)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.changed != '' }}
        run: node scripts/budget.cjs $CHANGED

  # Flags risky code for review. Fails (red) when a changed game reaches the network, storage,
  # Capacitor or other windows, or hides code; the flagged lines show on the Files tab.
  code-flags:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Flag risky code in changed games
        env:
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/$BASE...HEAD" -- 'src/games/*.js' | tr '\n' ' ')
          if [ -z "$files" ]; then echo "No game files changed."; exit 0; fi
          node scripts/game-lint.mjs $files

      # Fails (red) when a changed game is a near-copy of another (new names on the same code); warns when it
      # plays and reads like one already here, with the three nearest games in the log.
      - name: Changed games play differently from the games already here
        env:
          BASE: ${{ github.base_ref }}
        run: node scripts/unique.mjs --since "origin/$BASE...HEAD"

      - name: List changed files outside src/games/
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # Game PRs should only add or change files in src/games/ (and maybe docs). Anything else
          # runs inside the app or in CI, so a maintainer must read it line by line.
          other=$(git diff --name-only "origin/$BASE...HEAD" | grep -vE '^(src/games/[a-z0-9-]+\.js|docs/.*\.(md|png|jpg|webp))$' || true)
          if [ -z "$other" ]; then echo "Only game files changed."; exit 0; fi
          { echo "### Changed outside src/games/ (review every line)"; echo; echo "$other" | sed 's/^/- `/; s/$/`/'; } >> "$GITHUB_STEP_SUMMARY"
          for f in $other; do echo "::warning file=$f::This pull request changes $f, which is outside src/games/. Shared code and CI files run for every game, so review it line by line."; done

  # Mutation check: puts each server and licence guard's defect back, one at a time, and makes sure a
  # test then fails (scripts/mutants.mjs). Runs when the Worker, the licence list or the check change.
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did the guards change?
        id: changed
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(workers/hearts/|src/licences\.js|scripts/(licence-check|mutants)\.mjs|package(-lock)?\.json)'; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "No guard changes."; fi

      - uses: actions/setup-node@v7
        if: steps.changed.outputs.run
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/hearts/package-lock.json

      - name: Install
        if: steps.changed.outputs.run
        run: npm ci && (cd workers/hearts && npm ci && npx wrangler d1 migrations apply game-scroll-hearts --local)

      - name: Every guard is reached by a test
        if: steps.changed.outputs.run
        run: node scripts/mutants.mjs

  # Frame generation quality: made frames scored against the scene really drawn at that moment, in 13
  # suites (blend, ahead, two frames between, hard cases, upscaled...), each scene no worse than
  # scripts/framegen-test/baseline.json. Then the upscalers against the same scene drawn at twice the
  # size: SGSR 2 no worse than a plain stretch, and our changes to it no worse than Qualcomm's shader
  # as it was. WebGPU in software (SwiftShader), so no GPU needed. Runs when frame generation, the 3D
  # kit's WebGPU path, SGSR 2, the frame pacing or the checks change.
  framegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did frame generation change?
        id: changed
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(src/kit/(framegen|hd3d|hd3d-gpu|sgsr2|speed|particles-gpu|power|gpu|toon3d)\.js|src/kit/models/(materials|recipes|recipe-paint|ops)\.js|scripts/(framegen-test|upscale-compare|close-up|look-compare|gpu-loss)|package(-lock)?\.json|\.github/workflows/game-pr-check\.yml)'; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "No frame generation changes."; fi

      - uses: actions/setup-node@v7
        if: steps.changed.outputs.run
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.changed.outputs.run
        run: npm ci

      - name: Which Playwright
        if: steps.changed.outputs.run
        id: pw
        run: echo "version=$(npm view playwright version)" >> "$GITHUB_OUTPUT"

      - name: Cache the browser
        if: steps.changed.outputs.run
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright
        if: steps.changed.outputs.run
        env:
          PW: ${{ steps.pw.outputs.version }}
        run: |
          npm i --no-save "playwright@$PW"
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi

      - name: Made frames no worse than the baseline
        if: steps.changed.outputs.run
        run: node scripts/framegen-test.cjs --check

      - name: SGSR 2 no worse than a plain stretch, and our changes to it no worse than without
        if: steps.changed.outputs.run
        run: node scripts/upscale-compare.cjs --webgpu

      # (the WebGL fallback's own SGSR 2 shader, sgsr2.js, once its history has settled)
      - name: The same on WebGL
        if: steps.changed.outputs.run
        run: node scripts/upscale-compare.cjs --warm 80 --modes plain,sgsr2,sgsr2-plain

      # (gs.models.material's close-up look on WebGPU: never hidden while its shader comes in, steady far off, sharp up close)
      - name: Recipe materials up close
        if: steps.changed.outputs.run
        run: node scripts/close-up.cjs

      # (the graphics chip lost mid-round, as a driver reset or a crashed GPU process does: the round pauses, a new WebGPU
      # device is made, the round is drawn again on it under a cover and carries on, and the loss is reported; then the
      # same while the card waits in the feed. scripts/gpu-loss.cjs)
      - name: A lost graphics chip comes back
        if: ${{ !cancelled() && steps.changed.outputs.run }}
        run: npm run build:bundled && node scripts/gpu-loss.cjs gravity-grip bumper-bowl && node scripts/gpu-loss.cjs gravity-grip --when feed

      # (dust, smoke and glows are drawn over the scene: the ground round each puff is shaded as it is without it,
      # with no square where the puff's corners are; the scene checks itself, scripts/look-compare/index.html dustScene)
      - name: See-through things leave the ground behind them alone
        if: steps.changed.outputs.run
        run: PICK=dust node scripts/look-compare.cjs save "$RUNNER_TEMP/look" --webgpu

  # The app around a game (screen kept on in a round, finer touch, even pixels and the LCD look, the
  # one-line soundtrack, the phone-only save) and the sound itself (every ready-made sound is heard and
  # none is too loud, the limiter holds, instrument sets are level, the music clock keeps the beat
  # through a frozen frame), in a headless browser. Runs when the app shell, the sound or the checks change.
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did the app shell or the sound change?
        id: changed
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(src/(main|saves|soundtrack|sfx|gamescroll|game-modules|util|tour|detail-tour|detail-scenes|qa|perf|playstats|hearts|polyfill|update)\.js|src/kit/(sound|voice-fx|acoustics|instruments|compose|foley|awake|rhythm|lazy|cleanup|tick|progress|fontlib|font-files|pixel|gfx|materials2d|sketch|icons|icon-data)\.js|scripts/(app-test\.cjs|sound-test)|index\.html|vite\.config\.js|package(-lock)?\.json|\.github/workflows/game-pr-check\.yml)'; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "No app shell or sound changes."; fi

      - uses: actions/setup-node@v7
        if: steps.changed.outputs.run
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.changed.outputs.run
        run: npm ci

      - name: Which Playwright
        if: steps.changed.outputs.run
        id: pw
        run: echo "version=$(npm view playwright version)" >> "$GITHUB_OUTPUT"

      - name: Cache the browser
        if: steps.changed.outputs.run
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright
        if: steps.changed.outputs.run
        env:
          PW: ${{ steps.pw.outputs.version }}
        run: |
          npm i --no-save "playwright@$PW"
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi

      - name: Build the app with games inside
        if: steps.changed.outputs.run
        id: build
        run: npm run build:bundled

      - name: The app around a game (awake, touch, pixels, soundtrack, phone save)
        if: steps.changed.outputs.run
        run: node scripts/app-test.cjs

      - name: Sound (ready-made sounds, limiter, instruments, music clock, shaped speech)
        if: ${{ !cancelled() && steps.changed.outputs.run && steps.build.outcome == 'success' }}
        run: node scripts/sound-test.cjs

  # Maths probe: do V8 (Android, the Worker) and JavaScriptCore (iPhone) give the same bits for
  # Math.sin, exp...? Informational (a warning, never red). Runs when the kits change.
  maths:
    runs-on: ubuntu-24.04
    # first run on a new Playwright version installs WebKit's system packages (over 10 minutes on a
    # slow mirror); the browsers are cached after that
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did the kits change?
        id: changed
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(src/kit/|scripts/math-probe\.cjs)'; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "No kit changes."; fi

      - uses: actions/setup-node@v7
        if: steps.changed.outputs.run
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Which Playwright
        if: steps.changed.outputs.run
        id: pw
        run: echo "version=$(npm view playwright version)" >> "$GITHUB_OUTPUT"

      - name: Cache the browsers
        if: steps.changed.outputs.run
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright with Chromium and WebKit
        if: steps.changed.outputs.run
        env:
          PW: ${{ steps.pw.outputs.version }}
        run: |
          npm ci && npm i --no-save "playwright@$PW"
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps chromium webkit; else npx playwright install --with-deps chromium webkit; fi


      - name: Same maths in every engine?
        if: steps.changed.outputs.run
        run: node scripts/math-probe.cjs

  # Shared game links: opens the streamed web app from a link to one game (?g=<id>) on quick, slow and
  # stale connections; that game must be the first card and the one Play starts, and a link to a game
  # that has been taken down must still land in the feed. Runs when the feed, the link code, the
  # game catalogue code or the check change.
  share-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did the feed or the link code change?
        id: changed
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(src/(main|share|remote)\.js|scripts/(share-link|build-games)\.mjs|index\.html|vite\.config\.js|package(-lock)?\.json|\.github/workflows/game-pr-check\.yml)'; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "No feed or link changes."; fi

      - uses: actions/setup-node@v7
        if: steps.changed.outputs.run
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.changed.outputs.run
        run: npm ci

      - name: Which Playwright
        if: steps.changed.outputs.run
        id: pw
        run: echo "version=$(npm view playwright version)" >> "$GITHUB_OUTPUT"

      - name: Cache the browser
        if: steps.changed.outputs.run
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright
        if: steps.changed.outputs.run
        env:
          PW: ${{ steps.pw.outputs.version }}
        run: |
          npm i --no-save "playwright@$PW"
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi

      - name: A shared link opens that game
        if: steps.changed.outputs.run
        run: node scripts/share-link.mjs
