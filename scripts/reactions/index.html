<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222">
<script type="module">
// A film of gs.characters.Reactions for scripts/reactions.cjs: one row for each thing that happens to a
// person, a picture every so often along it, so stumbling, bracing, falling and getting up can be judged
// (and tuned) by eye. It also notes when each state began, the steps taken and where the body ended.
//   ?who=human|person|figure   &acts=shove,blow (default: all)   &cols=10   &cell=200x200
//   &phys=0 (no physics world: falls are acted)   &view=side|three|front|back|top   &gpu (WebGPU)   &from=0&to=1 (the share of each act filmed)   &dbg (the joints' angles at each picture, or &dbg=6 every sixth frame, &joints=armL,foreL, on the console: ALLWARN=1)
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';
import { loadPhysics3D } from '../../src/kit/physics3d.js';
const Q = new URLSearchParams(location.search), GPU = Q.has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
try {
  await loadParts(); await loadPhysics3D();
  if (GPU && !await prepareGPU()) throw new Error('WebGPU did not start in this browser');
  const T = gs.THREE, frame = () => new Promise(r => requestAnimationFrame(r)), who = Q.get('who') || 'human', PHYS = Q.get('phys') !== '0';
  // each act: how long it runs, how fast the person walks (along +z), and what is done to them when
  const ACTS = {
    nudge: { secs: 1.6, at: { .3: r => r.hit([0, 0, -.35]) } },
    shove: { secs: 2.6, at: { .3: r => r.hit([0, 0, 1.6]) } },
    shoveBack: { secs: 2.6, at: { .3: r => r.hit([0, 0, -1.7]) } },
    shoveSide: { secs: 2.6, at: { .3: r => r.hit([1.5, 0, .2]) } },
    blow: { secs: 1.6, at: { .3: (r, b) => r.hit([-.5, 0, -.9], { x: b.position.x + .08, y: 1.62, z: b.position.z + .1 }) } },
    shoulder: { secs: 1.6, at: { .3: (r, b) => r.hit([0, 0, -1.0], { x: b.position.x + .2, y: 1.38, z: b.position.z + .1 }) } },
    knee: { secs: 1.8, at: { .3: (r, b) => r.hit([0, 0, .7], { x: b.position.x + .1, y: .45, z: b.position.z - .1 }) } },
    walkShove: { secs: 3, walk: 1.4, at: { .8: r => r.hit([1.3, 0, .6]) } },
    runTrip: { secs: 6, walk: 5, at: { .8: r => r.trip() } },
    fallFront: { secs: 6.5, at: { .3: r => r.hit([0, 0, 3.6]) } },
    fallBack: { secs: 6.5, at: { .3: r => r.hit([0, 0, -3.6]) } },
    fallSide: { secs: 6.5, at: { .3: r => r.hit([3.4, 0, .3]) } },
    blast: { secs: 7, at: { .3: (r, b) => r.blast({ x: b.position.x - 1.2, y: .2, z: b.position.z - 1.5 }, 11, 5) } },
    shot: { secs: 4, at: { .3: (r, b) => r.fall([0, 0, -1.5], { limp: true }) } },
    guard: { secs: 2, at: { .3: (r, b) => r.brace({ x: b.position.x + 2, y: 1, z: b.position.z + 3 }, .9) } },
    wall: { secs: 3.2, walk: 4.2, wall: 4.2 },
    edge: { secs: 6, edge: -1.0, at: { .3: r => r.hit([0, 0, -2.2]) } },
  };
  const acts = (Q.get('acts') || Object.keys(ACTS).join(',')).split(','), cols = +(Q.get('cols') || 10), [cw, ch] = (Q.get('cell') || '200x200').split('x').map(Number);
  const from = +(Q.get('from') || 0), to = +(Q.get('to') || 1);
  window.__hd.force = 2; window.__hd.upscale = false;
  const v = new gs.hd.HDView({ bg: '#9ab4d0', fog: 0, env: .4, amb: .3 }), cell = document.createElement('canvas'); cell.width = cw; cell.height = ch; const cx = cell.getContext('2d');
  const sun = gs.hd.sun('#fff2d8', 1.9, 4, [.5, .9, .6]); v.scene.add(sun, sun.target); v.sun = sun;
  const sheet = document.createElement('canvas'); sheet.width = cw * cols; sheet.height = ch * acts.length; const sx = sheet.getContext('2d'); document.body.append(sheet);
  const info = [], opts = { seed: 3, build: 'medium' };
  if (who === 'human') await gs.models.human.ready([opts]);
  const VIEW = { side: [1, .16, .1], three: [.8, .35, .75], front: [.12, .2, 1], back: [.8, .3, -.75], top: [.02, 1, .2] }, view = VIEW[Q.get('view')] || VIEW.side;
  for (let r = 0; r < acts.length; r++) {
    const A = ACTS[acts[r]]; if (!A) throw new Error('no act ' + acts[r] + ': ' + Object.keys(ACTS).join(', '));
    const world = new T.Group(); v.scene.add(world);
    const floorW = A.edge != null ? 60 : 200, floor = new T.Mesh(new T.BoxGeometry(floorW, .4, floorW), gs.hd.pbr('#6f7466', { rough: .9 })); floor.position.set(0, -.2, A.edge != null ? A.edge + floorW / 2 : 0); floor.receiveShadow = true; world.add(floor);
    const lower = new T.Mesh(new T.BoxGeometry(200, .4, 200), gs.hd.pbr('#5d6658', { rough: .9 })); lower.position.y = -1.6; lower.receiveShadow = true; if (A.edge != null) world.add(lower);
    let wallM = null; if (A.wall) { wallM = new T.Mesh(new T.BoxGeometry(4, 3, .3), gs.hd.pbr('#8a7f72', { rough: .8 })); wallM.position.set(0, 1.5, A.wall + .15); wallM.castShadow = true; world.add(wallM); }
    const phys = new gs.physics3d.World3D({ gravity: -9.81 }); phys.ground(world);
    const body = who === 'human' ? gs.models.human(opts) : who === 'person' ? gs.poses.person({ mat: c => gs.hd.pbr(c) }) : gs.poses.figure({ mat: c => gs.hd.pbr(c) }); world.add(body);
    if (Q.has('dbg') && !r) console.warn('bones ' + Object.entries(body.rig.parts).map(([n, p]) => `${n} ${p.position.toArray().map(x => x.toFixed(3)).join(' ')} of ${Object.keys(body.rig.parts).find(k => body.rig.parts[k] === p.parent) || 'root'}`).join(' | ') + ' scale ' + body.scale.y + ' base ' + [...body.rig.base].filter(([, b]) => b.some(Boolean)).map(([n, b]) => n + ' ' + b.map(x => x.toFixed(2)).join(' ')).join(' | '));
    if (Q.has('nosteps')) body.rig.steps = false;   // (the poses as drawn, without the feet that keep their place: to tell the two apart)
    const ground = A.edge != null ? (x, z) => z > A.edge ? 0 : -1.4 : null;
    const react = new gs.characters.Reactions(body, { world: PHYS ? phys : null, level: phys, ground });
    const life = who === 'human', dt = 1 / 60, N = Math.round(A.secs / dt), log = []; let state = react.state, steps = 0, speed = 0;
    const events = Object.entries(A.at || {}).map(([t, fn]) => [Math.round(t / dt), fn]);
    const shots = Array.from({ length: cols }, (_, i) => Math.round((from + (to - from) * (i + .5) / cols) * N));
    let far = 0, low = 9, t0 = performance.now(), cost = 0;
    for (let i = 0; i <= N; i++) {
      for (const [at, fn] of events) if (at === i) fn(react, body);
      const want = react.busy ? 0 : (A.walk || 0); speed += (want - speed) * Math.min(1, dt * 6);
      if (!react.busy) body.position.z += speed * dt;
      if (life) body.rig.blend({ idle: 0, walk: 1.4, jog: 3.4, run: 5.6 }, speed); else body.rig.play(speed > 3 ? 'run' : speed > .3 ? 'walk' : 'idle');
      body.rig.update(dt, { speed });
      const c0 = performance.now(); react.update(dt); phys.step(dt); cost += performance.now() - c0;
      if (react.state !== state) { state = react.state; log.push(`${(i * dt).toFixed(2)}s ${state}`); }
      if (react.stepped) steps++; if (react.landed) log.push(`${(i * dt).toFixed(2)}s landed (${react.impact.toFixed(1)} m/s)`); if (react.rose) log.push(`${(i * dt).toFixed(2)}s up`);
      body.updateMatrixWorld(true); const hp = body.rig.parts.hips.getWorldPosition(new T.Vector3()); far = Math.max(far, Math.hypot(hp.x, hp.z)); low = Math.min(low, hp.y);
      const k = shots.indexOf(i);
      if (Q.has('dbg') && (+Q.get('dbg') ? i % +Q.get('dbg') === 0 : k >= 0)) {
        const P = body.rig.parts, d = react.doll, f = n => P[n] ? n + ' ' + [P[n].rotation.x, P[n].rotation.y, P[n].rotation.z].map(x => x.toFixed(2)).join(' ') : '', fast = d && d.parts.reduce((a, p) => p.speed > a.speed ? p : a);
        console.warn(`${acts[r]} ${(i * dt).toFixed(2)}s ${react.state} ${(Q.get('joints') || 'legL,shinL,legR,shinR').split(',').map(f).join(' | ')}${d ? ` asleep ${d.parts.filter(p => p.sleeping).length} fastest ${fast.part} ${fast.speed.toFixed(2)} at y ${fast.pos.y.toFixed(2)}` : ''}`);
      }
      if (k >= 0) {
        const aim = new T.Vector3(hp.x, Math.max(.75, hp.y * .5 + .45) + (A.edge != null ? Math.min(0, hp.y - 1) * .5 : 0), hp.z), len = Math.hypot(...view), dist = 4.6;
        v.cam.fov = 30; v.cam.aspect = cw / ch; v.cam.near = .1; v.cam.far = 200; v.cam.updateProjectionMatrix();
        v.cam.position.set(aim.x + view[0] / len * dist, aim.y + view[1] / len * dist + .2, aim.z + view[2] / len * dist); v.cam.lookAt(aim); v.cam.updateMatrixWorld(); v.cut?.();
        sun.follow(hp.x, 0, hp.z);
        for (let n = 0; n < (k ? 2 : 5); n++) { v.t = 0; v.render(cx, cw, ch); await frame(); }
        sx.drawImage(cell, k * cw, r * ch);
        sx.font = '11px sans-serif'; sx.fillStyle = '#000'; sx.fillText(`${acts[r]} ${(i * dt).toFixed(2)}s ${react.state}`, k * cw + 4, r * ch + 12);
      }
    }
    const P = body.rig.parts, feetY = [P.shinL, P.shinR].map(s => s.localToWorld(new T.Vector3(0, -.43, 0)).y.toFixed(2));
    info.push(`${acts[r]}: ${log.join(', ') || 'steady throughout'}; steps ${steps}; ends ${react.state} at x ${body.position.x.toFixed(2)} z ${body.position.z.toFixed(2)} y ${body.position.y.toFixed(2)}, hips ${P.hips.getWorldPosition(new T.Vector3()).y.toFixed(2)} high, ankles ${feetY.join('/')}; furthest ${far.toFixed(2)} m, lowest hips ${low.toFixed(2)}; ${(cost / N).toFixed(3)} ms a frame`);
    react.reset(); phys.free(); v.scene.remove(world);
  }
  window.result = { sheet: sheet.toDataURL(), info, backend: window.__hd.info.backend };
} catch (e) { window.result = { error: String(e && e.stack || e) }; }
</script>
