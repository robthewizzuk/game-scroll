apply plugin: 'com.android.application'

android {
    namespace = "com.gamescroll.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.game_scroll.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI builds count up so each new APK installs over the last one.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // One shared debug key (android/app/debug.keystore, standard "android" passwords) so every
    // CI-built APK has the same signature and installs as an update, keeping saved progress.
    // Not for store releases.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Google Play upload key. CI writes it from GitHub secrets (.github/workflows/android-play.yml,
        // docs/google-play.md); it is never in the repository. Without it the store build is unsigned.
        if (System.getenv('PLAY_UPLOAD_KEYSTORE')) {
            release {
                storeFile file(System.getenv('PLAY_UPLOAD_KEYSTORE'))
                storePassword System.getenv('PLAY_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('PLAY_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('PLAY_UPLOAD_KEY_PASSWORD') ?: System.getenv('PLAY_UPLOAD_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (System.getenv('PLAY_UPLOAD_KEYSTORE')) signingConfig signingConfigs.release
            // Shrink the store build: drops unused classes and resources (Play Services, ARCore...).
            // Capacitor, ARCore and the Play libraries bring their own keep rules; ours are in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// The phone's AI chip (plugins/npu). Qualcomm's NPU loads its half of QNN from files on disk, so the
// app's native libraries stay unpacked on the phone. Left out: the QNN parts we don't use (the older DSP
// and the GPU backends) and the NPU generations before the Snapdragon 8 Gen 2's; those phones use the CPU.
android {
    packaging {
        jniLibs {
            useLegacyPackaging = true
            excludes += ['**/libQnnDsp*.so', '**/libQnnGpu.so', '**/libQnnHtpV68*.so', '**/libQnnHtpV69*.so']
        }
    }
}

// Our own APKs (debug builds, from GitHub) leave Qualcomm's NPU libraries out entirely: about 57 MB of
// an 85 MB APK. On a phone with a supported Snapdragon NPU the app downloads the ~40 MB that phone needs
// from Qualcomm's own release, only once a game first starts face, hand or sound tracking, on Wi-Fi, and
// checks every file (plugins/npu QnnRuntime.java). Store (release) builds keep them, because Google Play
// doesn't let an app download code (Play's on-demand feature modules are the way to leave them out there).
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.packaging.jniLibs.excludes.add('**/libQnn*.so')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
