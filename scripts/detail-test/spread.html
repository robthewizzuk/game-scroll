<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<script type="module">
// Heavy effects spread over frames (HD.spread: src/kit/hd3d-gpu-spread.js) for scripts/detail-test.cjs --page spread:
// a room lit by a low sun through slats (ambient occlusion in its corners, volumetric light in its beams, bounce light
// off a red and a green wall), drawn with every sample every frame (HD.spread false) and spread over frames, then
// compared: held still, while the camera moves and a crate slides, just after a cut, and with the beams switched to a lamp. Also that a still picture
// settles (the app's still-frame check needs it to stop changing) and that a cut keeps nothing from before it.
//   ?gpu  ?up (SGSR 2 at 70%)  ?tier=2  ?w=240&h=320  ?still=60 (frames held still: the picture is held from 48)  ?moving=36 (frames of the move)  ?only=ao,vol,bounce (spread only those)
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';
const Q = new URLSearchParams(location.search), GPU = Q.has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
await loadParts();
if (GPU && !await prepareGPU()) { window.result = { error: 'WebGPU did not start in this browser' }; throw new Error(window.result.error); }
const T = gs.THREE, HD = window.__hd, W = +(Q.get('w') || 240), H = +(Q.get('h') || 320), STILL = +(Q.get('still') || 60), MOVING = +(Q.get('moving') || 36);
HD.force = +(Q.get('tier') ?? 2); HD.upscale = false; HD.grain = 0; HD.still = false; HD.hold = false;
// ?up: drawn at 70% and upscaled by SGSR 2, which moves the camera by a fraction of a pixel each frame (the spread takes it back out)
if (Q.has('up')) { HD.upscale = true; HD.upscaler = 'sgsr2'; HD.scale = .7; }
const frame = () => new Promise(r => requestAnimationFrame(r));
const checks = [], info = {}, out = {};
const check = (name, ok, note) => checks.push({ name, ok: !!ok, note });
try {
  const v = new gs.hd.HDView({ bg: '#0d0f14', fog: 0, env: .08, amb: .05 }), c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  const sun = gs.hd.sun('#ffe2b0', 5, 10, [1, .7, -.3]); v.scene.add(sun, sun.target); v.sun = sun; sun.follow(0, 0, 0);
  const box = (w, h, d, col, px, py, pz) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), gs.hd.pbr(col, { rough: .9 })); m.position.set(px, py, pz); m.castShadow = m.receiveShadow = true; v.scene.add(m); return m; };
  box(8, .1, 8, '#a89a88', 0, -.05, 0); box(8, .1, 8, '#4a3a2c', 0, 3.05, 0); box(8, 3, .1, '#9a8a76', 0, 1.5, -4);
  box(.1, 3, 8, '#b03028', -4, 1.5, 0);   // a red wall, to bounce light off
  for (let i = 0; i < 9; i++) box(.1, 3, .55, '#5a4836', 4, 1.5, -3.6 + i * .9);   // slats with gaps for the sun
  box(.6, 3, .6, '#8a8070', -1.6, 1.5, -2.6); box(.6, 3, .6, '#8a8070', 1.4, 1.5, -2.6);   // pillars: corners for the ambient occlusion
  box(1.6, .5, .9, '#2f8a3a', -2.2, .25, -1);   // a green bench
  const crate = box(.8, .8, .8, '#8a6a40', -.6, .4, 1.6);
  const sunBeams = v.beams = { density: .12, far: 12, glow: .5, strength: 3 }; v.liveBounce = 'screen';
  // a lamp the beams can switch to: what the sun's beams gathered must not linger in the lamp's
  const lamp = gs.hd.spot('#ffd9a0', 30, 9, .45); lamp.position.set(-1, 2.9, -1.5); lamp.target.position.set(-1, 0, -1); v.scene.add(lamp, lamp.target);
  const A = { p: [-1.5, 1.6, 4.2], at: [.6, 1.1, -1.2] }, B = { p: [1.6, 1.2, 3.2], at: [-.8, 1, -2] }, C = { p: [0, 2.4, 1.2], at: [0, .3, -3] };
  const pose = (P, Q2, t) => { const L = (a, b) => a + (b - a) * t; v.cam.position.set(L(P.p[0], Q2.p[0]), L(P.p[1], Q2.p[1]), L(P.p[2], Q2.p[2])); v.cam.lookAt(L(P.at[0], Q2.at[0]), L(P.at[1], Q2.at[1]), L(P.at[2], Q2.at[2])); v.cam.updateMatrixWorld(); };
  const draw = async () => { v.t = 0; v.render(x, W, H); x.getImageData(0, 0, 1, 1); await frame(); };
  const grab = () => x.getImageData(0, 0, W, H).data.slice();
  // how far apart two pictures are: mean difference (0..255), share of pixels off by more than 24, the most any is off
  const apart = (a, b) => { let sum = 0, big = 0, most = 0; const n = a.length / 4; for (let i = 0; i < a.length; i += 4) { const d = Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2])); sum += d; if (d > 24) big++; if (d > most) most = d; } return { mean: +(sum / n).toFixed(2), big: +(big / n * 100).toFixed(2), most }; };
  // the still-frame check's own measure (framegen.js StillCheck): a sixteenth of the pixels, brightness changed by more than 2/255
  const changed = (a, b) => { let n = 0, m = 0; for (let y = 2; y < H; y += 4) for (let xx = 2; xx < W; xx += 4) { const i = (y * W + xx) * 4, la = .2126 * a[i] + .7152 * a[i + 1] + .0722 * a[i + 2], lb = .2126 * b[i] + .7152 * b[i + 1] + .0722 * b[i + 2]; m++; if (Math.abs(la - lb) > 2) n++; } return +(n / m * 100).toFixed(2); };
  const pic = px => { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d'), im = g.createImageData(W, H); im.data.set(px); g.putImageData(im, 0, 0); return cv.toDataURL(); };
  const diffPic = (a, b) => { const d = new Uint8ClampedArray(a.length); for (let i = 0; i < a.length; i += 4) { const e = Math.min(255, 6 * Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2]))); d[i] = e; d[i + 1] = e >> 1; d[i + 3] = 255; } return pic(d); };
  const parts = () => { const p = HD.info.gpuParts; return p ? { ao: p.ao, vol: p['volumetric light'], bounce: p['bounce light'], all: HD.info.gpuMs } : null; };
  // one run: held still at A, then the move from A to B with the crate sliding, then a cut to C held a while and a cut to B
  async function run(spread) {
    HD.spread = spread; const r = {};
    crate.position.set(-.6, .4, 1.6); pose(A, A, 0); v.cut();
    for (let i = 0; i < STILL; i++) await draw();
    r.still = grab(); r.parts = parts(); await draw(); r.settle = changed(r.still, grab()); r.listed = HD.info.spread;
    for (let i = 1; i <= MOVING; i++) { const t = i / MOVING; pose(A, B, t); crate.position.set(-.6 + 1.8 * t, .4, 1.6 - .8 * t); await draw(); }
    r.moving = grab();
    // the camera held at B while the crate slides back, then rests: nothing of where it was may linger (on a still camera history counts most)
    for (let i = 1; i <= 20; i++) { const t = i / 20; crate.position.set(1.2 - 1.8 * t, .4, .8 + .8 * t); await draw(); }
    for (let i = 0; i < 6; i++) await draw();
    r.slid = grab();
    pose(C, C, 0); v.cut(); for (let i = 0; i < 12; i++) await draw();
    pose(B, B, 0); v.cut(); await draw(); r.cutFromC = grab();
    pose(A, A, 0); v.cut(); for (let i = 0; i < 12; i++) await draw();
    pose(B, B, 0); v.cut(); await draw(); r.cutFromA = grab();
    // the beams switched from the sun to the lamp, with the camera still: three frames on
    v.beams = { light: lamp, density: .2, far: 12, glow: .3, strength: 2 }; for (let i = 0; i < 3; i++) await draw();
    r.lamp = grab(); v.beams = sunBeams;
    return r;
  }
  const only = Q.get("only"), off = await run(false), on = await run(only || true);
  info.backend = HD.info.backend; info.upscaled = HD.info.upscaled; info.spread = on.listed; info.chipOff = off.parts; info.chipOn = on.parts;
  const still = apart(off.still, on.still), moving = apart(off.moving, on.moving), cut = apart(on.cutFromC, on.cutFromA), cut0 = apart(off.cutFromC, off.cutFromA), cutVs = apart(off.cutFromA, on.cutFromA);
  const slid = apart(off.slid, on.slid), lampd = apart(off.lamp, on.lamp);
  info.still = still; info.moving = moving; info.slid = slid; info.afterCut = cutVs; info.lamp = lampd; info.settle = { off: off.settle, on: on.settle };
  out['still-all'] = pic(off.still); out['still-spread'] = pic(on.still); out['still-diff'] = diffPic(off.still, on.still);
  out['moving-all'] = pic(off.moving); out['moving-spread'] = pic(on.moving); out['moving-diff'] = diffPic(off.moving, on.moving);
  out['slid-all'] = pic(off.slid); out['slid-spread'] = pic(on.slid); out['slid-diff'] = diffPic(off.slid, on.slid);
  out['cut-all'] = pic(off.cutFromA); out['cut-spread'] = pic(on.cutFromA); out['lamp-all'] = pic(off.lamp); out['lamp-spread'] = pic(on.lamp);
  if (HD.info.backend === 'webgpu') {
    check('ambient occlusion, volumetric light and bounce light are spread', (only ? only.split(',') : ['ao', 'vol', 'bounce']).every(k => on.listed.split(' ').includes(k)) && !off.listed, `spread: "${on.listed}", off: "${off.listed}"`);
    check('held still, it settles near the picture with every sample', still.mean < 2 && still.big < 1, `mean ${still.mean}/255, ${still.big}% of pixels off by more than 24`);
    // (under SGSR 2 the picture moves a little every frame anyway, its jitter: then no more than that)
    check('held still, the picture stops changing (the still-frame check can stop drawing)', on.settle <= off.settle + (Q.has('up') ? .2 : 0), `${on.settle}% of the checked pixels changed between two frames (${off.settle}% with every sample)`);
    check('while the camera moves and the crate slides, it stays near the picture with every sample', moving.mean < 3 && moving.big < 2.5, `mean ${moving.mean}/255, ${moving.big}% off by more than 24`);
    check('with the camera still, nothing of where the crate was lingers', slid.mean < 2 && slid.big < 1, `mean ${slid.mean}/255, ${slid.big}% off by more than 24`);
    // (the frame after a cut from two places, against the same with every sample: under SGSR 2 the two differ anyway, by where its jitter is)
    check('a cut keeps nothing from before it', cut.most <= Math.max(2, cut0.most) && cut.mean <= cut0.mean * 1.1 + .05, `the frame after a cut from two places: most apart ${cut.most}/255, mean ${cut.mean} (every sample: ${cut0.most}, ${cut0.mean})`);
    check('the frame after a cut is near the picture with every sample', cutVs.mean < 4 && cutVs.big < 4, `mean ${cutVs.mean}/255, ${cutVs.big}% off by more than 24`);
    check('the beams switched to another light keep nothing of the first', lampd.mean < 3 && lampd.big < 3, `three frames on: mean ${lampd.mean}/255, ${lampd.big}% off by more than 24`);
  } else {
    // WebGL draws every sample every frame either way
    check('WebGL: nothing is spread and the switch changes nothing', !on.listed && apart(off.still, on.still).most === 0 && apart(off.moving, on.moving).most === 0, `spread: "${on.listed}"`);
  }
  window.result = { checks, info, out };
} catch (e) { window.result = { error: (e && e.stack) || String(e) }; }
</script>
