<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222">
<script type="module">
// The face lab for scripts/face-lab.cjs: people's faces close up, one row for each person, one column for each
// light and view, so skin, eyes, hair and the shape of a head can be judged (and tuned) by eye under the light
// a game might put them in. Twelve people of different ages, builds and skin unless asked otherwise.
//   &who=0,3,7 (which of the twelve)   &cols=sun:face,overcast:face,lamp:face,indoor:face   light:view
//   lights: sun (a clear day), overcast (soft and even), lamp (a street lamp at night), indoor (a window to one side), back (the sun behind)
//   views: face (three quarters, close), eyes (the eyes and the lids, closest), nose (closer still: the nose and the mouth), front, side, bust (head and shoulders), body (the whole person)
//   &noao &noshadow &nocontact (the person left out of the ambient occlusion, its own shadow or the contact shadows: to find where a dark patch comes from)   &nowet (a real face's wet film over the eyes left out)   &blinks (let them blink)
//   &frames=4 (frames drawn before a cell is taken: more lets the smoothing over frames settle)   &cell=300x360   &gpu (WebGPU)   &tier=3 (the phone's quality, 0..3)   &time (how long a frame takes)
//   &ref (one more row: a reference head scan, ref/LeePerrySmith.glb from three.js's examples (CC BY 3.0, Lee Perry-Smith / Infinite Realities), drawn
//   under the same lights to judge our faces' shapes and skin against a real one: fetch it into scripts/face-lab/ref/ yourself, it is never committed)
//   &strands (strands on the hair too; &strands=off: none, not even on a beard)   &wrap=4 (cells to a row of the sheet: people run on across rows)   &look=clean|real (every person drawn in that look)   &pose=idle   &mouth=.5 (open it)   &expr=smile:1 (a face shape set)
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';
const Q = new URLSearchParams(location.search), GPU = Q.has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
// the twelve: young and old, men and women, heavy and slight, skin from very fair to very dark
const LAB = [
  { name: 'Ade, 24', sex: 'm', seed: 1, age: 24, weight: .45, skin: '#5c3a26', hair: '#141210', iris: '#3a2416' },
  { name: 'Mira, 31', sex: 'f', seed: 2, age: 31, weight: .4, skin: '#e8c2a4', hair: '#6a4024', hairStyle: 'long', iris: '#4a6a3a' },
  { name: 'Tomas, 46', sex: 'm', seed: 3, age: 46, weight: .6, skin: '#d4a07c', hair: '#3b2a1a', beard: .35, iris: '#5a7a9a' },
  { name: 'Keiko, 27', sex: 'f', seed: 4, age: 27, weight: .35, skin: '#e6bf98', hair: '#141210', hairStyle: 'short', iris: '#2e1c10' },
  { name: 'Walt, 71', sex: 'm', seed: 5, age: 71, weight: .55, skin: '#e2b496', hair: '#a8a8a4', iris: '#6a8090' },
  { name: 'Rosa, 55', sex: 'f', seed: 6, age: 55, weight: .7, skin: '#b88058', hair: '#2a1c12', hairStyle: 'bun', iris: '#3a2416' },
  { name: 'Dev, 35', sex: 'm', seed: 7, age: 35, weight: .5, skin: '#9a6440', hair: '#141210', moustache: true, iris: '#2e1c10' },
  { name: 'Edith, 78', sex: 'f', seed: 8, age: 78, weight: .45, skin: '#f0cdb4', hair: '#c8c4bc', hairStyle: 'bun', iris: '#7a8ea0' },
  { name: 'Finn, 19', sex: 'm', seed: 9, age: 19, weight: .3, skin: '#f2d0b8', hair: '#8a3a1c', iris: '#5a7a5a' },
  { name: 'Kwame, 60', sex: 'm', seed: 10, age: 60, weight: .75, skin: '#3e2618', hair: '#3a3632', beard: .7, iris: '#2a1810' },
  { name: 'Lena, 42', sex: 'f', seed: 11, age: 42, weight: .55, skin: '#c69470', hair: '#4a3020', hairStyle: 'long', iris: '#5a4028' },
  { name: 'Sam, 63', sex: 'm', seed: 12, age: 63, weight: .85, skin: '#dcae8c', hairStyle: 'bald', iris: '#4a5a6a' },
];
try {
  await loadParts();
  if (GPU && !await prepareGPU()) throw new Error('WebGPU did not start in this browser');
  const T = gs.THREE, human = gs.models.human, frame = () => new Promise(r => requestAnimationFrame(r));
  const pick = Q.has('who') ? Q.get('who').split(',').map(Number) : LAB.map((_, i) => i);
  if (Q.has('ref')) { LAB.push({ name: 'Scan (reference)', scan: true }); pick.push(LAB.length - 1); }
  const cols = (Q.get('cols') || 'sun:face,overcast:face,lamp:face,indoor:face').split(',').map(c => { const [light, view = 'face'] = c.split(':'); return { light, view }; });
  const [cw, ch] = (Q.get('cell') || '300x360').split('x').map(Number);
  window.__hd.force = Q.has('tier') ? +Q.get('tier') : 3; window.__hd.upscale = false; window.__hd.hold = false;   // (a sheet wants every cell drawn, not a frame's wait for a new shader)
  const v = new gs.hd.HDView({ bg: '#9ab4d0', fog: 0, env: .4, amb: .3, fov: 30 }), cell = document.createElement('canvas'); cell.width = cw; cell.height = ch; const cx = cell.getContext('2d');
  const sun = gs.hd.sun('#fff2d8', 2.2, 2, [.5, .9, .6]); sun.softShadows?.(1); v.scene.add(sun, sun.target); v.sun = sun;
  const lamp = gs.hd.spot('#ffc890', 0, 12, .6); v.scene.add(lamp, lamp.target);
  const room = new T.Group(); v.scene.add(room);   // a wall behind (only for some lights)
  const wall = new T.Mesh(new T.PlaneGeometry(8, 5), gs.hd.pbr('#8c8478', { rough: .95 })); wall.position.set(0, 1.5, -1.6); wall.receiveShadow = true; room.add(wall);
  const floor = new T.Mesh(new T.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), gs.hd.pbr('#6f7466', { rough: .9 })); floor.receiveShadow = true; v.scene.add(floor);
  // each light: the background, the sky's fill, the sun (colour, strength, way), the lamp (strength, where), reflections
  const LIGHTS = {
    sun: { bg: '#9ab4d0', sky: '#9ab0d0', ground: '#4a4438', amb: .35, sun: ['#fff2d8', 2.4, [.55, .8, .7]], env: .45, wall: false },
    overcast: { bg: '#b8bcc0', sky: '#c8ccd4', ground: '#5a5a54', amb: .55, sun: ['#e8ecf0', .3, [.1, 1, .3]], env: .6, wall: false },
    lamp: { bg: '#0c1018', sky: '#1a2438', ground: '#0a0a0a', amb: .06, sun: ['#9ab0e0', .08, [-.4, .8, .3]], spot: [3.2, [.7, 2.4, .9]], env: .06, wall: true },
    indoor: { bg: '#3a3430', sky: '#c0b8ac', ground: '#3a3028', amb: .28, sun: ['#dfe8f4', 1.6, [1, .25, .35]], env: .3, wall: true },
    back: { bg: '#e0c8a0', sky: '#a0b0c8', ground: '#4a4438', amb: .3, sun: ['#ffe0b0', 2.6, [-.3, .45, -1]], env: .4, wall: false },
  };
  const setLight = (k, aim) => {
    const L = LIGHTS[k] || LIGHTS.sun; v.scene.background = new T.Color(L.bg); v.hemi.color.set(L.sky); v.hemi.groundColor.set(L.ground); v.hemi.intensity = L.amb; v.envI = L.env;
    sun.color.set(L.sun[0]); sun.intensity = L.sun[1]; sun.aim(...L.sun[2]); sun.follow(aim.x, aim.y, aim.z);
    lamp.intensity = L.spot ? L.spot[0] : 0; if (L.spot) { lamp.position.set(aim.x + L.spot[1][0], L.spot[1][1], aim.z + L.spot[1][2]); lamp.target.position.copy(aim); lamp.target.updateMatrixWorld(); }
    room.visible = L.wall;
  };
  const sheet = document.createElement('canvas'), LABEL = 18, WRAP = +(Q.get('wrap') || cols.length), cells = pick.length * cols.length, at = (r, k) => { const i = r * cols.length + k; return [(i % WRAP) * cw, Math.floor(i / WRAP) * (ch + LABEL)]; };
  sheet.width = cw * WRAP; sheet.height = (ch + LABEL) * Math.ceil(cells / WRAP); const sx = sheet.getContext('2d'); document.body.append(sheet);
  sx.fillStyle = '#1c1c1e'; sx.fillRect(0, 0, sheet.width, sheet.height);
  const info = [], t0 = performance.now();
  const optsOf = i => { const o = { ...LAB[i] }; delete o.name; if (Q.has('look')) o.look = Q.get('look'); if (Q.has('strands')) o.strands = Q.get('strands') !== 'off'; if (o.hairStyle === 'bald') o.hair = null; return o; };
  await human.ready(pick.filter(i => !LAB[i].scan).map(optsOf));
  const scan = Q.has('ref') ? await refHead(T, v) : null;
  info.push('sculpted ' + pick.length + ' in ' + Math.round(performance.now() - t0) + ' ms');
  const VIEW = { eyes: [.3, .04, 1, .17], nose: [.5, .02, 1, .3], mouth: [.45, -.05, 1, .3], face: [.62, .1, 1, .62], front: [0, .06, 1, .62], side: [1, .06, .02, .62], bust: [.5, .12, 1, 1.05], body: [.45, .2, 1, 3.1] };
  for (let r = 0; r < pick.length; r++) {
    const p = LAB[pick[r]].scan ? scan : human(optsOf(pick[r])); v.scene.add(p); p.lod = 0;
    p.traverse(o => { if (o.isMesh) { if (Q.has('noao')) o.userData.noAO = true; if (Q.has('nocontact')) o.userData.noContact = true; if (Q.has('noshadow')) o.castShadow = false; } });   // (&noao, &nocontact: the person left out of the ambient occlusion, the contact shadows)
    if (Q.has('nowet') && p.wet) p.wet.visible = false;   // (&nowet: a real face's wet film over the eyes left out)
    if (Q.has('facelight')) v.faceLight(p, { strength: +Q.get('facelight') || .5 });   // (&facelight=.5: a soft light beside the camera on the face, HDView.faceLight)
    p.rig.play?.(Q.get('pose') || 'idle'); for (let i = 0; i < 30; i++) p.rig.update(1 / 30);
    if (Q.has('expr')) for (const e of Q.get('expr').split(';')) { const [k, a] = e.split(':'); p.face?.set?.(k, +a); }
    if (Q.has('mouth')) p.face?.mouth?.(+Q.get('mouth'));
    p.face?.look?.(null); p.face.awake = true; if (!Q.has("blinks")) { p.face.blinkEvery = 0; p.face.blinking = 0; }   // (a sheet wants open eyes: &blinks lets them blink)
    for (let i = 0; i < 20; i++) p.rig.update(1 / 30);
    info.push(`${LAB[pick[r]].name}: ${p.tris.join('/')} triangles`);
    for (let k = 0; k < cols.length; k++) {
      const { light, view } = cols[k], d = VIEW[view] || VIEW.face, len = Math.hypot(d[0], d[1], d[2]), dist = d[3];
      p.updateMatrixWorld(true); const aim = new T.Vector3(); p.bones.head.getWorldPosition(aim); aim.y += view === 'body' ? -.75 : view === 'bust' ? 0 : view === 'nose' ? .115 : view === 'mouth' ? .07 : view === 'eyes' ? .148 : .1;
      setLight(light, aim);
      v.cam.aspect = cw / ch; v.cam.near = dist * .05; v.cam.far = dist * 80; v.cam.updateProjectionMatrix();
      v.cam.position.set(aim.x + d[0] / len * dist, aim.y + d[1] / len * dist, aim.z + d[2] / len * dist); v.cam.lookAt(aim); v.cam.updateMatrixWorld(); v.cut?.();
      p.face?.look?.(v.cam.position);
      for (let i = 0, nf = +(Q.get('frames') || 4); i < nf; i++) { v.t = 0; p.rig.update(1 / 60); v.render(cx, cw, ch); await frame(); }
      const [px, py] = at(r, k); sx.drawImage(cell, px, py + LABEL);
      if (Q.has('time')) { const t1 = performance.now(); for (let i = 0; i < 10; i++) { v.t = 0; v.render(cx, cw, ch); } info.push(`  ${light}:${view} ${((performance.now() - t1) / 10).toFixed(1)} ms a frame`); }
      sx.font = '12px sans-serif'; sx.fillStyle = '#ddd'; sx.fillText(`${LAB[pick[r]].name} · ${light}`, px + 5, py + 13);
    }
    v.scene.remove(p); if (Q.has('facelight')) v.faceLight(null);
  }
  window.result = { sheet: sheet.toDataURL(), info, backend: window.__hd.info.backend };
} catch (e) { window.result = { error: String(e && e.stack || e) }; }
// the reference scan (&ref): its own colour, shine and fine normals as photographed, on three's physical material with a sheen, scaled to a
// real head (23 cm from the crown to the chin) and stood where a person's head would be; it has no rig or face of its own
async function refHead(T, v) {
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js'), tl = new T.TextureLoader(), tex = (f, srgb) => { const t = tl.load('./ref/' + f); if (srgb) t.colorSpace = T.SRGBColorSpace; t.anisotropy = 8; return t; };
  const g = await new GLTFLoader().loadAsync('./ref/LeePerrySmith.glb'), mesh = g.scene.getObjectByProperty('isMesh', true);
  const spec = tex('Map-SPEC.jpg', false), m = gs.hd.pbr('#ffffff', { rough: .5 }); Object.assign(m, { map: tex('Map-COL.jpg', true), normalMap: tex('Infinite-Level_02_Tangent_SmoothUV.jpg', false), sheen: .25, specularIntensityMap: spec });
  m.sheenColor = new T.Color('#d08068'); mesh.material = m; mesh.castShadow = mesh.receiveShadow = true;
  // (measured off the scan: its crown at y 3.97 and its chin near -.65, so a 23 cm head is .05 of it; its eyes near 1.9 up; it faces +z as a person does)
  const k = .23 / 4.6, p = new T.Group(), inner = new T.Group(), head = new T.Object3D(); inner.add(mesh); p.add(inner, head); inner.scale.setScalar(k);
  head.position.set(0, 1.5, 0); inner.position.set(0, 1.5 + .148 - 1.9 * k, 0);   // (a person's head bone .148 under the eyes)
  return Object.assign(p, { bones: { head }, rig: { play() {}, update() {} }, face: { look() {}, awake: true }, tris: [mesh.geometry.index ? mesh.geometry.index.count / 3 : 0], wet: null });
}
</script>
