<!doctype html>
<meta charset="utf-8">
<title>Frame generation check</title>
<body style="margin:0;background:#000">
<script type="module">
// Draws a moving test scene at three real moments, makes the frames in between (or past the newest)
// with src/kit/framegen.js, and scores each against the scene really drawn at that time. Baselines:
// showing the last real frame again (what a 60 fps game does on a 120 Hz screen) and a plain 50/50 mix.
// Query: ?scale=1.5 (render smaller than the screen, as under SGSR 2), &mode=ahead, &shots, &w=480&h=640,
// &steps=3 (refreshes per real frame on a 120 Hz screen: 2 is 60 fps, 3 is 40 fps with two made frames
// at a third and two thirds), &kinds=still,strafe,turn,pan,curve (the default; add aim for fresh aim's turn) or
// glass,sparks,sparks-moving,smoke,jitter (the hard cases: see-through things, glowing particles that
// don't and that do say how they move, smoke, and SGSR 2's camera jitter, where the picture is steady
// but motion and depth shake), &plain (a plain ground), or shadow,scroll,cut (what the game's motion
// doesn't describe: shadows of moving things on still ground, a scrolling texture, and a cut to a new
// scene, where a made frame must never mix the two); &flow=0, &fill=0, &sharp=0: without the optical flow, the gap-filling pyramid, or the sharp sampling
// shapes: blend shapes (morph targets) on still things, one held and one coming and going (fur shells, a talking face)
// copies: a field of things drawn as copies the way gs.props are on WebGPU (hd3d-gpu.js gpuProps: a list
// for each detail level), strafed past, with every copy between 12 and 30 m changing level at the newest
// real frame (as a scope's zoom does): a copy's motion comes from what its place in the list held last frame
import * as THREE from 'three/webgpu';
import { pass, mrt, output, velocity, texture, uv, vec4, mix, uniform, screenUV } from 'three/tsl';
import { FrameGen, frameGenMRT, particleMotion, fgPrevVP, poseOf, homography, warpUV } from '/src/kit/framegen.js';
import { gpuProps } from '/src/kit/hd3d-gpu.js';

const Q = new URLSearchParams(location.search), OW = +(Q.get('w') || 512), OH = +(Q.get('h') || 640);
const scale = +(Q.get('scale') || 1), RW = Math.round(OW / scale), RH = Math.round(OH / scale);
const ahead = Q.get('mode') === 'ahead', STEPS = Math.max(2, Math.round(+(Q.get('steps') || 2))), H = STEPS / 120;
const KINDS = (Q.get('kinds') || 'still,strafe,turn,pan,curve').split(',');
// the moments made, as the app makes them: blend 1/steps .. (steps-1)/steps between the last two, ahead past the newest
const TIMES = Array.from({ length: STEPS - 1 }, (_, k) => (ahead ? 1 : 0) + (k + 1) / STEPS);
const out = { scenes: {}, shots: {} };

const r = new THREE.WebGPURenderer({ antialias: false });
await r.init();
if (!r.backend.isWebGPUBackend) { window.result = { error: 'no WebGPU' }; throw 0; }
r.setPixelRatio(1); r.setSize(OW, OH); document.body.appendChild(r.domElement);

// a checker for the ground and the objects, so a wrong move shows as broken squares
function checker(a, b, n = 8) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { g.fillStyle = (x + y) & 1 ? a : b; g.fillRect(x * 128 / n, y * 128 / n, 128 / n, 128 / n); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

function makeScene(kind) {
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#6a8fc0');
  r.shadowMap.enabled = kind === 'shadow';
  const cam = new THREE.PerspectiveCamera(55, OW / OH, .1, 200);
  scene.add(new THREE.HemisphereLight('#ffffff', '#445566', 1.6)); const sun = new THREE.DirectionalLight('#fff4e0', 2.2); sun.position.set(3, 6, 2); scene.add(sun);
  // 'shadow': the things cast sharp shadows on the ground, which has no motion of its own
  if (kind === 'shadow') { sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: .5, far: 30 }); sun.shadow.camera.updateProjectionMatrix(); }
  // &plain: a plain ground (what the moving sparks are lifted off is then easy to tell from the sparks)
  const gt = Q.has('plain') ? checker('#3a4038', '#3c4239') : checker('#d8d0c0', '#5a6a50'); gt.repeat.set(20, 20);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ map: gt })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const things = [];
  const mat = c => new THREE.MeshStandardMaterial({ map: checker(c, '#202020', 4), roughness: .5 });
  for (let i = 0; i < 6; i++) {
    const m = new THREE.Mesh(i % 2 ? new THREE.BoxGeometry(1.2, 1.2, 1.2) : new THREE.SphereGeometry(.7, 32, 16), mat(['#e04040', '#40c060', '#4080e0', '#e0c040', '#c040c0', '#40c0c0'][i]));
    m.castShadow = true; scene.add(m); things.push(m);
  }
  // a pillar near the camera: things pass behind it, so the gaps it opens test the hole fill
  const pillar = new THREE.Mesh(new THREE.BoxGeometry(.6, 6, .6), mat('#a0a0a0')); pillar.position.set(.6, 3, 2.5); scene.add(pillar);
  // see-through: a glass ball racing across in front of everything
  const glass = kind === 'glass' && new THREE.Mesh(new THREE.SphereGeometry(1.1, 32, 16), new THREE.MeshStandardMaterial({ color: '#a0e0ff', transparent: true, opacity: .35, roughness: .1 }));
  if (glass) scene.add(glass);
  // glowing sparks (added light, no depth), flying fast; 'sparks-moving' tells frame generation how
  // each moves (particleMotion, as gs.hd's GPU particles do), 'sparks' doesn't
  // 'smoke': soft grey puffs (ordinary see-through blending) that say how they move (frame generation
  // leaves them as drawn: moving them dragged the ground behind along)
  const sparks = [], smoke = kind === 'smoke', moving = kind === 'sparks-moving' || smoke;
  if (kind === 'sparks' || moving) {
    const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    if (smoke) { gr.addColorStop(0, 'rgba(70,70,78,.9)'); gr.addColorStop(1, 'rgba(90,90,96,0)'); }
    else { gr.addColorStop(0, 'rgba(255,240,180,1)'); gr.addColorStop(1, 'rgba(255,120,20,0)'); }
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
    const tex = new THREE.CanvasTexture(c);
    for (let i = 0; i < (smoke ? 24 : 40); i++) {
      const o = { map: tex, blending: smoke ? THREE.NormalBlending : THREE.AdditiveBlending, depthWrite: false, transparent: true };
      const m = moving ? new THREE.SpriteNodeMaterial(o) : new THREE.SpriteMaterial(o), sp = new THREE.Sprite(m); sp.scale.setScalar(smoke ? 1.1 : .5);
      if (moving) { sp.userData.at = uniform(new THREE.Vector3()); sp.userData.step = uniform(new THREE.Vector3()); particleMotion(m, sp.userData.at, sp.userData.step); }
      scene.add(sp); sparks.push(sp);
    }
  }
  // 'copies': boxes in rows, as gs.props hands them over (a stand-in for the copies library's mesh: its
  // matrices, and two detail levels that look the same, so only their motion can tell them apart)
  let copies = null;
  if (kind === 'copies') {
    const nx = 14, nz = 11, n = nx * nz, D = new Float32Array(n * 16), M4 = new THREE.Matrix4();
    for (let i = 0; i < n; i++) M4.makeRotationY(i * 1.3).setPosition((i % nx - (nx - 1) / 2) * 2.5 + (i * 7 % 5) * .2, 1, -1 - Math.floor(i / nx) * 2.5).toArray(D, i * 16);
    const geo = new THREE.BoxGeometry(1, 2, 1); geo.computeBoundingSphere();
    const m = mat('#e08030'), lv = [{ object: { geometry: geo, material: m }, distance: 0, hysteresis: 0 }, { object: { geometry: geo, material: m }, distance: 144, hysteresis: 0 }];
    const im = { name: 'props:box', geometry: geo, material: m, castShadow: false, receiveShadow: false, matrixWorld: new THREE.Matrix4(), _capacity: n, _instancesArrayCount: n,
      matricesTexture: { _data: D, enqueueUpdate() {} }, colorsTexture: null, getActiveAndVisibilityAt: i => i < n, LODinfo: { render: { levels: lv } } };
    copies = { tw: gpuProps(im), lv }; scene.add(copies.tw.group);
  }
  // 'shapes': blend shapes (morph targets, as the kit's fur shells and faces use them) in a still view: a ball
  // held pushed out by its shape (fur standing out from the skin) that bobs on a bone, and a block whose shape comes and goes (a
  // mouth talking). Their motion must be the shapes' own change, not the whole offset every frame
  let shaped = null;
  if (kind === 'shapes') {
    const ball = new THREE.SphereGeometry(.7, 48, 24), out = new Float32Array(ball.attributes.position.count * 3), nr = ball.attributes.normal.array;
    for (let i = 0; i < out.length; i++) out[i] = nr[i] * .5;
    ball.morphAttributes.position = [new THREE.Float32BufferAttribute(out, 3)]; ball.morphTargetsRelative = true;
    // (skinned to one bone that bobs, as the kit's furry creatures are: a frame ago's shape under a frame ago's bones)
    const nv = ball.attributes.position.count;
    ball.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(new Uint16Array(nv * 4), 4)); ball.setAttribute('skinWeight', new THREE.Float32BufferAttribute(new Float32Array(nv * 4).map((_, i) => i % 4 ? 0 : 1), 4));
    const fur = new THREE.SkinnedMesh(ball, mat('#d09050')), bone = new THREE.Bone(); fur.add(bone); fur.bind(new THREE.Skeleton([bone]));
    fur.position.set(-1.6, 1.6, 2.5); fur.morphTargetInfluences[0] = 1; scene.add(fur);
    const blk = new THREE.BoxGeometry(1.6, 1, 1, 8, 8, 8), bp = blk.attributes.position.array, up = new Float32Array(bp.length);
    for (let i = 0; i < bp.length; i += 3) if (bp[i + 1] > 0) { up[i] = bp[i] * .4; up[i + 1] = .9; }
    blk.morphAttributes.position = [new THREE.Float32BufferAttribute(up, 3)]; blk.morphTargetsRelative = true;
    const mouth = new THREE.Mesh(blk, mat('#c04060')); mouth.position.set(1.5, 1.2, 2.5); scene.add(mouth);
    shaped = { mouth, bone };
  }
  const sparkAt = (i, t, v) => { const a = i * 2.4, r = 1 + (i % 7) * .5; return v.set(Math.cos(a + t * 3) * r, 1.5 + Math.sin(a * 3 + t * 4) * 1.2, 1 + Math.sin(a + t * 3) * r * .5); };
  const V = new THREE.Vector3();
  const set = t => {
    // things race across, spin and bob ('curve': whirl round in tight circles); the camera turns round
    // the scene ('turn'), turns where it stands, faster and faster ('pan'), strafes ('strafe') or stays ('still')
    if (shaped) { shaped.mouth.morphTargetInfluences[0] = .5 + .5 * Math.sin(t * 9); shaped.bone.position.y = .4 * Math.sin(t * 5); t = 1.3; }   // (the rest stands still)
    things.forEach((m, i) => {
      const sp = 3 + i * 1.3, ph = i * 1.7;
      if (kind === 'curve') { const w = 11 - i, R = 1.2 + i * .25, a = t * w + ph; m.position.set(-2.5 + i + Math.cos(a) * R, 1.4 + Math.sin(a) * R * .7, -2 - i * 1.2 + Math.sin(a) * R * .5); }
      else m.position.set(Math.sin(t * sp * .4 + ph) * 5, .8 + Math.abs(Math.sin(t * 3 + ph)) * 1.2, -2 - i * 1.5);
      m.rotation.set(t * 2 + i, t * 3 + i, 0);
    });
    if (glass) glass.position.set(Math.sin(t * 2.5) * 4, 1.6, 3.5);
    // 'scroll': the ground's picture slides along (a conveyor, a river) while the ground itself stays put
    if (kind === 'scroll') { gt.offset.set(t * 1.5, t * .4); gt.updateMatrix(); }
    sparks.forEach((sp, i) => {
      sparkAt(i, t, sp.position);
      // its world position, and how far it went since the last real frame
      if (moving) { sp.userData.at.value.copy(sp.position); sp.userData.step.value.copy(sp.position).sub(sparkAt(i, t - H, V)); }
    });
    if (kind === 'pan') {
      const yaw = .4 + t * 1.6 + t * t * 1.5;
      cam.position.set(0, 2.2, 6); cam.lookAt(Math.sin(yaw) * -10, 1.2, 6 - Math.cos(yaw) * 10);
    } else if (kind === 'cut' && t > 1.3 - 1e-4) {
      // 'cut': from the newest real frame on, the camera is somewhere else entirely
      cam.position.set(-7, 6, -14); cam.lookAt(2, 0, 2);
    } else {
      const fixed = kind === 'still' || kind === 'shapes' || kind === 'turn' || kind === 'shadow' || kind === 'scroll' || kind === 'cut';
      const a = kind === 'turn' ? t * 1.2 : 0, sx = fixed ? 0 : Math.sin(t * 2) * 3;
      cam.position.set(sx + Math.sin(a) * 9, 3.2, Math.cos(a) * 9); cam.lookAt(sx, 1, -3);
    }
    cam.updateMatrixWorld();
    // from the newest real frame on, the far level takes over at 30 m, not 12
    if (copies) { copies.lv[1].distance = t > 1.3 - H / 2 - 1e-4 ? 900 : 144; copies.tw.sync(cam); }
  };
  return { scene, cam, set, glass, sparks };
}

// draw a texture into an RGBA8 target and read it back
const quadMat = new THREE.NodeMaterial(), src = texture(new THREE.Texture()); quadMat.fragmentNode = vec4(src.sample(uv()).rgb, 1);
const quad = new THREE.QuadMesh(quadMat), rt8 = new THREE.RenderTarget(OW, OH);
async function grab(tex) {
  src.value = tex; r.setRenderTarget(rt8); quad.render(r); r.setRenderTarget(null);
  const px = await r.readRenderTargetPixelsAsync(rt8, 0, 0, OW, OH);
  if (px.length === OW * OH * 4) return px;
  // WebGPU pads each row to 256 bytes: take the padding out
  const row = px.length / OH, tight = new Uint8Array(OW * OH * 4);
  for (let y = 0; y < OH; y++) tight.set(px.subarray(y * row, y * row + OW * 4), y * OW * 4);
  return tight;
}
const mixMat = new THREE.NodeMaterial(), ma = texture(new THREE.Texture()), mb = texture(new THREE.Texture()); mixMat.fragmentNode = vec4(mix(ma.sample(uv()).rgb, mb.sample(uv()).rgb, .5), 1);
const mixQuad = new THREE.QuadMesh(mixMat), mixRT = new THREE.RenderTarget(OW, OH, { type: THREE.HalfFloatType });
const copyRT = (tex, rt) => { src.value = tex; r.setRenderTarget(rt); quad.render(r); r.setRenderTarget(null); };

// error against the truth: mean |difference| out of 255, and the share of pixels off by more than 40 (visible breaks)
function score(a, b) {
  let s = 0, bad = 0; const n = OW * OH;
  for (let i = 0; i < n; i++) { const d = (Math.abs(a[i * 4] - b[i * 4]) + Math.abs(a[i * 4 + 1] - b[i * 4 + 1]) + Math.abs(a[i * 4 + 2] - b[i * 4 + 2])) / 3; s += d; if (d > 40) bad++; }
  return { error: +(s / n).toFixed(2), broken: +(100 * bad / n).toFixed(2) };
}
function shot(px) {
  const c = document.createElement('canvas'); c.width = OW; c.height = OH; const g = c.getContext('2d'), im = g.createImageData(OW, OH);
  // the read is bottom row first on WebGL but top first on WebGPU
  im.data.set(px); g.putImageData(im, 0, 0); return c.toDataURL('image/png');
}

// 'aim': fresh aim's turn of a shown frame (as the app's show pass does it: the picture sampled at
// warpUV(screenUV, homography(now, then))) against the scene drawn with the camera turned and zoomed that much
const warpT = texture(new THREE.Texture()), warpH = uniform(new THREE.Matrix3()), warpMat = new THREE.NodeMaterial();
warpMat.fragmentNode = vec4(warpT.sample(warpUV(screenUV, warpH)).rgb, 1);
const warpQuad = new THREE.QuadMesh(warpMat), warpRT = new THREE.RenderTarget(OW, OH, { type: THREE.HalfFloatType });
async function aimCheck() {
  const S = makeScene('still'), sp = pass(S.scene, S.cam), pp = new THREE.RenderPipeline(r); pp.outputNode = sp; pp.outputColorTransform = false;
  const shot1 = async () => { await new Promise(requestAnimationFrame); pp.render(); return sp.getTexture('output'); };
  S.set(1.3); S.cam.rotation.order = 'YXZ'; const y0 = S.cam.rotation.y, x0 = S.cam.rotation.x, f0 = S.cam.fov;
  const then = poseOf(S.cam); const tex = await shot1(); const keep = new THREE.RenderTarget(OW, OH, { type: THREE.HalfFloatType }); copyRT(tex, keep);
  const shown = await grab(keep.texture);
  // the finger turned the look right and up a little, and a scope zoomed in a touch
  S.cam.rotation.set(x0 + .05, y0 - .09, 0, 'YXZ'); S.cam.fov = f0 * .96; S.cam.updateProjectionMatrix(); S.cam.updateMatrixWorld();
  const now = poseOf(S.cam), truth = await grab(await shot1());
  homography(now, then, warpH.value); warpT.value = keep.texture; r.setRenderTarget(warpRT); warpQuad.render(r); r.setRenderTarget(null);
  const turned = await grab(warpRT.texture);
  out.scenes.aim = { framegen: score(turned, truth), repeat: score(shown, truth), mix: null, ms: 0 };
  if (Q.has('shots')) Object.assign(out.shots, { 'aim-framegen': shot(turned), 'aim-truth': shot(truth), 'aim-repeat': shot(shown) });
  pp.dispose?.(); keep.dispose();
}

try {
  for (const kind of KINDS) {
    if (kind === 'aim') { await aimCheck(); continue; }
    const S = makeScene(kind), jitter = kind === 'jitter';
    // &mask=0: the plain outputs, without the see-through mask (to compare)
    const mask = Q.get('mask') !== '0', sp = pass(S.scene, S.cam); sp.setMRT(mask ? frameGenMRT() : mrt({ output, velocity }));
    sp.setResolutionScale(1 / scale);
    const pp = new THREE.RenderPipeline(r); pp.outputNode = sp; pp.outputColorTransform = false;
    // jitter: motion and depth come from a shaking camera (as SGSR 2 draws them), the picture from a
    // steady one (as SGSR 2 gives it out), and the shake between the two frames is passed on
    let n = 0, jd = [0, 0], jit = [0, 0];
    const lastVP = new THREE.Matrix4(), vp = new THREE.Matrix4();
    const halton = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
    const steadyCam = jitter ? S.cam.clone() : null, steady = jitter ? pass(S.scene, steadyCam) : null;
    const pps = jitter ? new THREE.RenderPipeline(r) : null; if (pps) { pps.outputNode = steady; pps.outputColorTransform = false; }
    const fg = new FrameGen(r, { flow: Q.get('flow') !== '0', fill: Q.get('fill') !== '0', sharp: Q.get('sharp') !== '0', quick: Q.get('quick') !== '0' });
    const prev = new THREE.RenderTarget(OW, OH, { type: THREE.HalfFloatType });
    // three's passes draw once per animation frame, so each real frame waits for the next one
    const t0 = 1.3, frame = async (t, shake = jitter) => {
      await new Promise(requestAnimationFrame); S.set(t);
      if (jitter) {
        steadyCam.copy(S.cam); steadyCam.clearViewOffset(); steadyCam.updateMatrixWorld();
        // the shift in NDC a view offset makes is minus the projection's z column x and y
        const prev = [-S.cam.projectionMatrix.elements[8], -S.cam.projectionMatrix.elements[9]];
        if (shake) { n++; S.cam.setViewOffset(RW, RH, halton(n, 2) - .5, halton(n, 3) - .5, RW, RH); } else S.cam.clearViewOffset();
        S.cam.updateProjectionMatrix();
        const now = [-S.cam.projectionMatrix.elements[8], -S.cam.projectionMatrix.elements[9]], se = steadyCam.projectionMatrix.elements;
        jd = [now[0] - prev[0], now[1] - prev[1]]; jit = [now[0] + se[8], now[1] + se[9]];
        pps.render();
      }
      // the camera at the last real frame, for the sparks that say how they move (the app does the same)
      fgPrevVP.value.copy(lastVP); vp.multiplyMatrices(S.cam.projectionMatrix, S.cam.matrixWorldInverse);
      pp.render();
      lastVP.copy(vp);
    };
    const colorOf = () => (jitter ? steady : sp).getTexture('output');
    // &handed: the last frame's picture is handed to real() (as the app does: it is read where it is,
    // not copied): prev holds it by the time the frames are made
    const feed = () => fg.real({ ...(Q.has('handed') ? { prevColor: prev.texture } : {}), eightBit: Q.has('eight'), color: colorOf(), velocity: sp.getTexture('velocity'), reactive: mask ? sp.getTexture('reactive') : null, depth: sp.getTextureNode('depth').value, renderSize: [RW, RH], outputSize: [OW, OH], camera: S.cam, jitter: jit, jitterDelta: Q.has('nojd') ? [0, 0] : jd });
    // warm the velocity history, then three real frames (the third back gives the curve)
    await frame(t0 - 3 * H); await frame(t0 - 2 * H); feed(); fg.keep();
    await frame(t0 - H); feed(); fg.keep(); copyRT(colorOf(), prev);
    await frame(t0); feed();
    const last = await grab(colorOf());        // newest real frame, shown again
    const before = await grab(prev.texture);
    ma.value = prev.texture; mb.value = colorOf(); r.setRenderTarget(mixRT); mixQuad.render(r); r.setRenderTarget(null);
    const blend = await grab(mixRT.texture);
    const made = []; let easy = null;
    for (const tm of TIMES) {
      const ms0 = performance.now(); fg.make(tm); await r.backend.device.queue.onSubmittedWorkDone();
      made.push({ tm, px: await grab(fg.output), ms: performance.now() - ms0 });
      easy ??= await fg.easyShare();   // (the tiles that took the quick way, sorted at the pair's first made frame)
      if (Q.has('cutinfo')) { const c = new Uint32Array(await r.getArrayBufferAsync(fg.cutAttr)); console.warn(`cut ${kind}: hist ${(c[67] / 4096).toFixed(3)} miss ${(c[68] / 4096).toFixed(3)} cut ${c[66]}`); }
    }
    // &bench=N: the first moment made N times more (the pair's shared work, the optical flow and the tile sort, is
    // done by then), each timed on its own: what one more made frame costs (software time, to compare two ways)
    let bench = null;
    if (Q.has('bench')) {
      const n = +Q.get('bench') || 8, t = [];
      for (let i = 0; i < n; i++) { const a = performance.now(); fg.make(TIMES[0]); await r.backend.device.queue.onSubmittedWorkDone(); t.push(performance.now() - a); }
      t.sort((a, b) => a - b); bench = +t[t.length >> 1].toFixed(1);
      // &probe: each of a made frame's steps on its own (software time, the middle of n)
      if (Q.has('probe')) {
        const each = { clear: fg.cClear, splat: fg.cSplat, resolve: fg.cResolve, fill: fg.cFill, compose: fg.cCompose, pyramid: fg.cPyr, inpaint: fg.cInpaint, empty: fg.cCutClear }, says = [];
        for (const [k, c] of Object.entries(each)) { const z = []; for (let i = 0; i < n; i++) { const a = performance.now(); r.compute(c); await r.backend.device.queue.onSubmittedWorkDone(); z.push(performance.now() - a); } z.sort((a, b) => a - b); says.push(`${k} ${z[z.length >> 1].toFixed(1)}`); }
        console.warn(`${kind} steps (ms): ${says.join(', ')}`);
      }
    }
    // the truth: the scene at each time (drawn last so the frames above are left alone); the error is the
    // mean over the made frames, broken the worst
    const sum = { framegen: [], repeat: [], mix: [] }; let ms = 0;
    for (const m of made) {
      await frame(t0 - H + m.tm * H, false);
      const truth = await grab(colorOf());
      // what the screen shows without frame generation: the newest real frame (ahead), or the last one
      // until the newest is due (blend: the newest is shown late by the same amount, so it's the same picture)
      sum.framegen.push(score(m.px, truth)); sum.repeat.push(score(ahead ? last : before, truth)); if (!ahead) sum.mix.push(score(blend, truth)); ms += m.ms;
      if (Q.has('shots')) { const tag = `${kind}-${Math.round(m.tm * 100)}`; Object.assign(out.shots, { [tag + '-framegen']: shot(m.px), [tag + '-truth']: shot(truth) }); }
    }
    const avg = l => l.length ? { error: +(l.reduce((s, x) => s + x.error, 0) / l.length).toFixed(2), broken: Math.max(...l.map(x => x.broken)) } : null;
    out.scenes[kind] = { framegen: avg(sum.framegen), repeat: avg(sum.repeat), mix: avg(sum.mix), ms: +(ms / made.length).toFixed(1), bench, easy: easy == null ? null : Math.round(easy * 100) };
    if (Q.has('shots')) Object.assign(out.shots, { [kind + '-repeat']: shot(ahead ? last : before), [kind + '-mix']: shot(blend) });
    fg.dispose(); pp.dispose?.(); pps?.dispose?.(); prev.dispose();
  }
  out.mode = ahead ? 'ahead' : 'blend'; out.scale = scale; out.steps = STEPS; out.times = TIMES.map(t => +t.toFixed(3));
} catch (e) { out.error = String(e && e.stack || e); }
window.result = out;
</script>
