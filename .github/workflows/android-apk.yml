# Builds a sideloadable debug APK of the whole game feed.
# Every push to main replaces the "Latest Android build" release, so the phone download link never changes:
#   https://github.com/robthewizzuk/game-scroll/releases/latest/download/game-scroll.apk
# Pull requests build the APK too (as a run artifact) so a broken Android build shows up before merging.
# Changes that never reach the app (docs, the website, the Workers) skip it.
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'site/**', 'workers/**', 'store/**', '.github/ISSUE_TEMPLATE/**']  # not in the app
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'site/**', 'workers/**', 'store/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04  # pinned: move to a newer image on purpose, not when ubuntu-latest flips
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Qualcomm NPU files pinned for this ONNX Runtime
        run: node scripts/qnn-pin.mjs --check

      - name: Build the web app
        run: npm run build

      - name: Copy it into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        # (the app only: the qnn module is for the store build, android/qnn)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk game-scroll.apk
          ls -l game-scroll.apk
          # Qualcomm's NPU libraries are never in our APK: it downloads them when a game first wants them (plugins/npu QnnRuntime.java)
          if unzip -Z1 game-scroll.apk | grep libQnn; then echo "::error::QNN libraries in the APK (above)"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: game-scroll-apk
          path: game-scroll.apk
          retention-days: 14

  # Only this job can write to the repository, and only for pushes to main.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: game-scroll-apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest game-scroll.apk \
            --target "$GITHUB_SHA" \
            --title "Latest Android build (#${GITHUB_RUN_NUMBER})" \
            --notes "Debug APK built from ${GITHUB_SHA::7} on $(date -u '+%d %b %Y %H:%M') UTC. Open this page on the phone and tap game-scroll.apk to install." \
            --latest
