    for (const mode of ['as it was', 'tiles', 'tiles', 'as it was']) { HD.shadowTiles = mode === 'tiles'; await walk(S, false, false); rows[mode].push(...(await walk(S, false, false)).rows); }
    for (const [mode, r] of Object.entries(rows))
      res[mode] = { backend: HD.info.backend, shadowTris: Math.round(mean(r.map(q => q.shTris))), shadowDraws: Math.round(mean(r.map(q => q.shCalls))), tris: Math.round(mean(r.map(q => q.tris))), draws: Math.round(mean(r.map(q => q.calls))), cpuMs: +med(r.map(q => q.cpu)).toFixed(2), cpuMean: +mean(r.map(q => q.cpu)).toFixed(2), worstMs: +Math.max(...r.map(q => q.cpu)).toFixed(1) };
    HD.shadowTiles = true; Object.assign(info, res); window.result = { out, info, checks }; throw 'bench done';
  }
  for (const fit of [false, true]) {
    const name = fit ? 'fitted to the view, with a near cascade' : 'following the camera';
    const A = await walk(village(fit), Q.has('control'), true), B = await walk(village(fit), true, true);   // (?control: both walks with their shadows whole, to see what two runs of the same thing differ by)
    const bad = []; let worst = 0, at = -1;
    for (let i = 0; i < FRAMES; i++) { const d = diff(A.pics[i], B.pics[i]); if (d.off > 0) { bad.push(i + ':' + d.off); if (d.off > worst) { worst = d.off; at = i; } } }
    // (WebGL: the maps themselves, frame by frame)
    let mapMost = 0, mapAt = -1, mapBlocks = 0, mapAll = 0, mapN = 0;
    for (let i = 0; i < Math.min(A.maps.length, B.maps.length); i++) for (let k = 0; k < A.maps[i].length; k++) { const d = mapDiff(A.maps[i][k], B.maps[i][k]); mapN++; mapAll += d.n; mapBlocks += d.block; if (Q.has('trace') && d.n) (info[(fit ? 'fit-' : '') + 'map-trace'] ||= []).push(`${i} light ${k}: ${d.n} texels differ, ${d.block} in blocks, merged groups ${A.rows[i].merged} / ${B.rows[i].merged}`); if (d.n > mapMost) { mapMost = d.n; mapAt = i; } }
    if (mapN) info[(fit ? 'fit-' : '') + 'maps'] = { maps: mapN, texelsOfEach: A.maps[0][0].length, differMostInAMap: mapMost, atFrame: mapAt, differAMap: +(mapAll / mapN).toFixed(1), inBlocksOfFour: mapBlocks };
    if (Q.has('control')) { const L = info[(fit ? 'fit-' : '') + 'control'] = []; for (let i = 0; i < FRAMES; i++) { const a = A.pics[i], b = B.pics[i], at = []; for (let j = 0; j < a.length; j += 4) if (Math.max(Math.abs(a[j] - b[j]), Math.abs(a[j + 1] - b[j + 1]), Math.abs(a[j + 2] - b[j + 2])) > 12) at.push((j / 4) % W + ',' + ((j / 4 / W) | 0) + ' ' + [a[j], a[j + 1], a[j + 2]] + ' / ' + [b[j], b[j + 1], b[j + 2]]); if (at.length || A.rows[i].tris !== B.rows[i].tris || A.rows[i].calls !== B.rows[i].calls) L.push(`${i}: tris ${A.rows[i].tris} / ${B.rows[i].tris} draws ${A.rows[i].calls} / ${B.rows[i].calls} shTris ${A.rows[i].shTris} / ${B.rows[i].shTris}  px ${at.slice(0, 4).join(' | ')}`); } }
    if (at >= 0) { const S = { c: document.createElement('canvas') }; S.c.width = W; S.c.height = H; const x = S.c.getContext('2d'); for (const [k, p] of [['tiles', A.pics[at]], ['whole', B.pics[at]]]) { x.putImageData(new ImageData(new Uint8ClampedArray(p), W, H), 0, 0); out[(fit ? 'fit-' : '') + 'bad-' + k] = S.c.toDataURL(); } }
    const col = (r, k) => r.map(q => q[k]), tA = sum(col(A.rows, 'shTris')), tB = sum(col(B.rows, 'shTris')), cA = sum(col(A.rows, 'shCalls')), cB = sum(col(B.rows, 'shCalls'));
    info[fit ? 'fitted' : 'following'] = { backend: HD.info.backend, frames: FRAMES, shadowTrisAFrame: Math.round(tA / FRAMES), whole: Math.round(tB / FRAMES), shadowDrawsAFrame: Math.round(cA / FRAMES), wholeDraws: Math.round(cB / FRAMES),
      slides: sum(col(A.rows, 'shSlid')), wholeRedraws: sum(col(A.rows, 'shWhole')), tilesDrawnAFrame: +(sum(col(A.rows, 'shTiles')) / FRAMES).toFixed(1), tilesPutBackAFrame: +(sum(col(A.rows, 'shPut')) / FRAMES).toFixed(1), framesWithNoShadowWork: A.rows.filter(q => !q.shCalls && !q.shSplit).length };
    if (Q.has('trace')) info[(fit ? 'fit-' : '') + 'trace'] = A.rows.map((q, i) => [i, 'tris', q.shTris, 'draws', q.shCalls, 'tiles', q.shTiles, 'put', q.shPut, q.shSlid ? 'slid' : '', q.shWhole ? 'WHOLE' : '', q.movers, q.plan].join(' '));
    // (A pixel or two on the soft edge of a shadow in a few frames. A part of the map drawn through a part of the light's view, or kept from
    // before the sun last stepped, places a triangle's edge a last bit away from where the whole map drawn now does, and now and then that
    // is one texel of the map. WebGL shows it less than WebGPU, and not at all once the village's still things have been merged.)
    const badPx = bad.map(q => +q.split(':')[1]);
    check(`${name}: every frame is the same picture from tiles as with every shadow drawn whole, to a pixel or two`, badPx.every(q => q <= 4) && sum(badPx) <= FRAMES * .2, bad.length ? 'frames:pixels ' + bad.slice(0, 14).join(' ') : 'all ' + FRAMES + ' the same');
    // (WebGL, where a map can be read back: the maps themselves, every frame. Stray texels on edges are that last bit; four together would be a shadow missing or left over.)
    if (mapN) check(`${name}: the shadow maps themselves differ from maps drawn whole only by stray texels on edges`, mapMost <= 150 && mapBlocks <= 2, `at most ${mapMost} of ${A.maps[0][0].length} texels in a map, ${(mapAll / mapN).toFixed(1)} on average, ${mapBlocks} in blocks of four, in ${mapN} maps`);
    if (!fit) { let dm = 0; A.S.v.scene.traverse(o => { if (o.isDetailMesh) dm++; }); check('the big mesh in the street is drawn in clusters, in the map as well', dm >= 1, dm + ' cluster-detail mesh'); }
    check(`${name}: tiles were in use`, sum(col(A.rows, 'shSplit')) > FRAMES * .3 && sum(col(B.rows, 'shSplit')) === 0, sum(col(A.rows, 'shSplit')) + ' frames');
    if (!fit) {
      check('a small share of the shadow triangles is drawn', tA < tB * .2, Math.round(tA / FRAMES) + ' a frame against ' + Math.round(tB / FRAMES));
      check('and of the shadow draws', cA < cB * .35, Math.round(cA / FRAMES) + ' a frame against ' + Math.round(cB / FRAMES));
      const sl = sum(col(A.rows, 'shSlid')), wh = sum(col(A.rows, 'shWhole'));
      check('the map slides with the camera, a tile at a time', sl >= 6, sl + ' slides');
      // (a set of copies has no place of its own in the map: the barrel carried off draws it whole as the set starts to count as moving, and again as it stops)
      check('and is drawn whole only at the start, after the jump and for the barrel carried off', wh <= 5, wh + ' times');
      // the walk (frames 21 to FA): the gate has stopped, the crate has gone: only the truck and the walker move, and now and then a slide
      const quiet = A.rows.slice(22, FA), noSlide = quiet.filter(q => !q.shSlid && !q.shWhole);
      check('between slides only the moving things are drawn', noSlide.length > 5 && Math.max(...noSlide.map(q => q.shCalls)) <= 12 && Math.max(...noSlide.map(q => q.shTiles)) === 0, 'at most ' + Math.max(...noSlide.map(q => q.shCalls)) + ' draws, ' + Math.max(...noSlide.map(q => q.shTiles)) + ' tiles drawn again');
      check('and the kept copy goes back only where they are', Math.max(...noSlide.map(q => q.shPut)) <= 40 && Math.min(...noSlide.map(q => q.shPut)) > 0, 'between ' + Math.min(...noSlide.map(q => q.shPut)) + ' and ' + Math.max(...noSlide.map(q => q.shPut)) + ' of 256 tiles');
      const stopped = A.rows.slice(11, 22);
      check('a gate that stops, a balloon that comes and a crate that goes redraw a few tiles, not the map', sum(stopped.map(q => q.shTiles)) > 0 && Math.max(...stopped.filter(q => !q.shSlid).map(q => q.shTiles)) <= 64, 'most in a frame: ' + Math.max(...stopped.filter(q => !q.shSlid).map(q => q.shTiles)));
      const still = A.rows.slice(FD + 5);
      check('with nothing moving, a camera that turns draws no shadows', still.length > 3 && still.every(q => !q.shCalls && !q.shSplit), sum(still.map(q => q.shCalls)) + ' draws in ' + still.length + ' frames');
    } else {
      check('fitted: fewer shadow triangles than drawing whole', tA < tB * .75, Math.round(tA / FRAMES) + ' a frame against ' + Math.round(tB / FRAMES));
    }
  }
  window.result = { out, info, checks };
} catch (e) { if (e !== 'bench done') window.result = { error: String(e?.stack || e), out, info, checks }; throw e; }
</script>
