<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222">
<script type="module">
// A film of gs.gas, for scripts/gas.cjs: a row for each thing smoke and fire do, a picture every so often
// along it, so how the gas rises, curls, spreads and is lit can be judged (and tuned) by eye. It also notes
// what the gas ran on, how many cells it had and what a frame of gas.update() cost.
//   ?acts=camp,room,blast (default: all)   &cols=6   &cell=300x380   &gpu (WebGPU)   &cells=20000   &klass=top|mid|low
//   &fps=30   &from=0&to=1 (the share of each act filmed)   &tier=2   &night (a dark scene: the fire lights it)
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';
const Q = new URLSearchParams(location.search), GPU = Q.has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
try {
  await loadParts();
  if (GPU && !await prepareGPU()) throw new Error('WebGPU did not start in this browser');
  const T = gs.THREE, frame = () => new Promise(r => requestAnimationFrame(r)), { Gas } = gs.gas, NIGHT = Q.has('night');
  if (Q.get('cells') || GPU) window.__gas.force = +(Q.get('cells') || 20000);
  if (Q.get('klass')) window.__gas.klass = Q.get('klass');
  const mk = (mat, geo, x, y, z) => { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; return m; };
  const wood = () => gs.hd.pbr('#5a3a22', { rough: .85 }), stone = () => gs.hd.pbr('#8d8a84', { rough: .9 }), red = () => gs.hd.pbr('#b8402a', { rough: .5 });
  // each act: how long, the camera, the gas's options, what is made (make: returns the scene's things) and what happens when
  const ACTS = {
    // a camp fire: flames, and its smoke climbing and leaning in a breath of wind
    camp: { secs: 7, eye: [0, 1.9, 7.5], aim: [0, 2.3, 0], gas: { box: [-3, 0, -3, 3, 7, 3], kind: 'fire', lamp: true },
      make: (g, S) => { S.fire = g.fire({ x: 0, y: .25, z: 0, size: 1.1 }); return [mk(wood(), new T.CylinderGeometry(.09, .09, 1.3, 8).rotateZ(1.2), 0, .15, 0), mk(wood(), new T.CylinderGeometry(.09, .09, 1.3, 8).rotateZ(-1.2).rotateY(1), 0, .15, 0), mk(stone(), new T.BoxGeometry(.5, 2.6, .5), 1.9, 1.3, 1.6), mk(stone(), new T.BoxGeometry(5, 3, .4), 0, 1.5, -3.4)]; },
      tick: (g, S, t) => { g.wind.x = t > 3.5 ? .9 : 0; } },
    // a closed room: smoke from a corner climbs, spreads under the ceiling and fills the room from the top down
    room: { secs: 9, eye: [0, 1.5, 6.8], aim: [0, 1.5, 0], gas: { box: [-3, 0, -2.5, 3, 3, 2.5], kind: 'smoke', open: false },
      make: (g, S) => { g.smoke({ x: -2, y: .3, z: -1.2, size: 1.1, rate: 1.5, heat: 1 }); const w = gs.hd.pbr('#c9c2b4', { rough: .9 }); return [mk(w, new T.BoxGeometry(6.2, 3, .2), 0, 1.5, -2.6), mk(w, new T.BoxGeometry(.2, 3, 5.2), -3.1, 1.5, 0), mk(w, new T.BoxGeometry(.2, 3, 5.2), 3.1, 1.5, 0), mk(w, new T.BoxGeometry(6.2, .2, 5.2), 0, 3.1, 0), mk(red(), new T.BoxGeometry(.9, .9, .9), 1.2, .45, .3)]; } },
    // an explosion: a fireball that rolls up into a mushroom and leaves its smoke
    blast: { secs: 4.5, eye: [0, 2.2, 9], aim: [0, 2.6, 0], gas: { box: [-4, 0, -4, 4, 8, 4], kind: 'fire', lamp: true },
      make: () => [mk(stone(), new T.BoxGeometry(1, 1.4, 1), -2.6, .7, 1.4), mk(stone(), new T.BoxGeometry(7, 3.5, .4), 0, 1.75, -4.4)],
      at: { .25: g => g.burst(0, .8, 0, { size: 2.2 }) } },
    // a chimney in the wind: the smoke streams away and breaks up
    wind: { secs: 7, eye: [1.5, 2.4, 9], aim: [1.2, 3, 0], gas: { box: [-3, 0, -2.5, 6, 6.5, 2.5], kind: 'smoke', wind: { x: 2.2 } },
      make: (g, S) => { g.smoke({ x: -1.6, y: 2.35, z: 0, size: .9, rate: 2, heat: 1 }); return [mk(gs.hd.pbr('#8a4a3a', { rough: .9 }), new T.BoxGeometry(.7, 2.2, .7), -1.6, 1.1, 0)]; } },
    // smoke goes round a ball that hangs in its way, and a box swept through it drags it along
    ball: { secs: 9, eye: [0, 2.2, 7.5], aim: [0, 2.6, 0], gas: { box: [-3, 0, -2.5, 3, 6, 2.5], kind: 'smoke' },
      make: (g, S) => { g.smoke({ x: 0, y: .3, z: 0, size: 1.1, rate: 1.5, heat: 1 }); S.ball = mk(red(), new T.SphereGeometry(.6, 28, 18), 0, 2.2, 0); g.ball({ r: .6, follow: S.ball }); S.bat = mk(stone(), new T.BoxGeometry(.3, 1.2, 2), -4, 4.2, 0); g.box({ w: .3, h: 1.2, d: 2, follow: S.bat }); return [S.ball, S.bat]; },
      tick: (g, S, t) => { S.bat.position.x = t > 6.5 ? -3 + (t - 6.5) * 3 : -4; } },
    // a torch: a blown jet of fire that swings round
    torch: { secs: 5, eye: [0, 1.8, 6.5], aim: [0, 1.8, 0], gas: { box: [-3.5, 0, -2.5, 3.5, 5, 2.5], kind: 'fire', lamp: true },
      make: (g, S) => { S.jet = g.fire({ x: -1.6, y: 1.4, z: 0, size: .6, power: 1.5, dir: [1, .15, 0], speed: 9 }); return [mk(stone(), new T.CylinderGeometry(.06, .06, .8, 10).rotateZ(1.4), -1.95, 1.35, 0)]; },
      tick: (g, S, t) => { const a = Math.sin(t * 1.3) * .7; S.jet.dir = [Math.cos(a), .15 + Math.sin(a) * .8, 0]; } },
    // dust: a crate lands and kicks up a ring of dust that settles (a heavy gas), and magic smoke with its own flame colours
    dust: { secs: 5, eye: [0, 1.7, 7], aim: [0, 1.2, 0], gas: { box: [-3.5, 0, -3, 3.5, 4, 3], kind: 'dust' },
      make: (g, S) => { S.crate = mk(wood(), new T.BoxGeometry(1, 1, 1), 0, 4, 0); g.box({ w: 1, h: 1, d: 1, follow: S.crate }); return [S.crate]; },
      tick: (g, S, t, dt) => { const p = S.crate.position; if (p.y > .5) { p.y = Math.max(.5, p.y - (2 + t * 14) * dt); if (p.y === .5) for (let a = 0; a < 6; a++) g.burst(Math.cos(a * 1.05) * .8, .25, Math.sin(a * 1.05) * .8, { size: 1.1, fire: 0, smoke: 1.2, force: .35 }); } } },
  };
  const acts = (Q.get('acts') || Object.keys(ACTS).join(',')).split(','), cols = +(Q.get('cols') || 6), [cw, ch] = (Q.get('cell') || '300x380').split('x').map(Number);
  const from = +(Q.get('from') || 0), to = +(Q.get('to') || 1), fps = +(Q.get('fps') || 30);
  window.__hd.force = +(Q.get('tier') || 2); window.__hd.upscale = false; window.__hd.hold = false;   // (a film: nothing waits, hidden, for its shader)
  const cell = document.createElement('canvas'); cell.width = cw; cell.height = ch; const cx = cell.getContext('2d');
  const sheet = document.createElement('canvas'); sheet.width = cw * cols; sheet.height = ch * acts.length; const sx = sheet.getContext('2d'); document.body.append(sheet);
  // &set=burn:5,soot:.8 : numbers of the gas to try (any of a kind's)
  const SET = Object.fromEntries((Q.get('set') || '').split(',').filter(Boolean).map(s => { const [k, n] = s.split(':'); return [k, isNaN(+n) ? n : +n]; }));
  const info = [], arr = (v, t, S) => typeof v === 'function' ? v(t, S) : v;
  const v = new gs.hd.HDView(NIGHT ? { bg: '#0b0e16', fog: 0, env: .08, amb: .08 } : { bg: '#9ab4d0', fog: 0, env: .5, amb: .45 });
  const sun = gs.hd.sun(NIGHT ? '#8fa6d8' : '#fff2d8', NIGHT ? .25 : 2.4, 14, [.55, .8, .45]); v.scene.add(sun, sun.target); v.sun = sun; sun.follow(0, 0, 0);
  const ground = new T.Mesh(new T.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), gs.hd.pbr(NIGHT ? '#3a4034' : '#6f7a5c', { rough: .95 })); ground.receiveShadow = true; v.scene.add(ground);
  for (let r = 0; r < acts.length; r++) {
    const A = ACTS[acts[r]]; if (!A) throw new Error('no act ' + acts[r] + ': ' + Object.keys(ACTS).join(', '));
    const world = new T.Group(); v.scene.add(world); const S = {};
    const g = new Gas(v, { ...A.gas, ...SET });
    for (const m of A.make?.(g, S) || []) world.add(m);
    const dt = 1 / fps, N = Math.round(A.secs / dt), events = Object.entries(A.at || {}).map(([t, fn]) => [Math.round(t / dt), fn]);
    const shots = Array.from({ length: cols }, (_, i) => Math.round((from + (to - from) * (i + .5) / cols) * N));
    let cost = 0, worst = 0, most = 0, hot = 0;
    for (let i = 0; i <= N; i++) {
      const t = i * dt;
      for (const [at, fn] of events) if (at === i) fn(g, S);
      A.tick?.(g, S, t, dt);
      const eye = arr(A.eye, t, S), aim = arr(A.aim, t, S);
      v.cam.fov = 50; v.cam.aspect = cw / ch; v.cam.near = .1; v.cam.far = 200; v.cam.updateProjectionMatrix(); v.cam.position.set(...eye); v.cam.lookAt(...aim); v.cam.updateMatrixWorld();
      const c0 = performance.now(); g.update(dt); const c = performance.now() - c0; if (i > 5) { cost += c; worst = Math.max(worst, c); }
      const k = shots.indexOf(i);
      // (on the graphics chip the gas steps when the view draws: every frame is drawn there)
      if (k >= 0 || g.backend === 'gpu') { v.t = t; v.render(cx, cw, ch); if (k >= 0 || i % 4 === 0) await frame(); }
      if (k >= 0) {
        if (g.backend === 'gpu') await g.twin?.answers(g.twin.r);
        most = Math.max(most, g.smokeIn()); hot = Math.max(hot, g.glow.power);
        v.t = t; v.render(cx, cw, ch); await frame();
        sx.drawImage(cell, k * cw, r * ch);
        sx.font = '11px sans-serif'; sx.fillStyle = NIGHT ? '#fff' : '#000'; sx.fillText(`${acts[r]} ${t.toFixed(2)}s`, k * cw + 4, r * ch + 12);
      }
    }
    const b = A.gas.box, top = g.smokeAt((b[0] + b[3]) / 2, b[4] - g.cell * 2, (b[2] + b[5]) / 2);
    info.push(`${acts[r]}: ${g.backend}, ${g.cells} cells of ${(g.cell * 100).toFixed(0)} cm${g.backend === 'cpu' ? `, ${g.puffs.n} puffs (${g.puffs.shown || 0} drawn)` : ''}; smoke in the box up to ${most.toFixed(3)}, near its top ${top.toFixed(3)}, fire up to ${hot.toFixed(2)}; gas.update ${(cost / N).toFixed(3)} ms a frame, worst ${worst.toFixed(2)}`);
    g.dispose(); v.scene.remove(world);
  }
  window.result = { sheet: sheet.toDataURL(), info, backend: window.__hd.info.backend };
} catch (e) { window.result = { error: String(e && e.stack || e) }; }
</script>
