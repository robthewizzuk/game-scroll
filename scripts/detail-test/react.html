<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<script type="module">
// The screen reacting to play (hd3d.js FINAL_EFFECTS react, vignette, hurt; hd3d-gpu.js the same) and a gun held in
// first person (gs.camera GunRig, CameraRig's first-person feel) for scripts/detail-test.cjs --page react [--webgpu]:
// a hit pulses the edges red and grey and wears off, low health drains the colour and closes the edges in with a
// heartbeat, aiming softens the edges and leaves the middle sharp, none of them builds a shader, and the held rifle
// kicks, aims to the middle and stays its size on screen as the view zooms to aim.
//   ?gpu  ?w=240&h=320
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';
const Q = new URLSearchParams(location.search), GPU = Q.has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
await loadParts();
const G = GPU ? await prepareGPU() : null;
if (GPU && !G) { window.result = { error: 'WebGPU did not start in this browser' }; throw new Error(window.result.error); }
const T = gs.THREE, HD = window.__hd, W = +(Q.get('w') || 240), H = +(Q.get('h') || 320);
HD.force = 2; HD.upscale = false; HD.grain = 0; HD.still = false; HD.hold = false; HD.spread = false;
const frame = () => new Promise(r => requestAnimationFrame(r));
const checks = [], info = {}, out = {};
const check = (name, ok, note) => checks.push({ name, ok: !!ok, note });
try {
  const v = new gs.hd.HDView({ bg: '#8aa4c0', fog: 0, amb: .5, fov: 70 }), c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  const sun = gs.hd.sun('#fff2d8', 2.6, 14, [.4, 1, .7]); v.scene.add(sun, sun.target); v.sun = sun; sun.follow(0, 0, -4);
  // a busy, colourful place: a chequered floor and coloured blocks, so softness and colour show
  const cols = ['#d04030', '#30a050', '#3060d0', '#e0c030', '#c050c0', '#30c0c0'];
  for (let i = -6; i <= 6; i++) for (let j = -12; j <= 2; j++) { const m = new T.Mesh(new T.BoxGeometry(1, .1, 1), gs.hd.pbr((i + j) & 1 ? '#f0ece4' : '#282828', { rough: .8 })); m.position.set(i, -.05, j); m.receiveShadow = true; v.scene.add(m); }
  for (let k = 0; k < 18; k++) { const m = new T.Mesh(new T.BoxGeometry(.7, .4 + (k % 4) * .5, .7), gs.hd.pbr(cols[k % 6], { rough: .6 })); m.position.set(((k * 7) % 11) - 5, .2 + (k % 4) * .25, -2 - ((k * 5) % 10)); m.castShadow = m.receiveShadow = true; v.scene.add(m); }
  const me = { position: new T.Vector3(0, 0, 1), yaw: Math.PI };
  const rig = new gs.camera.CameraRig(v, { mode: 'first' });
  const gun = gs.models.weapon ? gs.models.weapon('rifle') : new T.Mesh(new T.BoxGeometry(.06, .08, .6), gs.hd.pbr('#333'));
  const held = new gs.camera.GunRig(v, gun, { kind: 'rifle' });
  let now = 0;
  const step = dt => { now += dt; rig.update(dt, me); held.update(dt); };
  const draw = async (dt = 1 / 60) => { step(dt); v.t = 0; v.render(x, W, H); x.getImageData(0, 0, 1, 1); await frame(); };
  const settle = async n => { for (let i = 0; i < n; i++) await draw(); };
  const grab = () => x.getImageData(0, 0, W, H).data.slice();
  const pic = px => { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d'), im = g.createImageData(W, H); im.data.set(px); g.putImageData(im, 0, 0); return cv.toDataURL(); };
  // over the edges (outside .38 of the way to a corner) or the middle (inside .15): mean brightness, saturation, redness and sharpness
  const region = (px, edge) => {
    let n = 0, lum = 0, sat = 0, red = 0, sharp = 0;
    for (let y = 1; y < H - 1; y++) for (let xx = 1; xx < W - 1; xx++) {
      const dx = xx / W - .5, dy = y / H - .5, r2 = dx * dx + dy * dy;
      if (edge ? r2 < .38 * .38 : r2 > .15 * .15) continue;
      const i = (y * W + xx) * 4, r = px[i], g = px[i + 1], b = px[i + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      const l = (r + g + b) / 3, lr = (px[i + 4] + px[i + 5] + px[i + 6]) / 3, ld = (px[i + W * 4] + px[i + W * 4 + 1] + px[i + W * 4 + 2]) / 3;
      n++; lum += l; sat += mx - mn; red += r - (g + b) / 2; sharp += Math.abs(l - lr) + Math.abs(l - ld);
    }
    return { lum: +(lum / n).toFixed(1), sat: +(sat / n).toFixed(1), red: +(red / n).toFixed(1), sharp: +(sharp / n).toFixed(2) };
  };
  // shaders made from here on (the chip's shader modules on WebGPU, programs linked on WebGL)
  let made = 0; const watch = () => {
    if (G) { const dev = G.r.backend.device, cs = dev.createShaderModule.bind(dev); dev.createShaderModule = d => { made++; return cs(d); }; }
    else { const P = WebGL2RenderingContext.prototype, lp = P.linkProgram; P.linkProgram = function (q) { made++; return lp.call(this, q); }; }
  };

  await settle(30);
  const base = grab(); out.base = pic(base);
  const B = { edge: region(base, true), mid: region(base, false) }; info.base = B;
  watch();

  // a hit: the edges go red and grey, and it wears off
  v.hit(40); await draw();
  const hit = grab(); out.hit = pic(hit);
  const Hh = { edge: region(hit, true), mid: region(hit, false) }; info.hit = Hh;
  check('a hit turns the edges red', Hh.edge.red > B.edge.red + 6, `${B.edge.red} -> ${Hh.edge.red}`);
  check('a hit drains the colour', Hh.mid.sat < B.mid.sat * .8, `${B.mid.sat} -> ${Hh.mid.sat}`);
  for (let i = 0; i < 40; i++) await draw();   // (the frames' clock is the page's: about two thirds of a second or more)
  await new Promise(r => setTimeout(r, 700)); await settle(4);
  const after = grab(), A = { edge: region(after, true) }; info.after = A;
  check('the hit wears off', Math.abs(A.edge.red - B.edge.red) < 2 && v.pain === 0, `red ${A.edge.red}, pain ${v.pain}`);

  // low health: colour drains, the edges close in, and they pulse with a heartbeat
  v.health = .15; await new Promise(r => setTimeout(r, 1500)); await settle(4);
  const lows = []; for (let i = 0; i < 24; i++) { await draw(); await new Promise(r => setTimeout(r, 30)); lows.push(region(grab(), true).lum); }
  const low = grab(); out.low = pic(low);
  const L = { edge: region(low, true), mid: region(low, false) }; info.low = { ...L, pulse: [Math.min(...lows), Math.max(...lows)] };
  check('low health drains the colour', L.mid.sat < B.mid.sat * .6, `${B.mid.sat} -> ${L.mid.sat}`);
  check('low health closes the edges in', L.edge.lum < B.edge.lum * .85, `${B.edge.lum} -> ${L.edge.lum}`);
  check('the edges pulse with a heartbeat', Math.max(...lows) - Math.min(...lows) > 1.5, lows.map(n => n.toFixed(0)).join(' '));
  v.health = 1; for (let i = 0; i < 40; i++) { await draw(); await new Promise(r => setTimeout(r, 50)); }
  info.healed = region(grab(), true);
  check('healed, the screen is as it was', Math.abs(info.healed.lum - B.edge.lum) < 2, `${info.healed.lum} against ${B.edge.lum}`);

  // the held rifle: where it is at the hip, aiming (the view zooms; the gun holds its size), and kicked by a shot
  const gunBox = () => { gun.updateWorldMatrix(true, true); const b = new T.Box3().setFromObject(gun), p = []; for (const xx of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) p.push(new T.Vector3(xx, y, z).project(v.cam)); const xs = p.map(q => q.x), ys = p.map(q => q.y); return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys), w: Math.max(...xs) - Math.min(...xs) }; };
  const hipBox = gunBox(); info.hip = { box: hipBox, fov: v.cam.fov };
  // the gun's length on screen (grip to muzzle), as the view zooms in without aiming: the same
  const onScreen = () => { gun.updateWorldMatrix(true, true); const P = gun.points; if (!P?.muzzle) return 1; const a = P.grip.getWorldPosition(new T.Vector3()).project(v.cam), b = P.muzzle.getWorldPosition(new T.Vector3()).project(v.cam); return Math.hypot(a.x - b.x, a.y - b.y); };
  const len70 = onScreen(); rig.set({ fov: 40 }); for (let i = 0; i < 3; i++) step(1 / 60); const len40 = onScreen(); rig.set({ fov: null }); for (let i = 0; i < 3; i++) step(1 / 60);
  info.zoomed = { at70: +len70.toFixed(3), at40: +len40.toFixed(3) };
  check('the gun keeps its size on screen as the view zooms', Math.abs(len40 / len70 - 1) < .03, JSON.stringify(info.zoomed));
  held.aiming = true; for (let i = 0; i < 70; i++) step(1 / 60); await settle(4);
  const aim = grab(); out.aim = pic(aim);
  const aimBox = gunBox(), Am = { edge: region(aim, true), mid: region(aim, false) }; info.aim = { box: aimBox, fov: v.cam.fov, ...Am, viewAiming: v.aiming };
  check('aiming narrows the view', v.cam.fov < 60, v.cam.fov.toFixed(1));
  check('aiming brings the gun to the middle', Math.abs((aimBox.x0 + aimBox.x1) / 2) < Math.abs((hipBox.x0 + hipBox.x1) / 2) * .5, `${((hipBox.x0 + hipBox.x1) / 2).toFixed(2)} -> ${((aimBox.x0 + aimBox.x1) / 2).toFixed(2)}`);
  check('aiming softens the edges', Am.edge.sharp < B.edge.sharp * .85, `${B.edge.sharp} -> ${Am.edge.sharp}`);
  const camP = v.cam.rotation.x; const g0 = held.root.position.clone(), r0 = held.root.rotation.x;
  held.aiming = false; for (let i = 0; i < 60; i++) step(1 / 60);
  const g1 = held.root.position.clone(), rx1 = held.root.rotation.x, look0 = new T.Vector3(); v.cam.getWorldDirection(look0);
  held.fire(); step(1 / 60); step(1 / 60); step(1 / 60);
  const kicked = held.root.position.clone(), rxk = held.root.rotation.x, look1 = new T.Vector3(); v.cam.getWorldDirection(look1);
  info.kick = { back: +(kicked.z - g1.z).toFixed(3), rise: +(rxk - rx1).toFixed(3), viewUp: +(look1.y - look0.y).toFixed(4) };
  check('a shot pushes the gun back and tips it up', kicked.z - g1.z > .01 && rxk - rx1 > .02, JSON.stringify(info.kick));
  check('a shot punches the view up', look1.y - look0.y > .002, info.kick.viewUp);
  await draw(); out.kick = pic(grab());
  for (let i = 0; i < 90; i++) step(1 / 60);
  const settled = held.root.position.clone(), look2 = new T.Vector3(); v.cam.getWorldDirection(look2);
  check('then the gun and the view come back', settled.distanceTo(g1) < .004 && Math.abs(look2.y - look0.y) < .002, `${settled.distanceTo(g1).toFixed(4)}, ${(look2.y - look0.y).toFixed(4)}`);
  // walking: the eye bobs with the stride and the gun sways
  const ys = [], gx = []; for (let i = 0; i < 60; i++) { me.position.z -= 4 / 60; step(1 / 60); ys.push(v.cam.position.y); gx.push(held.root.position.x); }
  info.walk = { eye: [Math.min(...ys).toFixed(3), Math.max(...ys).toFixed(3)], gun: [Math.min(...gx).toFixed(3), Math.max(...gx).toFixed(3)] };
  check('walking bobs the eye and sways the gun', Math.max(...ys) - Math.min(...ys) > .01 && Math.max(...gx) - Math.min(...gx) > .006, JSON.stringify(info.walk));
  // a fall and a landing: the eye dips
  me.position.y = 1.2; step(1 / 60); for (let i = 0; i < 6; i++) { me.position.y -= .2; step(1 / 60); }
  me.position.y = 0; const dips = []; for (let i = 0; i < 30; i++) { step(1 / 60); dips.push(v.cam.position.y); }
  info.land = { lowest: Math.min(...dips).toFixed(3), eye: 1.65 };
  check('landing dips the eye', Math.min(...dips) < 1.65 - .04, info.land.lowest);
  info.shadersMade = made;
  check('none of it builds a shader in play', made === 0, made + ' made');
} catch (e) { window.result = { error: e.stack || String(e) }; throw e; }
window.result = { checks, info, out };
</script>
