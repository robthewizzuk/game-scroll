<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222">
<script type="module">
// A conversation played by people (gs.story.Talk), filmed for scripts/talk.cjs: two people at a market stall talk
// through a short ink scene with a choice; a picture of each line as the kit framed it (its shot, who speaks, the
// face's mood), then each of the gestures (gs.poses GESTURES) at its height, from the front and the side.
//   ?cell=360x240 &gpu (WebGPU) &gestures (the gestures only)
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';
import { loadStory } from '../../src/kit/story.js';
const Q = new URLSearchParams(location.search), GPU = Q.has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
try {
  await loadParts(); await loadStory();
  if (GPU && !await prepareGPU()) throw new Error('WebGPU did not start in this browser');
  const T = gs.THREE, frame = () => new Promise(r => requestAnimationFrame(r));
  const [cw, ch] = (Q.get('cell') || '360x240').split('x').map(Number);
  window.__hd.force = 2; window.__hd.upscale = false;
  const v = new gs.hd.HDView({ bg: '#a8c0d8', fog: 0, env: .45, amb: .3 }), cell = document.createElement('canvas'); cell.width = cw; cell.height = ch; const cx = cell.getContext('2d');
  const sun = gs.hd.sun('#fff2d8', 1.5, 8, [.6, .9, .4]); v.scene.add(sun, sun.target); v.sun = sun;
  const pbr = gs.hd.pbr, box = (w, h, d, c, x, y, z) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), pbr(c, { rough: .9 })); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; v.scene.add(m); return m; };
  box(30, .2, 30, '#8a8270', 0, -.1, 0); box(1.6, .9, .6, '#7a5636', -1.6, .45, .6); box(4, 2.6, .3, '#b9a98a', 0, 1.3, -2.6);
  const looks = [{ seed: 'hero-7', sex: 'm', outfit: { top: { kind: 'tunic', colour: '#4a5a3a' }, legs: { kind: 'breeches', colour: '#5a4a36' }, feet: { kind: 'boots', colour: '#3a2a1c' }, belt: { colour: '#2a1e14' } } },
    { seed: 'mara-2', sex: 'f', hair: '#3a2416', hairStyle: 'bun', outfit: { top: { kind: 'blouse', colour: '#7a3048' }, legs: { kind: 'trousers', colour: '#3a3a44' }, feet: { kind: 'shoes', colour: '#2a2020' } } }];
  await gs.models.human.ready(looks);
  const [hero, mara] = looks.map(o => gs.models.human(o));
  hero.position.set(0, 0, 1.1); hero.rotation.y = Math.PI; mara.position.set(0, 0, -.1);   // facing each other, 1.2 m apart
  for (const h of [hero, mara]) { v.scene.add(h); h.updateMatrixWorld(true); }
  const SCENE = `
EXTERNAL did(deed)
VAR town_rank = "neutral"
Morning, stranger. Looking for something? #who:mara #mood:smile .6 #shot:two
I hear you keep the old gate key. #who:hero #shot:over
Who told you that? #who:mara #mood:surprise .7 #do:shrug
* [Tell the truth] The miller did. He said you'd help. #who:hero #do:point
  Did he now. Well... for a friend of his. #who:mara #mood:smile #do:nod #shot:close
  ~ did("asked")
* [Bluff] Everyone knows. #who:hero
  Then everyone can wait. #who:mara #mood:angry .6 #do:shake #shot:close
- Off you go then. #who:mara #shot:wide #do:beckon`;
  const rep = new gs.rpg.Reputation({ factions: { town: {} }, deeds: { asked: { town: 5 } } });
  v.cam.fov = 38; v.cam.aspect = cw / ch; v.cam.near = .05; v.cam.far = 200; v.cam.updateProjectionMatrix();
  const cast = { hero: { person: hero, name: 'You' }, mara: { person: mara, name: 'Mara', voice: 'woman' } };
  const talk = new gs.story.Talk(new gs.story.Story(SCENE), { cast, hero: 'hero', camera: v.cam, view: v, rep, voices: false });
  const playing = [];
  talk.on('do', (move, who) => { cast[who].person.rig.play(move, { again: true }); playing.push(move + ':' + who); });
  const dt = 1 / 60, step = async n => { for (let i = 0; i < n; i++) { for (const h of [hero, mara]) { h.updateMatrixWorld(true); h.rig.update(dt); } talk.update(dt); if (i % 6 === 0) await frame(); } };
  const shots = [], snap = async label => { v.cam.updateMatrixWorld(); v.t = 0; v.render(cx, cw, ch); await frame(); v.render(cx, cw, ch); const c = document.createElement('canvas'); c.width = cw; c.height = ch; const g = c.getContext('2d'); g.drawImage(cell, 0, 0); g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, ch - 34, cw, 34); g.fillStyle = '#fff'; g.font = '12px sans-serif'; g.fillText(label, 6, ch - 20); g.fillStyle = '#ffd25a'; g.fillText(`${talk.who}: ${talk.text}`.slice(0, 64), 6, ch - 6); shots.push(c); };
  talk.start();
  const lines = [];
  for (let n = 0; n < 12 && !talk.ended && !Q.has('gestures'); n++) {
    await step(24);   // (a gesture is at its height about here)
    lines.push(`${talk.shot?.kind || '-'} ${talk.speaker}: ${talk.text} [${Object.entries(talk.line.tags).map(([k, x]) => k + ':' + x).join(' ')}]`);
    await snap(`#${n + 1} ${talk.shot?.kind || ''} shot`);
    await step(50); talk.tw.skip(); talk.tap();
    if (talk.choices.length) { await snap('choices: ' + talk.choices.map(c => c.text).join(' | ')); talk.choose(talk.choices[0].index); }
  }
  // the gestures, each at its height, from the front (three quarters) and the side
  mara.position.set(40, 0, 0); mara.updateMatrixWorld(true); hero.position.set(0, 0, 0); hero.rotation.y = 0;
  // (&extra={"name":{"time":1,"keys":[[0,{...}],[.5,{...}],[1,{...}]],"peak":.5}}: poses of your own to try, filmed after the gestures)
  const extra = Q.get('extra') ? JSON.parse(Q.get('extra')) : {};
  for (const [n, d] of Object.entries(extra)) hero.rig.add(n, gs.poses.keys(d.keys), { time: d.time || 1, once: true });
  const names = Q.has('extra') ? Object.keys(extra) : Object.keys(gs.poses.GESTURES), peaks = { nod: .2, shake: .16, bow: .45, shrug: .4, point: .5, cheer: .22, laugh: .42, think: .5, beckon: .38 };
  const g = [];
  for (const name of names) {
    hero.rig.play('idle', { fade: 0 }); await step(20); hero.rig.play(name, { again: true });
    const steps = Math.round((extra[name]?.peak ?? peaks[name]) * (extra[name]?.time ?? gs.poses.GESTURES[name].time) / dt) + 8;
    for (let i = 0; i < steps; i++) { hero.updateMatrixWorld(true); hero.rig.update(dt); }
    for (const [eye, label] of [[[1.4, 1.3, 2.6], 'front'], [[3.0, 1.2, 0], 'side']]) {
      v.cam.position.set(...eye); v.cam.lookAt(0, 1.05, 0); v.cam.updateMatrixWorld(); v.t = 0; v.render(cx, cw, ch); await frame(); v.render(cx, cw, ch);
      const c = document.createElement('canvas'); c.width = cw / 2; c.height = ch; const k = c.getContext('2d'); k.drawImage(cell, cw / 4, 0, cw / 2, ch, 0, 0, cw / 2, ch); k.fillStyle = '#000'; k.font = '12px sans-serif'; k.fillText(name + ' (' + label + ')', 5, 14); g.push(c);
    }
  }
  const cols = 3, rows = shots.length ? Math.ceil(shots.length / cols) : 0, gcols = 6, grows = Math.ceil(g.length / gcols);
  const sheet = document.createElement('canvas'); sheet.width = cw * cols; sheet.height = ch * (rows + grows); const sx = sheet.getContext('2d'); sx.fillStyle = '#222'; sx.fillRect(0, 0, sheet.width, sheet.height);
  shots.forEach((c, i) => sx.drawImage(c, (i % cols) * cw, Math.floor(i / cols) * ch));
  g.forEach((c, i) => sx.drawImage(c, (i % gcols) * cw / 2, (rows + Math.floor(i / gcols)) * ch));
  document.body.append(sheet);
  window.result = { sheet: sheet.toDataURL(), backend: GPU ? 'WebGPU' : 'WebGL', info: [...lines, 'gestures played: ' + playing.join(', '), 'town ' + rep.with('town')] };
} catch (e) { window.result = { error: String(e && e.stack || e) }; }
</script>
