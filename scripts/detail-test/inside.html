<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<script type="module">
// Rooms behind the city's doors (gs.city Interiors; src/kit/city-inside.js, city-doors.js) for scripts/detail-test.cjs
// --page inside: a downtown with a front door in every building. For each kind of room, a walker comes up the pavement
// to a door: shut while the room behind is not made, the room made a piece a frame as they come near, the door swinging
// open, then in through it (city.collide keeps them to the doorway and the room's walls and furniture) to the counter.
// Pictures from the street, through the open door, and from inside looking back out through the door and windows.
//   ?gpu  ?tier=2  ?w=240&h=320  ?kinds=store,diner  ?night
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';
const Q = new URLSearchParams(location.search), GPU = Q.has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
await loadParts();
const G = GPU ? await prepareGPU() : null;
if (GPU && !G) { window.result = { error: 'WebGPU did not start in this browser' }; throw new Error(window.result.error); }
const T = gs.THREE, HD = window.__hd, W = +(Q.get('w') || 240), H = +(Q.get('h') || 320);
HD.force = +(Q.get('tier') ?? 2); HD.upscale = false; HD.grain = 0; HD.hold = false; HD.spread = false;
const frame = () => new Promise(r => requestAnimationFrame(r));
const checks = [], info = {}, out = {};
const check = (name, ok, note) => checks.push({ name, ok: !!ok, note: String(note ?? '') });
const v = new gs.hd.HDView({ bg: '#9aa8c0', env: .5, amb: .45, fov: 70 }), c = document.createElement('canvas'); c.width = W; c.height = H;
const x = c.getContext('2d', { willReadFrequently: true });
const sun = gs.hd.sun('#fff0d8', 2.6, 70, [-.5, .8, .35]); v.scene.add(sun, sun.target); v.sun = sun;
v.cam.near = .1; v.cam.far = 900; v.cam.updateProjectionMatrix();
const draw = () => { v.t = 0; v.render(x, W, H); return x.getImageData(0, 0, W, H).data; };
const shot = async name => { for (let i = 0; i < (GPU ? 4 : 1); i++) { draw(); await frame(); } out[name] = c.toDataURL(); };
const look = (from, to, y = 1.6) => { v.cam.position.set(from.x, y, from.z); v.cam.lookAt(to.x, to.ty ?? y - .1, to.z); v.cam.updateMatrixWorld(); sun.follow?.(from.x, 0, from.z); };
try {
  const { City, Interiors, roomKind } = gs.city;
  const city = new City(v, { seed: 31, blocks: 3, style: 'downtown', traffic: .2, people: 0, crowd: false, sound: false, far: false, keep: Infinity, night: Q.has('night') ? 1 : 0 });
  city.warm();
  const want = (Q.get('kinds') || 'store,diner,bar,lobby').split(','), picked = new Map();
  // a building for each kind wanted: shops for the shop kinds, the others by their own kind; the nearest the city's middle first
  const mid = { x: 0, z: 0 }, list = city.plan.buildings.filter(b => b.doorway).sort((a, b) => Math.hypot(a.doorway.x - mid.x, a.doorway.z - mid.z) - Math.hypot(b.doorway.x - mid.x, b.doorway.z - mid.z));
  for (const k of want) { const b = list.find(b => !picked.has(b.id) && (['store', 'diner', 'bar'].includes(k) ? b.shops : roomKind(b) === k || k === 'lobby' && !b.shops)); if (b) picked.set(b.id, k); }
  const inside = new Interiors(city, { kinds: b => picked.get(b.id) || null });
  for (let i = 0; i < 3; i++) { city.update(1 / 30, city.start); inside.update(1 / 30, city.start); draw(); await frame(); }
  info.city = { buildings: city.plan.buildings.length, doors: city.doors.state.size, picked: [...picked.values()] };
  check('every building has its door', city.doors.state.size === city.plan.buildings.length, city.doors.state.size);
  for (const [id, kind] of picked) {
    const b = city.plan.buildings[id], h = b.doorway, P = (t, n) => ({ x: h.x + h.tx * t + h.nx * n, z: h.z + h.tz * t + h.nz * n });
    const walker = { ...P(0, 9), r: .3 }, step = (to, dt = 1 / 30) => { const dx = to.x - walker.x, dz = to.z - walker.z, d = Math.hypot(dx, dz), s = Math.min(d, 1.4 * dt); if (d > 1e-6) { walker.x += dx / d * s; walker.z += dz / d * s; } city.collide(walker, walker.r, .2); city.update(dt, walker); inside.update(dt, walker); };
    // from the street, the door shut
    for (let i = 0; i < 2; i++) step(walker);
    look(P(-1.5, 7), P(0, 0), 1.7); await shot(kind + '-1-street');
    check(kind + ': the door is shut before its room is made', city.doors.open(b) === 0 && !inside.rooms.size || ![...inside.rooms.values()].some(r => r.building === b && city.doors.open(b) > 0));
    // up to the door: the room is made on the way, and the door opens
    let frames = 0; while (Math.hypot(walker.x - h.x, walker.z - h.z) > 1.2 && frames < 400) { step(P(0, .9)); frames++; }
    for (let i = 0; i < 40 && city.doors.open(b) < 1; i++) step(walker);
    const room = b.room;
    check(kind + ': the room behind is made as the walker comes up to the door', !!room && room.kind === kind, room?.kind);
    check(kind + ': the door opens for them', city.doors.open(b) === 1, city.doors.open(b));
    look(P(1.2, 4), P(0, -3), 1.65); await shot(kind + '-2-open');
    // in, and across to the counter (the doorway and the room's walls and furniture hold them to the floor)
    const target = room.spots.counter; frames = 0; let into = null;
    for (const to of [P(0, -1.2), room.spots.door, target]) { for (let i = 0; i < 300 && Math.hypot(walker.x - to.x, walker.z - to.z) > .35; i++) { step(to); if (inside.entered) into = inside.room; } }
    check(kind + ': in through the door', into === room && inside.room === room, inside.room?.kind);
    check(kind + ': across the room to the counter', Math.hypot(walker.x - target.x, walker.z - target.z) < .6, Math.hypot(walker.x - target.x, walker.z - target.z).toFixed(2));
    check(kind + ': inside its walls', walker.x > room.x0 && walker.x < room.x1 && walker.z > room.z0 && walker.z < room.z1);
    const k = room.spots.keeper;
    look(room.spots.door, { x: k.x, z: k.z, ty: 1.2 }, 1.6); await shot(kind + '-3-in');
    look({ x: (k.x + target.x) / 2, z: (k.z + target.z) / 2 }, { x: h.x + h.nx * 5, z: h.z + h.nz * 5, ty: 1.3 }, 1.6); await shot(kind + '-4-out');
    // and back out: the door shuts behind them once they are away
    for (const to of [room.spots.door, P(0, -.2), P(0, 6)]) for (let i = 0; i < 300 && Math.hypot(walker.x - to.x, walker.z - to.z) > .35; i++) step(to);
    for (let i = 0; i < 90; i++) step(walker);
    check(kind + ': out again, and the door shut behind them', !inside.room && city.doors.open(b) === 0, city.doors.open(b));
    info[kind] = { boxes: room.boxes.length, pieces: room.pieces.length, lamps: room.lamps.length, seats: room.spots.seats.length, size: [+(room.x1 - room.x0).toFixed(1), +(room.z1 - room.z0).toFixed(1)] };
  }
  // a shut door holds: walking straight at one with no room made behind it gets nobody in
  const other = list.find(b => !picked.has(b.id)), h = other.doorway, walker = { x: h.x + h.nx * 3, z: h.z + h.nz * 3 };
  for (let i = 0; i < 150; i++) { walker.x -= h.nx * .05; walker.z -= h.nz * .05; city.collide(walker, .3, .2); }
  check('a shut door with no room behind it keeps the walker out', (walker.x - h.x) * h.nx + (walker.z - h.z) * h.nz > .25, ((walker.x - h.x) * h.nx + (walker.z - h.z) * h.nz).toFixed(2));
} catch (e) { window.result = { error: String(e && e.stack || e) }; }
window.result ||= { checks, info, out };
</script>
