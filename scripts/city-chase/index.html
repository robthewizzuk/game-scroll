<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222">
<script type="module">
// gs.city's traffic off its lanes, the police and street life, played for scripts/city-chase.cjs: a car the page
// drives round the city with stars on it, police cars after it, the traffic pulling over and swerving, a crash,
// people doing things, a full person knocked over, and a roadblock. A picture of each, and the numbers.
//   ?gpu (WebGPU)   &seed=7   &cell=480x360   &time=17.5 (the hour)   &phys=0 (no World3D: crashes slide by themselves)
//   &shots=chase,yield,crash,life,knock,block   &secs=24 (seconds of chase before the first picture)   &old (no fleet or crowd)
//   the police with guns (city-force.js): &shots=armed (officers out of their car, armed, firing), heli (the helicopter
//   over the player; &time=21 for its searchlight), boat (&style=harbour &phys=0: the player in a boat, police launches after it)
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';
const Q = new URLSearchParams(location.search), GPU = Q.has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
try {
  await loadParts(); if (Q.get('phys') !== '0') await gs.physics3d.loadPhysics3D();
  if (GPU && !await prepareGPU()) throw new Error('WebGPU did not start in this browser');
  const frame = () => new Promise(r => requestAnimationFrame(r));
  const shots = (Q.get('shots') || 'chase,yield,crash,life,knock,block').split(','), [cw, ch] = (Q.get('cell') || '480x360').split('x').map(Number);
  window.__hd.force = 2; window.__hd.upscale = false; window.__hd.hold = false;
  const cell = document.createElement('canvas'); cell.width = cw; cell.height = ch; const cx = cell.getContext('2d');
  const sheet = document.createElement('canvas'); sheet.width = cw * Math.min(3, shots.length); sheet.height = ch * Math.ceil(shots.length / 3); const sx = sheet.getContext('2d'); document.body.append(sheet);
  const v = new gs.hd.HDView({ bg: '#8a98b0', fog: .0022, env: .5, amb: .5, fov: 60 });
  v.cam.near = .2; v.cam.far = 900; v.cam.updateProjectionMatrix();
  const sun = gs.hd.sun('#ffc890', 2.4, 60, [-.6, .45, .3]); v.scene.add(sun, sun.target); v.sun = sun; v.onTier(t => sun.setTier(t));
  v.air({ haze: .0012, colour: '#9aa6bc' });
  const sky = new gs.sky.Sky(v, { time: +(Q.get('time') || 17.5), speed: 0, stars: 200, sun, physical: true, fog: true, env: true });
  const opts = { seed: +(Q.get('seed') || 7), blocks: 6, style: Q.get('style') || 'downtown', sky };
  if (Q.has('old')) Object.assign(opts, { fleet: false, crowd: false, parked: false });
  await gs.city.City.ready?.(opts); if (!Q.has('old')) await gs.city.Wanted.ready();
  const city = new gs.city.City(v, opts);
  const phys = Q.get('phys') !== '0' ? new gs.physics3d.World3D() : null;
  if (phys) city.solid(phys);
  const law = new gs.city.Wanted(city, null);
  city.warm?.();
  const info = [], T = city.cars, P = city.plan, R = gs.math.rng(5);
  const counts = {}; for (const k of ['stars', 'seen', 'lost', 'busted', 'escaped', 'call', 'block', 'shot', 'heli', 'boat', 'officer down', 'heli down']) law.on(k, () => { counts[k] = (counts[k] || 0) + 1; });
  // the player: a car driven along routes from corner to corner of the city, at a chase's speed
  const me = { x: 0, z: 0, heading: 0, v: 0, car: true };
  const start = city.spot('street', { rnd: R }); Object.assign(me, { x: start.x, z: start.z, heading: start.heading });
  let route = null, along = 0;
  const corners = [[P.bounds.x0 + 15, P.bounds.z0 + 15], [P.bounds.x1 - 15, P.bounds.z1 - 15], [P.bounds.x1 - 15, P.bounds.z0 + 15], [P.bounds.x0 + 15, P.bounds.z1 - 15]];
  let goal = 0, speed = 15;
  const drive = dt => {
    if (!route || along > route.length - 4) { const [gx, gz] = corners[goal++ % 4]; route = city.route(me, { x: gx, z: gz }); along = route.path.nearest(me.x, 0, me.z).d; }
    const turn = route.path.at(along + 9), now = route.path.at(along), h = Math.atan2(turn.x - now.x, turn.z - now.z), dh = Math.abs(Math.atan2(Math.sin(h - me.heading), Math.cos(h - me.heading)));
    const want = dh > .5 ? 7 : speed; me.v += Math.max(-9 * dt, Math.min(5 * dt, want - me.v)); along += me.v * dt;
    const p = route.path.at(along), q = route.path.at(along + 2); me.x = p.x; me.z = p.z; me.heading = Math.atan2(q.x - p.x, q.z - p.z);
  };
  let afoot = false, myBoat = null;
  const step = dt => { if (myBoat) myBoat.step(dt); else if (!afoot) drive(dt); city.avoid(me, 1.2); city.update(dt, me); phys?.step(dt); law.update(dt, me); sky.update(dt); };
  const H = window.__hd.info, shoot = async (name, at, look, n = 4) => {
    v.cam.aspect = cw / ch; v.cam.updateProjectionMatrix(); v.cam.position.set(...at); v.cam.lookAt(...look); v.cam.updateMatrixWorld(); sun.follow(at[0], 0, at[2]); v.cut?.();
    for (let i = 0; i < n; i++) { step(1 / 60); v.cam.position.set(...at); v.cam.lookAt(...look); v.cam.updateMatrixWorld(); H.shCalls = 0; v.render(cx, cw, ch); await frame(); }
    const k = shots.indexOf(name); sx.drawImage(cell, (k % 3) * cw, (k / 3 | 0) * ch);
    sx.font = '13px sans-serif'; sx.fillStyle = '#fff'; sx.fillText(name, (k % 3) * cw + 6, (k / 3 | 0) * ch + 16);
  };
  const behind = (c, back = 9, up = 3.5) => { const fx = Math.sin(c.heading), fz = Math.cos(c.heading); return [[c.x - fx * back, up, c.z - fz * back], [c.x + fx * 6, 1, c.z + fz * 6]]; };
  // a few seconds of the city as it is, then the stars
  for (let i = 0; i < 90; i++) step(1 / 30);
  const near = (list, f = q => q) => list.slice().sort((a, b) => Math.hypot(f(a).x - me.x, f(a).z - me.z) - Math.hypot(f(b).x - me.x, f(b).z - me.z))[0];
  if (shots.includes('armed')) {
    // on foot on the road (moving a little, so not caught at once), two stars: a car stops, its officers get out armed and fire
    afoot = true; Object.assign(me, { car: false, v: 2.5 }); law.set(2); law.seenNow(me);
    let t = 0; for (; t < 30 * 40 && !law.officers.some(o => o.armed && o.aim >= 1); t++) { step(1 / 30); if (t % 60 === 0) law.seenNow(me); }
    for (let i = 0; i < 45; i++) { step(1 / 30); if (Q.has('trace') && i % 9 === 0) info.push('officers: ' + law.officers.map(q => `${Math.hypot(q.x - me.x, q.z - me.z).toFixed(1)}m ${q.order?.do}/${q.order?.role} aim ${(q.aim || 0).toFixed(1)} sees ${q.sees} hp ${q.health?.hp} wield ${q.wield?.how}`).join(' | ')); }
    const o = near(law.officers.filter(q => q.armed)) || me, fx = o.x - me.x, fz = o.z - me.z, l = Math.hypot(fx, fz) || 1;
    await shoot('armed', [me.x - fx / l * 3 + fz / l * 1.6, 2.1, me.z - fz / l * 3 - fx / l * 1.6], [o.x, 1.2, o.z], 3);
    const hit = o !== me ? law.shoot({ x: me.x, y: 1.3, z: me.z }, { x: fx / l, y: 0, z: fz / l }, { damage: 30 }) : null;
    info.push(`armed: ${law.officers.filter(q => q.armed).length} armed officers (${law.officers.map(q => q.kind || '-')}) after ${(t / 30).toFixed(0)} s, ${counts.shot || 0} shots at the player; the player's shot hit ${hit ? hit.kind + (hit.head ? ' (head)' : '') + ', hp ' + hit.target.health?.hp : 'nothing'}`);
    law.set(0); afoot = false; me.car = true; for (let i = 0; i < 60; i++) step(1 / 30);
  }
  if (shots.includes('heli')) {
    // three stars: the helicopter comes and sits over the player (its searchlight on them at night)
    const plist = () => [...(gs.hd.bakeRenderer?.()?.info?.programs || [])].map(p => (p.name || '?') + '#' + (p.cacheKey || '')), progs = () => GPU ? null : plist().length, p0 = progs(), n0 = plist();
    law.set(3); law.seenNow(me);
    for (let i = 0; i < 30 * 20 && !(law.heli && law.heli.arrived); i++) step(1 / 30);
    for (let i = 0; i < 30 * 6; i++) step(1 / 30);
    const h = law.heli, q = h ? h.craft.pos : { x: me.x, y: 30, z: me.z }, fx = Math.sin(me.heading), fz = Math.cos(me.heading);
    await shoot('heli', [me.x - fx * 26 + fz * 14, 18, me.z - fz * 26 - fx * 14], [(q.x + me.x) / 2, q.y * .55, (q.z + me.z) / 2], 4);
    info.push(`heli: ${h ? `${Math.hypot(q.x - me.x, q.z - me.z).toFixed(0)} m off, ${q.y.toFixed(0)} m up, tactic ${h.tactic}, sees ${law.force.sees(me)}, light ${law.force.lamp.i.toFixed(0)}` : 'none'}${p0 != null ? `, shaders before ${p0} after ${progs()} (new: ${plist().filter(n => !n0.includes(n)).map(n => { const a = n.split(','); let best = null, bd = 1e9; for (const m of n0) { const b = m.split(','); if (b.length !== a.length) continue; let d = 0; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) d++; if (d < bd) { bd = d; best = b; } } return a[0].slice(0, 12) + ' differs at ' + (best ? a.map((x, i) => x !== best[i] ? i + ':' + JSON.stringify(best[i]) + '->' + JSON.stringify(x) : null).filter(Boolean).join(' ') : 'none'); }).join(' | ')})` : ''}`);
    law.set(0); for (let i = 0; i < 60; i++) step(1 / 30);
  }
  if (shots.includes('boat')) {
    // the player out on the harbour in a motor boat, three stars: police launches come after it
    const z0 = P.bounds.z1 + 60, water = (x, z) => z > P.bounds.z1 + 12 ? -.6 : null;
    law.force.waterOf.water = water;
    const look = gs.models.vehicle('boat', { style: 'motor', seed: 3 }); v.scene.add(look);
    const craft = new gs.craft.Boat({ height: (x, z) => water(x, z) ?? -Infinity }, { at: { x: (P.bounds.x0 + P.bounds.x1) / 2, z: z0 }, heading: Math.PI / 2, vehicle: look, power: 7, top: 12 });
    let bt = 0; myBoat = { step: dt => { bt += dt; craft.update(dt, { throttle: .8, steer: Math.sin(bt * .4) * .5 }); Object.assign(me, { x: craft.x, z: craft.z, y: craft.y, heading: craft.heading, v: craft.speed, car: true, boat: true }); } };
    for (let i = 0; i < 60; i++) step(1 / 30);
    law.set(3); law.seenNow(me);
    for (let i = 0; i < 30 * 30 && !law.boats.some(b => Math.hypot(b.craft.x - me.x, b.craft.z - me.z) < 30); i++) { step(1 / 30); if (i % 60 === 0) law.seenNow(me); }
    const b = near(law.boats, q => q.craft), c = b ? b.craft : craft, fx = Math.sin(c.heading), fz = -Math.cos(c.heading);
    await shoot('boat', [c.x - fx * 12 + fz * 6, 3.5, c.z - fz * 12 - fx * 6], [(c.x + me.x) / 2, .5, (c.z + me.z) / 2], 4);
    info.push(`boat: ${law.boats.length} police launches, nearest ${b ? Math.hypot(b.craft.x - me.x, b.craft.z - me.z).toFixed(0) + ' m, tactic ' + b.tactic + ', lights ' + b.model.sirenOn : '-'}, ${counts.shot || 0} shots`);
    law.set(0); myBoat = null;
  }
  law.set(3); law.seenNow(me);
  const secs = +(Q.get('secs') || 24);
  let laneMax = 0;
  for (let i = 0; i < secs * 30; i++) {
    step(1 / 30);
    if (Q.has('trace') && law.heli && i % 30 === 0) { const h = law.heli; info.push(`heli ${h.craft.pos.x.toFixed(0)},${h.craft.pos.y.toFixed(0)},${h.craft.pos.z.toFixed(0)} hp ${h.model.health.toFixed(2)} eng ${h.model.engine.toFixed(2)} down ${h.down} crashed ${h.craft.crashed} ground ${h.craft.onGround} ${h.tactic}`); } if (i % 15 === 0) { v.cam.position.set(me.x, 30, me.z - 20); v.cam.lookAt(me.x, 0, me.z); }
    if (Q.has('trace') && i % 60 === 0) info.push(`${(i / 30).toFixed(0)}s me ${me.v.toFixed(0)} m/s seen ${law.seen} know ${law.know.toFixed(1)} | ` + law.units.map(u => `${Math.hypot(u.car.x - me.x, u.car.z - me.z).toFixed(0)}m ${u.car.mode}/${u.car.chase?.how} ${u.car.v.toFixed(0)}m/s sees ${u.car.chase?.sees} ${u.tactic} rev ${(u.car.chase?.rev || 0).toFixed(1)} ${Math.abs(u.car.v) < 2 ? T.near(u.car, 9).filter(o => o !== u.car).map(o => o.mode + ':' + (o.why || '') + ':' + o.v.toFixed(0)).join(',') : ''}`).join(' | '));
  }
  const tactic = () => law.units.map(u => u.tactic).join(',');
  info.push(`after ${secs} s at 3 stars: ${law.units.length} police cars (${tactic()}), stars ${law.stars}, seen ${law.seen}, nearest ${law.units.length ? Math.min(...law.units.map(u => Math.hypot(u.car.x - me.x, u.car.z - me.z))).toFixed(0) : '-'} m, busting ${law.busting.toFixed(2)}`);
  if (shots.includes('chase')) {
    const u = law.units.slice().sort((a, b) => Math.hypot(a.car.x - me.x, a.car.z - me.z) - Math.hypot(b.car.x - me.x, b.car.z - me.z))[0];
    const c = u?.car || me, fx = Math.sin(c.heading), fz = Math.cos(c.heading);
    await shoot('chase', [c.x - fx * 8 + fz * 3, 3.2, c.z - fz * 8 - fx * 3], [c.x + fx * 8, 1, c.z + fz * 8]);
  }
  if (shots.includes('yield')) {
    const y = T.list.filter(c => c.yieldT > 0 && c.mode === 'lane').sort((a, b) => Math.hypot(a.x - me.x, a.z - me.z) - Math.hypot(b.x - me.x, b.z - me.z))[0] || T.list.find(c => c.dodge) || T.list[0];
    const fx = Math.sin(y.heading), fz = Math.cos(y.heading);
    await shoot('yield', [y.x - fx * 10 - fz * 2, 4, y.z - fz * 10 + fx * 2], [y.x + fx * 4, 0, y.z + fz * 4]);
  }
  if (shots.includes('crash')) {
    // a car near the camera hit hard from the side
    const c = T.list.filter(c => c.mode === 'lane' && !c.police && c.v > 4).sort((a, b) => Math.hypot(a.x - me.x, a.z - me.z) - Math.hypot(b.x - me.x, b.z - me.z))[0];
    if (c) {
      const fx = Math.sin(c.heading), fz = Math.cos(c.heading), at = [c.x + fz * 9 - fx * 6, 3.4, c.z - fx * 9 - fz * 6];
      T.crash(c, { x: fz * 11, z: -fx * 11 }, { at: { x: c.x + fx * 1.5, z: c.z + fz * 1.5 }, spin: 2.2 });
      for (let i = 0; i < 30; i++) { step(1 / 60); }
      await shoot('crash', at, [c.x, .6, c.z], 3);
      info.push(`crash: ${phys ? 'a body in the World3D' : 'a slide'}, ${c.mode} at ${Math.hypot(c.vx, c.vz).toFixed(1)} m/s, tilt ${(c.up ?? 1).toFixed(2)}`);
    }
  }
  // the police away for the people's pictures
  law.set(0);
  for (let i = 0; i < 60; i++) step(1 / 30);
  if (shots.includes('life')) {
    // where most people near the player are doing something
    const doing = city.people.list.filter(p => p.act && Math.hypot(p.x - me.x, p.z - me.z) < 70);
    // from the road side of them, a few metres off and a little high, with no tree, lamp or wall in the way
    const clamp = gs.util.clamp, clear = (a, p) => { const dx = p.x - a[0], dz = p.z - a[2], L = Math.hypot(dx, dz);
      for (const o of [...P.trees, ...P.lamps]) { const t = clamp(((o.x - a[0]) * dx + (o.z - a[2]) * dz) / (L * L), 0, 1); if (Math.hypot(a[0] + dx * t - o.x, a[2] + dz * t - o.z) < 1.6) return false; }
      return !city.ray({ x: a[0], y: 1.5, z: a[2] }, { x: dx, y: 0, z: dz }, L - .5); };
    const order = ['talk', 'phone', 'sit', 'look', 'in'], pick = doing.sort((a, b) => (order.indexOf(a.act.move) + 9) % 9 - (order.indexOf(b.act.move) + 9) % 9);
    let p = null, at = null;
    for (const q of pick) {
      const r = city.road(q.x, q.z), ox = r.x - q.x, oz = r.z - q.z, ol = Math.hypot(ox, oz) || 1;
      for (const side of [2, -2, 0, 3.5, -3.5]) { const a = [q.x + ox / ol * 5.5 + oz / ol * side, 2.3, q.z + oz / ol * 5.5 - ox / ol * side]; if (clear(a, q)) { p = q; at = a; break; } }
      if (p) break;
    }
    if (!p) { p = doing[0] || city.people.list[0]; at = [p.x + 4, 2.3, p.z + 4]; }
    await shoot('life', at, [p.x, 1.1, p.z], 6);
    const acts = {}; for (const q of city.people.list) { const k = q.act ? q.act.move : q.free ? 'going' : q.cross ? 'crossing' : q.wait > 0 ? 'waiting' : 'walking'; acts[k] = (acts[k] || 0) + 1; }
    info.push('people: ' + Object.entries(acts).map(([k, n]) => `${n} ${k}`).join(', ') + `, full ${city.people.fulls?.size ?? 0}`);
  }
  if (shots.includes('knock')) {
    const p = city.people.list.filter(q => q.down <= 0 && !q.act).sort((a, b) => Math.hypot(a.x - me.x, a.z - me.z) - Math.hypot(b.x - me.x, b.z - me.z))[0];
    const fx = Math.sin(p.heading), fz = Math.cos(p.heading), at = [p.x + fz * 4 + fx * 1, 1.6, p.z - fx * 4 + fz * 1];
    v.cam.position.set(...at); v.cam.lookAt(p.x, 1, p.z); v.cam.updateMatrixWorld();
    city.people.knock(p, fz, -fx, 2.2, { speed: 7 });
    for (let i = 0; i < 50; i++) { step(1 / 60); v.cam.position.set(...at); v.cam.lookAt(p.x, .8, p.z); }
    await shoot('knock', at, [p.x, .6, p.z], 3);
    info.push(`knocked: full ${!!p.full}, ${p.full ? p.full.react.state : 'crowd'}`);
  }
  if (shots.includes('block')) {
    law.set(4); law.seenNow(me);
    let u = null;
    for (let i = 0; i < 30 * 40 && !u; i++) { step(1 / 30); if (i % 60 === 0 && !law.seen) law.seenNow(me); u = law.units.find(x => x.roadblock || x.blocked); }   // (seen now and then: a sighting called in)
    if (u) {
      // from the way the player comes at it, once both cars are parked
      for (let i = 0; i < 20; i++) step(1 / 30);
      const a = u.blockAt, h = a.heading, fx = Math.sin(h), fz = Math.cos(h), cars = law.units.filter(x => x.roadblock).map(x => x.car);
      const mx = cars.reduce((s, c) => s + c.x, 0) / cars.length, mz = cars.reduce((s, c) => s + c.z, 0) / cars.length;
      await shoot('block', [mx - fx * 15 + fz * 1.5, 3.2, mz - fz * 15 - fx * 1.5], [mx, .8, mz]);
    }
    else { await shoot('block', behind(me)[0], behind(me)[1]); }
    info.push(`roadblock: ${u ? `up, ${law.units.filter(x => x.roadblock).length} cars, ${Math.hypot(u.car.x - me.x, u.car.z - me.z).toFixed(0)} m ahead` : 'none in 40 s'}; tactics ${tactic()}`);
  }
  info.push(`traffic: ${Object.entries(T.stats).map(([k, n]) => `${n} ${k}`).join(', ')}`);
  info.push(`police: ${Object.entries(counts).map(([k, n]) => `${k} ${n}`).join(', ')}; brain skill ${law.skill.toFixed(2)}, turn guess sure ${(law.turns?.sure ?? 0).toFixed(2)}`);
  window.result = { sheet: sheet.toDataURL(), info, backend: window.__hd.info.backend };
} catch (e) { window.result = { error: String(e && e.stack || e) }; }
</script>
